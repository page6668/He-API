    acceptance_criteria:
      - Moonshot-v1-8k / 32k / 128k 可调通
  - id: "4.4"
    title: GLM（智谱）适配器
    acceptance_criteria:
      - GLM-4 可调通
  - id: "4.5"
    title: Doubao（豆包）适配器
    acceptance_criteria:
      - Doubao-pro / lite 可调通
  - id: "4.6"
    title: 文心（百度）适配器
    acceptance_criteria:
      - ERNIE-4.0 可调通
  - id: "4.7"
