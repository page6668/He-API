    title: DeepSeek 适配器（流式 + 非流式）
    acceptance_criteria:
      - DeepSeek-V3 可调通
      - token 用量准确
  - id: "4.2"
    title: Qwen（通义千问）适配器
    acceptance_criteria:
      - Qwen-Max / Qwen-Plus 可调通
  - id: "4.3"
