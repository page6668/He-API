epic_id: 4
slug: model-adapters
title: 6 家中国大模型适配器
goal: 实现 6 家中国主流 LLM 的 plugin 适配器，规范化为 OpenAI 协议；并验证流式/非流式/token 用量准确透传
definition_of_done:
  - 6 家模型均可通过 /v1/chat/completions 以 OpenAI 协议调通
  - Token 用量准确（与上游官方计量误差 < 1%）
  - 能力矩阵公布
test_design_level: comprehensive
priority: P0
estimated_stories: 8
prerequisite_epics: [3]
unblocks_epics: [6, 9]
stories:
