epic_id: 1
slug: foundation
title: 项目地基与云基础设施
goal: 建立 monorepo、CI/CD、云资源、可观测性基础，为后续所有 Epic 提供可落地的工程地基
definition_of_done:
  - 开发者可在 5 分钟内通过 make dev 在本地启动完整栈
  - PR 自动跑 lint + unit + 部署到 staging
  - staging 环境可访问，含 OTel + Prometheus + Grafana
test_design_level: standard
priority: P0
estimated_stories: 7
prerequisite_epics: []
unblocks_epics: [2, 3]
stories:
  - id: "1.1"
    title: 创建 monorepo 骨架（Turborepo + apps/ + packages/）
    acceptance_criteria:
      - 仓库可 clone
      - pnpm i && pnpm build 全绿
  - id: "1.2"
    title: 搭建 CI/CD 流水线（GitHub Actions）
    acceptance_criteria:
      - PR 自动跑 lint / unit / integration
      - merge 自动部署 staging
  - id: "1.3"
    title: 阿里云 VPC + K8s 集群 + 基础网络（Terraform）
    acceptance_criteria:
      - K8s 集群可访问
      - Helm chart 可部署
  - id: "1.4"
    title: OpenTelemetry + Prometheus + Loki + Grafana 部署
    acceptance_criteria:
      - dashboard 可看到示例服务的 trace 与 metrics
  - id: "1.5"
    title: 内部 gRPC 服务模板（Go）
    acceptance_criteria:
      - 新服务可基于模板 5 分钟内 scaffold
  - id: "1.6"
    title: 数据库基础（Postgres + Redis + ClickHouse）
    acceptance_criteria:
      - 三个 DB 可达
      - migration 工具就绪（atlas 或 goose）
  - id: "1.7"
    title: staging 部署管线接通（GitOps 端到端）
    repository_type: monolith
    priority: P0
    estimated_complexity: high
    dependencies: ["1.2", "1.3"]
    acceptance_criteria:
      - "B1: deploy-staging.yml 的 ArgoCD 同步占位 echo 换成真实 argocd app sync"
      - "B2: build-images.yml 矩阵扩到全部 17 个可部署服务/cron 镜像"
      - "B3: 补齐缺失 ArgoCD Application(api-gateway/auth-svc/billing-svc/notification-svc) + 所有 app 读 values-staging.yaml + 定义 he-api AppProject"
      - "B4: 替换镜像占位符 ${ACR_REGISTRY}/$$ACR_REGISTRY 为真实仓库 + 消除 tag:latest(改 :SHA)"
      - "B5: 新增 Ingress 模板 + staging DNS/TLS 配置(staging hosts)"
      - "B6: 补 safety-log-retention/account-deletion-sweeper/db-doctor 三个 cron Dockerfile + billing-svc Deployment 模板"
      - "B7: 新建 payment-svc Helm chart 接入 5 支付密钥"
    out_of_scope:
      - "B8: prod 环境接线(数据层/values-prod/prod ArgoCD app) — staging 端到端跑通后再做"
    notes: "Story 1.4(GitOps 接线)未完成的部署收尾工作包。来源: docs/runbooks/deployment-prerequisites-and-audit.md PART B。"
