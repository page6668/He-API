# Architect Round 1 follow-through verification
architect_follow_through:
  oq1_helper_refactor:
    status: IMPLEMENTED
    evidence: |
      apps/auth-svc/internal/apikey/seed/seed.go exports SeedAPIKey;
      apps/auth-svc/cmd/issue-test-key/main.go consumes it; scripts/
      issue-test-key.sh wraps the binary; .github/workflows/lint.yml
      apikey-seed-boundary-guard job greps the import graph.
    dev_divergence: |
      Dev placed the helper in a NEW sub-package
      apps/auth-svc/internal/apikey/seed (not as a sibling file
      apps/auth-svc/internal/apikey/seed.go). Justification (per Dev
      Implementation Summary): the original OQ1 grep guard
      `grep -c 'apps/auth-svc/internal/apikey$'` would have FAILED
      against the existing Story-3.2 graph because auth-svc/cmd/server
      already links the parent apikey package for apikey.NewService
      (the ValidateApiKey RPC). The sub-package placement keeps the
      guard meaningful (suffix /seed$ vs /apikey$) and preserves the
      BR-2.8 invariant (production binaries cannot mint keys). The
      lint.yml job correctly targets the /seed$ suffix.
    qa_assessment: ACCEPTABLE — invariant preserved, mechanism is
      functionally equivalent, divergence is documented.
  oq2_rest_api_spec_backfill:
    status: IMPLEMENTED
    evidence: |
      docs/architecture/rest-api-spec.md §5.1.2 contains all 4 new
      rows (413_payload_too_large, 500_gateway_misconfigured,
      501_not_implemented, 501_streaming_not_implemented) + a §5.3
      Change Log entry attributing them to Story 3.3 (Wright Round 1
      OQ2 ruling) + Story 3.2 / 2.4 backfills.
  oq3_chatcmpl_prefix_family:
    status: PRESERVED
    evidence: |
      Story BR-3.3 + chat_completions.go const idPrefix = "chatcmpl-mock-"
      keep the prefix family consistent with Epic 4 adapter taxonomy
      per the Architect's ruling. No Story 3.3 text change required.
  oq4_constructor_injection:
    status: IMPLEMENTED
    evidence: |
      chat_completions.go defines ChatHandlerOption + WithIDFactory(f)
      + NewChatCompletionsHandler(logger, opts...). Tests use the
      option in TestChatCompletions_WithIDFactoryInjectable
      (alpha/beta parallel sub-tests with different stubs) +
      TestChatCompletions_WithIDFactoryNil (nil contract). Production
      call site at apps/api-gateway/cmd/server/main.go:224 omits the
      option (`handlers.NewChatCompletionsHandler(logger)`). No
      package-mutable `var NewID` pattern in the code.
  dev_divergence_envelope_writer:
    status: ACCEPTABLE
    finding: |
      BR-1.3 cites auth.go writeJSON / writeError, but Dev chose
      package-private writeChatJSON / writeChatError mirroring
      middleware.writeAPIKeyError (the 5-field §5.1.2 envelope Story
      3.2 BR-1.5 ratified). Documented in chat_completions.go file
      header. auth.go's 2-field envelope predates the §5.1.2 contract
      and would have understated the error shape. No new envelope is
      being defined — the §5.1.2 5-field envelope IS the contract.
    qa_assessment: ACCEPTABLE — Dev's choice aligns with the
      ratified §5.1.2 contract, not the BR-1.3 text. Story 3.2 BR-1.5
      takes precedence over Story 3.3 BR-1.3 here.

# NFR validation (Story 3.3 is not security-sensitive; performance + reliability covered)
nfr_validation:
  security:
    status: PASS
    notes: |
      No new credential / PII surface. messages[].content never logged
      (BR-1.8 PII non-leak verified via UNIT-016 sentinel substring
      negative check). BR-2.4 error-message non-reflection verified
      via UNIT-037 (TestChatCompletions_NoBodyEcho). Bearer-auth
      chain regression covered by INT-001 (positive) + INT-002
      (negative, handler-never-invoked sentinel).
  performance:
    status: PASS
    notes: |
      Cold-start regression bench (T5.3): Dev reports 7.59 ms mean
      across 3 runs (Apple M4, darwin/arm64) — well under Story-3.1
      1000 ms P95 SLO. crypto/rand reader + slog writer are lazy
      (first-use, sub-millisecond). Handler is stateless (newID +
      now are function pointers, no shared mutable state per-request).
      1000-call determinism test runs in 0.02 s.
  reliability:
    status: PASS
    notes: |
      Stateless handler; no DB / Redis / external network on the
      request path. crypto/rand failures panic (same posture as
      stdlib TLS); MaxBytesReader bounds memory; r.Context()
      propagates so OTel trace lifecycle stays intact (BR-1.9 via
      UNIT-017). Race-detector clean.
  maintainability:
    status: PASS
    notes: |
      Constructor-option pattern (WithIDFactory) precedented by
      NewAPIKeyAuthenticator at bearer_auth.go:204 — parallel-test
      safe. Pure validation function (validateChatRequest) keeps
      branches testable in isolation. MockContent exported as a
      single source of truth (per BR-3.3 / BR-4.2 / BR-4.4) so Epic
      4 contract tests have a stable reference. File-header
      comments explain BR-1.3 divergence + BR-4.1 caveat.

