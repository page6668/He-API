  - id: ISSUE-6
    severity: MEDIUM
    finding: "BR-2.5 commit-before-publish ordering — orphan-pending-row risk if Kafka publish fails post-PG-commit. T8.6 operator runbook + 15-min Grafana alert remain in §Deferred."
    failure_type: ordering_risk
    affected_acs: [AC2]
    status: carryover_round_1
