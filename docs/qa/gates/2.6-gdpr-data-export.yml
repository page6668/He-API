gate: CONCERNS
status_reason: |
  Round 2 review. All Round 1 blockers closed: 1 CRITICAL + 3 HIGH + 2 MEDIUM resolved. Story 2.6 now
  ships the full contract surface honestly — the production analytics-svc binary refuses to claim
  Kafka messages unless an operator explicitly sets HE_API_ANALYTICS_GDPR_WORKER_ENABLED=true
  (Option-C per Round 1 gate's own recommendation). AC1 BR-1.9 accessibility (focus trap, focus restore
  via requestAnimationFrame, document-level ESC, initial focus, overlay-click close) is fully
  implemented in ExportDataDialog.tsx. The 5 previously-zero-test packages
  (notification-svc/{audit,events,ratelimit,repository} + analytics-svc/workers) now have 34 top-level
  Test funcs across 5 new files — including miniredis 16-goroutine BR-2.5 race assertion (exactly-one-winner),
  TestBR65_PIIGuard_GDPREvents pinning the 3 GDPR event types to zero email/display_name/IP/UA, and
  workers tests covering BR-4.2 claim/double-consume/dumper-fail/email-fail/7-dumper invariant. The
  BR-2.5 doc/code drift is closed — repository's FindCurrentInWindow comment now honestly states the
  as-built design delegates atomicity to Redis Lua INCR, and labels SELECT … FOR UPDATE as "one
  acceptable mechanism" (not mandatory).

  Independent test execution clean across all surfaces: `go test -count=1 ./apps/api-gateway/internal/handlers/... ./apps/notification-svc/... ./apps/analytics-svc/... ./apps/auth-svc/...` ALL PASS (~150s; 5 newly-tested packages green; 21 existing PASS). `tsx scripts/check-i18n-keys.ts` PASS (3 namespaces × 10 locales). `pnpm --filter @he-api/console typecheck` clean (0 diagnostics).

  Why CONCERNS and not PASS: 3 carryover MEDIUM items (ISSUE-6 commit-before-publish ordering, ISSUE-8 BR-4.6 ZIP cap, ISSUE-9 BR-5.6 retry policy) remain open. All three are entirely behind the Option-C feature flag — the worker is not subscribed in production while NoOps are wired, so the code paths are inactive. They MUST be addressed before HE_API_ANALYTICS_GDPR_WORKER_ENABLED=true is set in any environment. The natural Phase-2 follow-up Story (OSS + ClickHouse SDK vendoring + real Store/Uploader/Email/Audit/Dumpers wiring + Option-C flag flip) inherits these as acceptance criteria. ISSUE-10 (LOW, BR-6.3 cta-key count) is an SM correction.

  Blind-spot coverage improved from 33% (Round 1) to 50% (3 of 6 covered): CONCURRENCY-RACE-2.5 (miniredis 16-goroutine), FLOW-DOUBLE-CONSUME (BR-4.2 already-claimed skip), BOUNDARY-A11Y-FOCUS (Dialog rewrite). Remaining 3 (DATA-PII-DUMP, RESOURCE-ZIP-MEM, ERROR-EMAIL-RETRY) are gated by Option-C and tracked in carryovers.

  Per qa-gate-decision logic: 0 CRITICAL + 0 HIGH + 3 MEDIUM → CONCERNS (mergeable; documents follow-up obligations).

