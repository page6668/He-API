    recommendation: "Address before HE_API_ANALYTICS_GDPR_WORKER_ENABLED=true. Either reverse ordering (publish-then-commit outbox) OR ship T8.6 operator runbook."
  - id: ISSUE-8
    severity: MEDIUM
    finding: "BR-4.6 ZIP size cap (100 MB hint) not enforced; worker builds ZIP in memory."
    failure_type: resource_risk
    affected_acs: [AC4]
    status: carryover_round_1
    gated_by: Option-C feature flag (worker not subscribed → no ZIP build active)
    recommendation: "Streaming tempfile path when total > 100MB; track as blind-spot RESOURCE-ZIP-MEM in Phase-2 follow-up."
  - id: ISSUE-9
    severity: MEDIUM
    finding: "BR-5.6 SendEmail retry policy (5s/30s/5min) not visible at worker layer; analytics-svc does single Send() then flips to 'failed'."
    failure_type: design_visibility
    affected_acs: [AC5]
    status: carryover_round_1
    gated_by: Option-C feature flag (worker not subscribed → no Send() invocation)
    recommendation: "Either confirm SendEmail-internal retry covers BR-5.6 OR add explicit retry loop at worker."
  - id: ISSUE-10
    severity: LOW
