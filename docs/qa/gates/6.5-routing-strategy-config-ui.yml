  performance: { status: PASS, notes: "Hot path: at most ONE pod-local Redis GET (+ conditional EXISTS on a hit) per chat request — sub-ms, within the 100ms routing budget; ZERO per-request auth-svc RPC on a cache hit (lazy GetMe only on miss). userDefault=UNSPECIFIED skips the tier entirely → zero added work when no default is set. No new DB read on the hot path." }
  reliability: { status: PASS, notes: "Fail-OPEN on every uncertain path (no reader / empty user / Redis error / GetMe error) → STRATEGY_UNSPECIFIED → STRATEGY_DEFAULT passthrough; a convenience preference NEVER blocks chat (Q-F). Sentinel-based cross-pod invalidation (Story-5.1/5.2 idiom) bounds the stale-routing window to seconds. Write-through is best-effort (never blocks the 200; gateway lazy-populates on next miss). Migration 0019 additive/nullable/reversible/non-destructive — existing rows need no backfill." }
  maintainability: { status: PASS, notes: "Extends, never rewrites, the 6.2 cascade (meta+header branches byte-identical). userpref.Resolver mirrors the Story-7.8 entitlement.Resolver seam; cache key/sentinel mirror Story-5.1/5.2 — established idioms reused, not reinvented. Additive contracts only (REST + gRPC); no new endpoint/RPC. Single enum-validation home in auth-svc (alongside locale/timezone)." }

