# ---- AC coverage (Step 4.6) ----
ac_coverage:
  coverage_rate: 100
  passed: true
  details:
    - ac_id: AC1
      title: "POST /v1/me/usage/logs/export + GET .../current — JWT-cookie, per-user IDOR, format=json|csv, ≤90d"
      status: VERIFIED
      code:
        - "gateway usage_log_export.go: user_id from middleware.UserIDFromContext (JWT sub) ONLY; json.Decoder.DisallowUnknownFields() rejects spoofed user_id/any unknown field (Architect Low-1 — me_keys.go precedent, not account_data empty-body); format json|csv required; resolveExportRange ≤90d (range_days 1..90, RFC3339 end>start, span≤90d); Cache-Control no-store; connect.Code→HTTP incl. ResourceExhausted→429_rate_limit_usage_log_export"
        - "notification-svc usage_log_export.go: InsertUsageLog(kind=usage_logs, format); Publish AFTER tx.Commit (BR-EX-9, verified line order); audit best-effort; separate rate-limit ns via UsageLogExportLimiter"
        - "repository/data_export_requests.go: 2.6 methods kind-scoped 'gdpr_full'; new FindCurrentUsageLogInWindow/FindLatestUsageLogForUser/InsertUsageLog scope 'usage_logs' (Architect HIGH condition)"
      tests: "gateway handler unit (-race); notif handler+repo unit (-race) incl. (kind,format) idempotency + publish-after-commit + cross-kind regression; INT full-chain CI-deferred"
    - ac_id: AC2
      title: "analytics-svc UsageLogExportWorker — dump→OSS→signed-URL→email, status machine, audit"
      status: VERIFIED
      code:
        - "dumps/request_logs_export.go: LogRow = EXACTLY 13 BR-RD-9 cols (NO client_ip/client_country/user_agent/error_message/cost_usd field — leak is a compile error); ExportColumns + LogRowSelectColumns byte-identical to 9.2 logsSelectColumns; csvSanitizeCell neutralizes =+-@\\t\\r (OWASP); rfc4180Field quoting + CRLF; writeJSONL one-object-per-line; unknown format = hard error"
        - "clickhouse/log_export_reader.go: logExportQuery WHERE user_id=? AND ts BETWEEN ?/? (IDOR fence on every read)"
        - "workers/usage_log_export.go: claim guard MarkProcessing(claimed=false→ack+skip); signedURL passed ONLY to Email.Send — never logged, never in failure_reason (failWithAudit uses usageLogSanitize(stage err) only), never persisted (MarkCompleted stores key+expiry only); per-stage failure attribution; offset committed after terminal state"
        - "templates/: usage_log_export_ready ×10 (txt+html) embedded; TemplateUsageLogExportReady const; render parity test"
        - "cmd/server/main.go: worker env-gated HE_API_ANALYTICS_USAGE_LOG_EXPORT_WORKER_ENABLED default false (BR-EX-10/17 — NoOp deps never silently ACK a real job)"
      tests: "dumps unit (PII/cost exclusion, CSV injection, RFC-4180, IDOR-to-fetcher, zero-rows); workers unit (claim guard, no-URL-in-reason, stages); template parity ×10; integration scaffold (-tags=integration, CI)"
    - ac_id: AC3
      title: "Console /{locale}/logs export control — format picker + status/banner, i18n×10 + a11y/RTL"
      status: VERIFIED
      code:
        - "components/business/LogExportDialog.tsx: format radiogroup; requestLogExport Server Action; in-progress + submit-disabled while pending|processing; emailed-link banner with localized expiry; NO raw signed URL in DOM (BR-UI-3)"
        - "_actions/request-log-export.ts + get-current-log-export.ts: 'use server', cookie passthrough, no-store, discriminated union ok|unauthorized|rate_limited|error; Zod safety-net"
        - "logs/page.tsx: imports LogExportDialog + hydrates current; messages/{10}/logs.json export.* keys; packages/i18n-keys/src/logs.ts hand-extended (codegen blocked, [[project_auth_surface_prebroken_head]])"
      tests: "vitest 16 pass / 1 skip — UNIT-040 no-raw-URL (P0), 041-046 states, 047 i18n×10 key-parity, 048 a11y, 049 RTL, BLIND-FLOW-001/002, ERROR-005, BOUNDARY-007"

# ---- HIGH-risk P0 verification (Step 5.5 — white-box, per risk profile) ----
high_risk_verification:
  - id: R-01
    risk: "IDOR — one user downloads another's logs"
    verdict: MITIGATED
    evidence: "gateway: user_id from JWT sub only + DisallowUnknownFields strict-reject of body user_id; worker: logExportQuery hard-codes `WHERE user_id = ?`; repo kind+user scoped. TestDump_PassesUserIDToFetcher + handler unit."
  - id: R-02
    risk: "PII / cost leak in exported file"
    verdict: MITIGATED
    evidence: "LogRow struct has exactly 13 fields, no PII/cost field (compile-enforced); SELECT projection byte-identical to 9.2 logsSelectColumns; TestExportColumns_MatchBRRD9 pins columns AND explicitly bans client_ip/client_country/user_agent/error_message/cost_usd in struct tags + SELECT."
  - id: R-03
    risk: "Signed URL (credential) leaks via logs / failure_reason / DOM"
    verdict: MITIGATED
    evidence: "worker: signedURL flows ONLY into Email.Send; all failWithAudit paths use usageLogSanitize(stage err); completion log emits export_id/user_id/format/rows/bytes (no URL); MarkCompleted persists key+expiry only. console UNIT-040 asserts no http(s) anchor/text in DOM."
  - id: R-04
    risk: "CSV formula injection — =cmd() executes in Excel"
    verdict: MITIGATED
    evidence: "csvSanitizeCell prefixes ' on cells starting = + - @ TAB CR (applied to untrusted model/upstream_model/error_code/he_request_id/api_key_id); rfc4180Field quoting + doubling + CRLF. TestCSV_FormulaInjectionEscaped + TestCSV_RFC4180Quoting."
  - id: R-05
    risk: "EXTEND regression — usage-log rows pollute live 2.6 GDPR /current"
    verdict: MITIGATED
    evidence: "Architect HIGH condition honored: FindCurrentInWindow/FindLatestForUser/Insert now carry kind='gdpr_full'; new usage-log methods carry kind='usage_logs'. Migration 0015 additive+reversible+NOT NULL DEFAULT backfill. Regression tests TestFindLatestForUser_GdprKindScoped + TestFindLatestUsageLogForUser_KindScoped."

