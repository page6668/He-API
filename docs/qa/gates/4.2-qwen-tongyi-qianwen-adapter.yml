# ---------- Decision Record ----------
gate_decision:
  result: PASS
  routing: sm_draft_next_story
  blocking_issues_for_done: 0
  non_blocking_followups: 6
  rationale: |
    Story 4.2 lands the second Epic-4 adapter on the Story-4.1 template plus
    three precedent-setting additions: (a) packages/adapter-usage/ partial
    lift (M1) with type-aliased back-compat retrofit of Story-4.1 deepseek;
    (b) NewRegistry endpoint-dedup refactor (M2) sharing one ClientHandle per
    upstream-endpoint URL — concurrency-clean under -race; (c) HTTP/2-preferred
    + ALPN HTTP/1.1 fallback (OQ-4.2-5 divergence from Story-4.1 OQ7 — empirical
    fallback safer than dogmatic-forced for Aliyun SSE long-streams). All 6
    Architect Round 1 OQ rulings, 2 Major issues, 1 minor, and 2 Low items were
    applied in a single Dev pass; the AC Traceability Matrix is fully populated
    with explicit code:line and test:function evidence per aspect.

    All Story-4.2-scope tests pass (race-clean on concurrency-critical paths
    UNIT-011, INT-009, BoundModelIDs_Defensive_Copy). The chaos suite passes
    all 7 scenarios including the new CHAOS-007 DashScope 429 + BR-4.4
    rate_limit_throttle slog attribute. The Story-4.1 deepseek regression suite
    continues green after the M1 lift retrofit. Two pre-existing flakes
    (TestColdStart Story-3.1 + TestChatCompletionsStream_ClientDisconnect
    Story-3.4) reproduce on the Story-4.1 HEAD without any 4.2 tracked changes
    applied — explicitly NOT attributable to Story 4.2.

    Six blind-spot scenarios (BOUNDARY-002, ERROR-003, CONCURRENCY-002,
    RESOURCE-001/002, FLOW-001) lack explicit test assertions. CODE-handling
    is present in all six cases; the chaos suite and concurrency suites
    indirectly backstop most via wire-level fault injection. All six are LOW
    severity and bundle-forward to Stories 4.3-4.6 inheritance per Story-4.1
    Round 2 precedent. Story 4.2 additionally CLOSES Story-4.1's deferred
    BLIND-CONCURRENCY-001 (mixed 50/50 100-concurrent) via the new
    TestINT_009 race-clean parallel-streaming suite.

    Score 95/100 = 100 base − 2 (six blind-spot LOW gaps) − 1 (TranslateForTest
    naming smell) − 1 (T5.6 path mismatch + L3 contract CI register) − 1
    (skeleton stub messages not migrated to 'moved to <path>'). Parity with
    Story 4.1's final Round-2 score, achieved in a single round. Recommended
    Done; SM proceeds with *draft 4.3 (Kimi/Moonshot adapter — inherits Qwen
    multi-model-id-per-service pattern for moonshot-v1-8k/32k/128k).
