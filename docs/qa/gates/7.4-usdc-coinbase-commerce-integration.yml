# Non-blocking low-severity observations (recorded for hardening backlog, do not gate)
top_issues:
  - id: "OBS-001"
    severity: low
    finding: >
      settledValue() falls back to the charge's local INTENT price when a
      charge:confirmed arrives with an empty payments[] array — it would then
      credit the intent rather than a provider-confirmed on-chain value. Theoretical
      (Coinbase itemises payments on confirmed charges), but the fallback path is the
      one place where settled could equal intent without an on-chain payment.
    suggested_action: >
      Future hardening — on charge:confirmed with empty payments[], park (Kind:
      EventUnhandled) instead of falling back to the intent price. (coinbase.go
      settledValue:269-272)
  - id: "OBS-002"
    severity: low
    finding: >
      Wrong-coin parking relies on billing-svc's inherited currency/amount guard
      treating the provider-surfaced "NON_USDC" currency as a park. Only the
      provider-side signal is asserted here (BLIND-DATA-005); the actual park
      behaviour lives in the reused billing-svc applier.
    suggested_action: >
      Add a billing-svc integration assertion that a non-USD settled currency parks
      (no credit) in a hardening follow-up. (coinbase.go settledValue:293-297)
  - id: "OBS-003"
    severity: low
    finding: >
      VerifyWebhook explicitly rejects uppercase-hex signatures (lowercase-only per
      BR-W-2). Correct against Coinbase's documented lowercase-hex contract but
      slightly brittle if Coinbase ever changes case.
    suggested_action: >
      Acceptable as documented; monitor Coinbase signature-format changes.
      (coinbase.go VerifyWebhook:168-170)

