  integrity_check: "Dev claimed pricing 84.0% + ledger 84.6% — QA independent coverage run matches exactly (no discrepancy). Dev-flagged docker/atlas/golangci env-limits + the TestColdStart flake both confirmed accurate. No FAIL-but-claimed-PASS, no stub tests (INT-001 asserts the golden 0.0343 flows as the exact balance bind value + mirror 9.9657)."
