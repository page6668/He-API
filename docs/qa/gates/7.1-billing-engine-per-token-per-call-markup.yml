# Verification trace (Step 4.6 AC coverage)
evidence_trace:
  ac_covered: [1, 2, 3]
  ac_gaps: []
  invariants_verified:
    ac1_decimal_not_float_M1: "pricing.ComputeCost (pricing.go:109-137) is pure shopspring/decimal end-to-end — base=prompt/1000×in+completion/1000×out, ×(1+markup/100), .Round(4) HALF-UP. NO float64 on the money path. UNIT-014 float-slip guard asserts 0.00275→0.0028 (HALF-UP) and that truncation would give 0.0027 — fails loudly if float64 is reintroduced (the M-1 routing-svc REUSE trap)."
    ac1_golden_vectors: "TestComputeCost_GoldenVectors (pricing_test.go:42-82) — UNIT-004 qwen-max(1500,800,10%)=0.0343 (AC1 worked example), UNIT-005 deepseek-v3(10000,5000,15%)=0.0322 (AC1 Example 1), UNIT-011 round-to-zero(1,0)=0.0000 (AC1 Example 2 + Architect Low — explicitly present), UNIT-006/007/008 markup 5/10/15 boundaries, UNIT-009 zero-completion, UNIT-013 large-token 17.6000. UNIT-012 HALF-UP boundary 0.00275→0.0028. All green."
    ac1_no_pricing_and_markup_range: "UNIT-015 unknown model → typed ErrNoPricing (nil snapshot too, no panic); UNIT-016 markup ∉[5,15] → MarkupOutOfRange flag set + billed AS-IS (4.99→0.0105, 15.01→0.0115), never silently dropped. Caller (ledger.Apply:149-156) emits slog billing_markup_out_of_range. ErrNoPricing → OutcomeNoPricing → consumer DLQ (never zero-charge)."
    ac1_purity_BR_C_5: "TestComputeCost_Purity (50 iterations identical) + ComputeCost takes no clock/no I/O — the pure golden-vector seam. UNIT-017 confirms per_call column is read ONLY in PER_CALL mode (OFF in 7.1: PER_TOKEN ignores it → 0.0343 not 0.5000) and REPLACES (Q-PERCALL)."
    ac2_exactly_once_BR_D_1: "ledger.deduct (ledger.go:198-219) INSERT he_api.usage_ledger ... ON CONFLICT (ledger_key) DO NOTHING; tag.RowsAffected()==0 → OutcomeDuplicate, rollback, NO balance UPDATE/commit/api_keys. INT-002 asserts redelivery → ExpectExec INSERT(0 rows)+ExpectRollback, no second deduction, Duplicate outcome."
    ac2_atomicity_BR_D_2: "INSERT ledger + balance UPSERT share ONE tx (Begin→Exec→QueryRow→Commit; defer Rollback safety net). INT-004 injects a balance-INSERT error → ExpectRollback, NO commit, NO api_keys increment, Apply surfaces error so the consumer does NOT ACK. No orphan ledger row, no phantom charge."
    ac2_pg_authoritative_BR_D_3: "mirror (mirror.go:41-60) runs POST-commit best-effort: Redis SET balance:user:{id}:realtime = post-deduction PG value (Q-RECON SET-from-PG, NOT DECRBYFLOAT), INCRBYFLOAT usage:apikey:{id}:month_cost_usd, UPDATE api_keys.current_month_cost_usd. INT-006 closes Redis pre-fan-out → Apply still returns Applied (no error); the durable PG charge stands, mirror failure swallowed + he_billing_redis_mirror_failed_total."
    ac2_lazy_upsert_Q_LAZY: "deductBalanceSQL = INSERT he_api.balances VALUES(user,0-cost) ON CONFLICT(user_id) DO UPDATE SET current_usd=b.current_usd-cost RETURNING current_usd::text. INT-007 absent row → created at -0.0343, realtime mirror=-0.0343 (lazy negative). No backfill migration."
    ac2_offset_after_commit_BR_D_2: "consumer.go FetchMessage does NOT auto-commit; CommitMessages called ONLY after a successful apply (process→(true,nil)→commit; PG fault→(false,err)→retain offset→Kafka redelivers→ledger dedups). NoPricing/malformed → DLQ park usage.recorded.dlq + commit (Q-DLQ, no head-of-line block); DLQ-write failure retains offset (BLIND-ERROR-003)."
    ac2_producer_fire_and_forget_BR_D_4: "billingemit.KafkaEmitter.Emit (emitter.go:81-102) marshals protojson then writes in a DETACHED goroutine (context.WithoutCancel + 10s bounded timeout) — never blocks/​fails the already-flushed response; marshal/write error → swallowed + he_billing_emit_failures_total + slog billing_emit_failed. INT-013 fire-and-forget. RAW event, NO cost_usd field (Q-CH). main.go RequiredAcks=kafka.RequireAll (Q-KCLIENT money path)."
    ac2_emit_all_success_paths: "emitUsage call sites: non-stream chat_completions.go:494/598, stream chat_completions_stream.go:267 (post-final-chunk, final token totals), A/B chat_completions_ab.go:125 (one event per SUCCESSFUL leg, abLeg=true legIndex=i → composite ledger_key). Failed completion emits nothing (BR-D-7 no-charge). INT-014 one-event, INT-016 A/B dual-billing, INT-017 no-event-on-failure."
    ac3_string_money_BR_A_3: "billing_read.go moneyString (181-187) → decimal.StringFixed(4) → '12.3400'; balanceResponse.CurrentUSD/usageResponse.TotalCostUSD/usageByModel.CostUSD are JSON `string` fields, never numbers. INT-021/UNIT-019 string-money assertion."
    ac3_pg_authoritative_read_BR_A_2: "GET /v1/balance reads he_api.balances (current_usd::text) — PG authoritative, NOT Redis (BR-A-2). Lazily-absent row (pgx.ErrNoRows) → 200 {current_usd:'0.0000'} (Q-LAZY). INT-022 absent-row."
    ac3_usage_month_aggregate_BR_A_5: "GET /v1/usage aggregates usage_ledger WHERE ts >= date_trunc('month', now() AT TIME ZONE 'UTC') — current-UTC-month, aligned with the 5.4 cap reset; totals + per-model breakdown, zero-aggregate → '0.0000'/0. INT-023/024."
    ac3_preflight_gate_fail_open_Q_GATE_BR_A_4: "billinggate.New (billinggate.go:47-100) reads balance:user:{id}:realtime (fast Redis, NO billing-svc round-trip); bal ≤ 0 → 402 402_balance_insufficient (§5.1.2) BEFORE upstream dispatch. FAIL-OPEN on every degraded path: nil reader / no-user / reader-error / not-found / parse-error → allow + he_billing_gate_fail_open_total. Hard-zero threshold (BR-A-6). INT-026/027/028/029 + BOUNDARY-004 zero-boundary."
    contract_proto_roundtrip: "packages/proto/he/billing/v1 round-trip (CONTRACT-002/003) green — hand-authored pb.go (descriptorpb+proto.Marshal byte-exact wire) verified; UsageEvent has NO cost_usd field (Q-CH); CheckBalance gRPC PG-authoritative (CONTRACT-001 round-trip/absent/negative/empty)."
    migration_0008_additive_M2: "0008_create_balances.sql — CREATE he_api.balances (user_id PK, current_usd NUMERIC(12,4)) + he_api.usage_ledger (ledger_key TEXT PK Q-ABKEY, he_request_id non-unique index, cost_usd NUMERIC(12,4)) + idx_user_ts/idx_he_request_id + ALTER model_pricing ADD per_call_price_usd NUMERIC(10,6) nullable. api_keys.current_month_cost_usd LEFT at NUMERIC(10,2) (M-2 no-widen — NOT the reconcile target). Additive + reversible + non-destructive."
  architect_rulings_folded:
    M1_decimal_not_float: "shopspring/decimal end-to-end; UNIT-014 float-slip guard. VERIFIED — no float64 on the money path."
    M2_cap_counter_precision: "api_keys.current_month_cost_usd untouched at NUMERIC(10,2); reconciliation invariant compares SUM(usage_ledger.cost_usd) vs balances.current_usd (both NUMERIC(12,4)). VERIFIED at mirror.go + 0008 + billing_read usage SQL."
    Q_PRODUCER_doc_fix: "topology §3.2 L42 corrected to 'api-gateway 写入 Kafka topic usage.recorded (Story 7.1 Q-PRODUCER ...)'. VERIFIED."
