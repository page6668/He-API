    severity: low
    finding: "T4.1-T4.3 service-level E2E (reconciliation invariant SUM(ledger.cost)==amount-deducted / A/B dual-billing two-rows-summed / negative-balance-bound) are correctly left UNCHECKED and deferred to CI because docker/testcontainers cannot run locally (auto-memory project_toolchain_env_limits). The behaviours are covered at the unit/integration tier: the reconciliation invariant holds BY CONSTRUCTION (ledger-insert + balance-UPDATE are ONE atomic tx — INT-001/004), A/B dual-billing via the composite ledger_key + per-leg emit (chat_completions_ab_emit_test), negative-bound via lazy UPSERT (no floor) + hard-zero fail-open gate (billinggate BOUNDARY-004)."
