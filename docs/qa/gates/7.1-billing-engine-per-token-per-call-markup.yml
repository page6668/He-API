status_reason: "All 3 ACs implemented and independently verified at source + test on the money path. billing-svc (pricing/ledger/consumer/grpc) + api-gateway (billingemit/billinggate/usage/handlers) + proto he/billing/v1 suites all green; pricing 84.0% + ledger 84.6% coverage (≥80% T5.1). Every money-correctness invariant proven by a real (non-stub) test: AC1 golden vectors byte-exact (qwen-max 1500/800→0.0343, deepseek-v3→0.0322, round-to-zero→0.0000) with the M-1 float-slip guard asserting 0.00275→HALF-UP 0.0028 vs 0.0027 truncation; AC2 EXACTLY-ONCE (ON CONFLICT(ledger_key)→0 rows→rollback, no second deduction), ATOMICITY (balance-update error→rollback BOTH, no orphan/phantom), PG-down→no-ACK, Redis-down-post-commit→PG charge stands, lazy UPSERT, NoPricing→no-tx-DLQ; AC3 string-money (StringFixed(4)), PG-authoritative balance read, current-UTC-month usage aggregate, 402 pre-flight gate fail-OPEN at hard-zero. All 14 Architect Round-1 rulings confirmed in code: M-1 (shopspring/decimal end-to-end, NEVER float64), M-2 (api_keys cap counter LEFT at NUMERIC(10,2); reconcile target = SUM(usage_ledger.cost_usd) vs balances), Q-PRODUCER (gateway producer + topology §3.2 doc fix landed), Q-CH (UsageEvent carries NO cost_usd field — billing-svc sole authority), Q-LEDGER, Q-ABKEY (composite ledger_key TEXT PK), Q-RECON (SET-from-PG, not DECRBYFLOAT), Q-KCLIENT (segmentio + RequiredAcks=RequireAll on the money producer), Q-ROUND (HALF-UP), Q-DECIMAL, Q-LAZY, Q-DLQ (usage.recorded.dlq), Q-GATE (fail-open), Q-PERCALL (nullable column additive, OFF/replace). Emit hooks fire on all success paths (non-stream/stream-post-final-chunk/A/B-per-leg); failure path emits nothing (no-charge); consumer commits offset ONLY after a successful apply. gofmt + go vet clean. Residual: service-level E2E (T4.1-4.3 reconciliation/A/B/negative-bound) + atlas migration round-trip + golangci-lint are docker/atlas/golangci-gated and unexecuted locally (auto-memory project_toolchain_env_limits) — the behaviours hold by construction (ledger-insert + balance-UPDATE one atomic tx) and are covered at the unit/integration tier; MUST run in CI before deploy (non-blocking, ratified env precedent mirroring 6.2/6.3/6.4)."
