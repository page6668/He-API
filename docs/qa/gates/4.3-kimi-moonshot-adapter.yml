non_blocking_observations:
  - id: obs-1
    severity: low
    title: "Pre-existing flaky regression test in handlers package — TestChatCompletionsStream_ClientDisconnect_ConnectionClose"
    summary: |
      Pre-existing flake (last modified Story 3.4; touched 0 times by Story 4.3). Polls slog buffer for
      `client_disconnected=true` within a 1s deadline after srv.CloseClientConnections() — TCP-FIN propagation
      timing on the test runner is non-deterministic. Failed ~3/5 times in -count=1 mode but passes consistently
      under -race (test runs slower → kernel surfaces FIN within deadline). The test exercises Story-3.4 streaming
      handler + writer disconnect detection — both UNTOUCHED by Story 4.3 (BR-2.1/BR-2.2 REUSE Story-4.1 verbatim).
      Recommend Story-4.4+ or a dedicated fix story to harden the disconnect-detection assertion (e.g., poll
      Flush() → Hijack() boundary directly rather than the slog buffer).
    action: log_only_does_not_block_gate
  - id: obs-2
    severity: low
    title: "Empirical curl --http2 verification of api.moonshot.cn deferred"
    summary: |
      T6.6 records that `curl --http2 -v https://api.moonshot.cn/v1/chat/completions` was deferred to first live
      deployment because the dev workstation lacks KIMI_UPSTREAM_API_KEY. Compensating control: the policy
      (`ForceAttemptHTTP2: true` + ALPN fallback) is exercised by 4.3-UNIT-004 against a HTTP/1.1-only httptest
      server in CI, so the fallback branch is verified regardless of upstream H2 posture. No functional risk.
    action: defer_to_first_live_deploy
  - id: obs-3
    severity: low
    title: "SDK contract + live e2e suites are skeleton-only (env-gated)"
    summary: |
      Per Story-4.1/4.2 deferred-live-execution posture, the OpenAI Python SDK contract tests skipif when
      HE_API_TEST_GATEWAY_URL is unset; the live suite skipif when HE_API_KIMI_LIVE=1 is unset. These run on
      operator-triggered workflow_dispatch only. No new follow-up story opened — inherits Story 4.1/4.2's
      already-tracked deferred live-execution checkpoint.
    action: defer_per_epic_4_posture
