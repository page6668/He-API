top_issues:
  - id: "10.6-QA-M1"
    severity: medium
    blocking: false
    finding: "Playground proxy (MeKeysPolicyResolver) emits UsageEvent.TeamId=\"\" for team-scoped keys, because the reused auth-svc ListApiKeys RPC (ApiKeyEntry) carries no team_id field — only the bearer-path ValidateApiKey does. A team-scoped key billed via /v1/me/playground/chat therefore loses team-dimension attribution on the usage ledger (chat_completions.go:587 → emitUsage), whereas the same key on the bearer path preserves it. Money-deduction correctness (per-user balance gate + per-key TPMDeduct billed-once) is UNAFFECTED — verified by INT-003 / BLIND-DATA-001. Zero AC impact (no AC requires team attribution); zero security/IDOR impact (the user owns the key)."
    disposition: "PASS with documented limitation. NOT routed to dev: the only fixes (add team_id to ApiKeyEntry proto, or a second resolver RPC) directly contradict the ratified OQ-10.6-1 'no new proto / no new gRPC RPC' ruling, so this is an Architect/PO follow-up decision, not an in-scope dev fix."
    recommendation: "Future story: either extend ApiKeyEntry with team_id (additive proto field) so the Playground path can attribute team usage, OR document the per-team-attribution limitation of the Playground proxy in rest-api-spec §5.1.3. Track for whoever owns team-level usage aggregation."

