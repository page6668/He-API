# Verification trace (Step 4.6 AC coverage)
evidence_trace:
  ac_covered: [1, 2, 3]
  ac_gaps: []
  high_gates_verified:
    SEC_001_aes_gcm_fail_closed: "wechat.go:311-337 decryptResource: aes.NewCipher(apiV3Key) + cipher.NewGCM; gcm.Open consumes the trailing 16B auth tag → any tampered ciphertext/nonce/AAD or wrong APIv3Key returns a non-nil error. wechat.go:293-306 decryptAndParse maps a decrypt error → provider.ErrSignatureInvalid (fail-closed, NEVER parses a partial plaintext). Nonce length checked == gcm.NonceSize(); algorithm gated to AEAD_AES_256_GCM. TestAC3_VerifyWebhook 7.6-UNIT-030/031/032/033 (happy + tampered-ciphertext + tampered-nonce/AAD + wrong-APIv3Key) all green; webhook/wechat_ingress TamperedCiphertext_Rejected green."
    SEC_002_forged_unknown_serial: "wechat.go:245-288 VerifyWebhook: fail-closed on nil/garbage platform key or APIv3Key (keyErr), missing Wechatpay-Signature/Timestamp/Nonce/Serial, unknown/mismatched Wechatpay-Serial (serial != p.platSerial, line 259), unparseable/stale Wechatpay-Timestamp (freshness BEFORE verify), bad base64 sig, and rsa.VerifyPKCS1v15 failure — every path returns ErrSignatureInvalid and reaches decryptAndParse ONLY after the signature verifies. TestAC3 7.6-UNIT-021/022/023/024/025/027 + TestWechatIngress_Forged_Rejected green."
    SEC_004_no_decrypt_oracle: "wechat.go:283-287 — decryptAndParse is called ONLY after rsa.VerifyPKCS1v15 passes; a forged signature is rejected BEFORE any aes.NewCipher/gcm.Open attempt. verify-THEN-decrypt-THEN-parse, no decrypt oracle. TestAC3 7.6-UNIT-034 asserts a forged-sig + valid-ciphertext is rejected at verify without a decrypt attempt."
    DATA_001_minor_unit: "wechat.go:94 minorUnitDigits{USD:2,HKD:2,CNY:2} table-driven (no hardcoded /100); decimalToMinor (wechat.go:464-479) fails CLOSED on sub-minor precision via decimal.Shift + Truncate equality; minorToDecimal (wechat.go:490-503) fails CLOSED on a non-integer minor value → no 100× mis-scale (BR-W-8). parseTransaction SUCCESS branch surfaces a settled-amount scale error as an error (no credit). TestMinorUnits 7.6-UNIT-006/007 green."
  reuse_discipline: "EXEMPLARY — exceeds 7.5. git diff --stat HEAD confirms provider.go (seam), webhook/handler.go, billing-svc/credit/credit.go (incl. toUSD + paid-currency guard:194-204), packages/proto/*, and migrations/* ALL byte-unchanged. Unlike 7.5 (which justifiably fixed the credit.go guard), 7.6 needed ZERO credit.go change — the 7.5 paid-currency fix is inherited, so HKD/CNY credit out-of-the-box. wechat is purely additive: new provider impl + conditional registry entry (gated on WECHAT_PAY_MCH_ID, graceful-disable warning) + supportedProviders/providerCurrencies{USD,HKD,CNY} entry + 2 webhook route mounts (gateway outside bearer+CSRF, payment-svc) + secrets + an idempotent HKD fx_rates DATA seed (not a migration). credit_test.go change is TEST-ONLY (HKD/CNY re-assert lanes)."
  seam_parity: "wechat satisfies the same PaymentProvider contract (Name=\"wechat\"/CreateCheckout/VerifyWebhook/CreateSubscription); CreateSubscription returns a not-supported error (mirrors coinbase/alipay, Q-SUBSCOPE); no wechat branch leaks into the recharge handler or credit.go. Closes the Epic-7 5-channel seam proof (Stripe/PayPal/USDC/Alipay+/WeChat all on one provider-agnostic spine)."
  toolchain: "go vet clean on payment-svc(wechat,webhook) + billing-svc(credit) + api-gateway(handlers); all referenced AC-traceability-matrix test functions confirmed to EXIST and PASS on a fresh -count=1 run; deliverable bindings verified present (wechat.New DI inject, both webhook route mounts, supportedProviders/providerCurrencies config-read, WECHAT_PAY_* config-read)."
