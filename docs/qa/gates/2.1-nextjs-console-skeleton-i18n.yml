    severity: low
    finding: |
      docs/qa/evidence/2.1-lighthouse-{en,zh-CN,ar}.json and 2.1-bundle-{date}.html are
      not produced. Per TS-CONS-009, Lighthouse is NOT a CI gate (CI only gates bundle
      size which already passes); per Dev Open Issues 2 and 5, both artifacts are
      explicitly deferred. Sandbox lacks headless Chrome and Lighthouse CLI.
    suggested_action: |
      Capture during the next staging rollout pass, or fold into Story 2.2/2.3 QA evidence
      collection. Not blocking for PASS — informational/observability artifact only.

