  - id: QA-2.5-L-001
    severity: LOW
    category: pre_existing_test_failure
    finding: "Console vitest test `__tests__/2.2-email-signup-password-login-email-verification.test.ts:296 AuthKeys union missing keys` fails when running the full Console suite."
    location: "apps/console/__tests__/2.2-email-signup-password-login-email-verification.test.ts:296"
    evidence: "Independently reproduced on clean main HEAD via `git stash -u && pnpm exec vitest run __tests__/2.2-email-signup-password-login-email-verification.test.ts` — same 1-fail/31-pass result. Root cause: Story 2.4 added auth.json key `2fa.section_title` whose flattened first segment starts with digit '2', failing `scripts/gen-i18n-keys.ts` KEY_RE = `^[a-zA-Z]`. AuthKeys.ts was never regenerated to include the 2.4 keys."
    attribution: not_introduced_by_2_5
    recommendation: "Two viable follow-ups (track as separate housekeeping Story): (a) relax KEY_RE to allow digit-leading first segments, OR (b) restructure auth.json to wrap `2fa.*` under a leading-letter parent (e.g., `mfa.totp.*`)."
    blocking: false

  - id: QA-2.5-L-002
    severity: LOW
    category: build_tooling_workaround
    finding: "packages/i18n-keys/src/index.ts manually patched to add `export * from './account'` because gen-i18n-keys.ts exits non-zero after writing account.ts."
    location: "packages/i18n-keys/src/index.ts"
    evidence: "Same root cause as QA-2.5-L-001 — script processes account.ts successfully then crashes on the pre-existing 2.4 auth.json `2fa.*` keys, leaving index.ts not regenerated."
    attribution: not_introduced_by_2_5
    recommendation: "Resolved by the same housekeeping Story that fixes QA-2.5-L-001."
    blocking: false

