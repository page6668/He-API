status_reason: "Round 2 incremental review. The sole Round-1 CONCERNS item — M-1 (architecture_concern): AC3 BR-3.7's EXACT pre-flight `balance ≥ char_count×price` gate reconciled to the shared `balance>0` billingGate middleware — has been RULED by the Architect (Wright, Round 2, 2026-06-15): option (a) RATIFY the `balance>0` reconciliation as the amended BR-3.7, ZERO code change. The Round-1 'EXACT gate' wording is WITHDRAWN — it contradicted the cost-SoT invariant upheld in the same review (an exact gateway-side estimate forces the gateway to hold pricing → a second cost SoT, forbidden 4.1–4.8; project_cost_source_oq5_usage_ledger). The implementation already satisfies the amended contract — QA independently re-verified in-code: gateway uses the shared billingGate hard-zero `balance ≤ 0 → 402` (identical to chat/embeddings/ASR), holds NO USD pricing, emits only the RAW character_count on the PER_CHARACTER UsageEvent; billing-svc remains the SOLE cost authority; exactly-once usage_ledger + atomic debit unchanged (audio_speech.go:22-28 documents the rationale; billinggate.go:88 LessThanOrEqual(decimal.Zero)). Residual ≤ ~$0.07/request bounded overdraft — non-regressive, identical in kind to every metered endpoint's final in-flight request, and RESTORES consistency with the ratified 9.6 ASR gate. All FOUR non-negotiable gate suites independently re-confirmed GREEN under `go test -race` (PII no-leak INT-028; money one-SoT incl CostInput zero-drift UNIT-018/019 + INT-018 + golden vectors; capability-fence regression all-ids INT-005/006/007; binary-response integrity INT-008). Blast radius proven (deepseek Synthesize→CodeUnimplemented; 5 untouched adapters build+pass). Migration 0017 additive/reversible/non-destructive. L-1 (checkbox hygiene) is non-blocking and delegated to Dev/SM per the ruling. 0 critical / 0 high / 0 medium / 1 low (non-blocking). → PASS, close to Done."
