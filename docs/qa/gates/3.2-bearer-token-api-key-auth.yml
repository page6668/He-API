nfr_validation:
  security:
    status: PASS
    notes: |
      Plaintext key never appears in logs / spans / errors (UNIT-010 + TC-9 +
      code review). Anti-enum parity (BR-2.4) implemented + asserted. bcrypt
      cost=12 production, cost=4 test-only (compile-time isolation via
      _test.go). Cache key uses sha256(plaintext) — defence in depth against
      Redis-dump (BR-1.5). Regex pre-filter forecloses bcrypt-DoS via
      oversized input (BR-2.6). Per-route middleware application (BR-1.4)
      verified by code review.
  performance:
    status: PASS
    notes: |
      Lazy sync.Once Redis init preserves cold-start (TC-10): 280-305ms P95
      in isolation, well under 1000ms budget. Redis cache hit avoids RPC
      (UNIT-017). Fire-and-forget last_used_at UPDATE (BR-2.5) decouples
      hot path from observability writes.
  reliability:
    status: PASS
    notes: |
      Redis outage degrades to "every request hits auth-svc" (UNIT-022) rather
      than failing — correctness gate is upstream RPC, cache is perf only.
      PG connection error surfaces as connect.CodeUnavailable so gateway can
      distinguish AUTH failure (401) from INFRA failure (503) (BR-1.3).
  maintainability:
    status: PASS
    notes: |
      Mirrors jwt_verify.go structure 1:1 (context-key helpers + RequireX
      factory + writeError envelope). Distinct BearerWithUserID per OQ3
      separation guidance prevents JWT/Bearer auth path collision.
      TODO(epic-8-or-negcache) marker documents the residual probe-DoS
      attack surface for the future-Story owner.
