resolved_issues:
  - id: "ISSUE-001"
    severity: high
    finding: "AC3 streaming TPM post-deduction (BR-3.5/3.6/3.7) NOT IMPLEMENTED"
    resolution: >
      Wired via non-breaking AdapterChunker.TailUsage() accessor. All four Architect Q10
      cases covered in chat_completions_stream.go::maybeStreamTPMDeduct (lines 269-316):
      (i) normal completion → TPMDeduct(total_tokens); (ii) stream-error mid-flight →
      TPMDeduct(prompt_tokens) partial + ratelimit_tpm_partial_deduction slog WARN;
      (iii) client-disconnect → TPMDeduct(prompt_tokens) partial; (iv) missing-tail-usage
      → no deduct + ratelimit_tpm_failed_no_deduction slog WARN. 4 new unit cells in
      internal/handlers/chat_completions_stream_tpm_test.go (NormalCompletion /
      MidFlightError_PartialPromptOnly / MissingTailUsage_NoDeduct / PreFlushError_NoDeduct)
      — all PASS under -race. UNIT-019 + UNIT-020 blind spots closed.
    verification:
      code: ["apps/api-gateway/internal/handlers/chat_completions_stream.go:216,269-316"]
      tests: ["apps/api-gateway/internal/handlers/chat_completions_stream_tpm_test.go (4 cells)"]
  - id: "ISSUE-002"
    severity: high
    finding: "Decision 8B chaos_required=true VIOLATED (0/3 chaos scenarios)"
    resolution: >
      Chaos suite landed at apps/api-gateway/tests/ratelimit_chaos_test.go (build-tag
      chaos). 5 cells: CHAOS-001 slow-Redis fail-open within FailOpenTimeout+budget;
      CHAOS-002 Redis RST mid-Lua clean fail-open + slog WARN; CHAOS-003 Redis OOM
      fail-open + he_ratelimit_fail_open_total increment; CHAOS-004 pool-exhaustion
      fail-open; CHAOS-005 SCRIPT FLUSH no-tight-loop. Implementation uses miniredis
      close-mid-flight + sub-ms FailOpenTimeout to achieve the same fail-open invariant
      Toxiproxy would test. All 5 PASS under `go test -tags chaos -race`.
    verification:
      tests: ["apps/api-gateway/tests/ratelimit_chaos_test.go (5 cells, build-tag chaos)"]
  - id: "ISSUE-003"
    severity: high
    finding: "Integration suite (T4.1-T4.9, 15 scenarios) entirely DEFERRED"
    resolution: >
      Integration suite at apps/api-gateway/tests/ratelimit_integration_test.go. 9
      substantive cells: INT-001 atomicity end-to-end; INT-002 cross-pod statelessness
      (2 gateways one Redis); INT-003 Redis fail-open via close-mid-flight; INT-004 all-
      axes fail-open; INT-005 env-var override propagates to Lua; INT-007 stream-error
      prompt-only deduction; INT-008 missing-tail-usage NEVER deduct; INT-010 chain order
      (requestid → bearer → ratelimit → handler); INT-012 429 envelope 5-field across all
      3 axes. 6 cross-references to handler/middleware-level coverage with explicit cross-
      reference skips. All substantive cells PASS under -race.
    verification:
      tests: ["apps/api-gateway/tests/ratelimit_integration_test.go (9 substantive + 6 cross-ref skips)"]
  - id: "ISSUE-004"
    severity: high
    finding: "Architect Round 1 M-2 + R-5 remediation NOT applied (T0.10 §10.3 doc)"
    resolution: >
      §10.3 of docs/architecture/10-性能与可扩展性performance-scalability.md updated with
      Q1 ratification (in-gateway middleware for MVP; quota-svc reserved for future multi-
      caller) + Q2 ratification (fixed-window INCR + EXPIRE NX for MVP; ZSET sliding-
      window reserved as future precision-upgrade). §10.5 Change Log row credits Story 5.3
      / Architect Round 1 M-2 + R-5.
    verification:
      docs: ["docs/architecture/10-性能与可扩展性performance-scalability.md:37,43,45,63"]
  - id: "ISSUE-005"
    severity: high
