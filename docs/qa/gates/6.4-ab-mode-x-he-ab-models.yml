    no_extra_rpc_Q_I: "DecideAB (decider.go:162-209) populates the 6.1-preshaped SelectModelRequest.ab_models on the SAME SelectModel call (100ms deadline); ab_overrides_strategy WARN when model=he-router-* OR X-He-Routing-Strategy also set; nil-client passthrough for dispatch-only tests; mapABError InvalidArgument/NotFound→400 else fail-closed 502; defensive blank-ab_selected_models→502."
    parallel_no_shared_state_Q_C_High1: "dispatchAB (chat_completions_ab.go:60-76) uses sync.WaitGroup (NOT errgroup — absent from api-gateway/go.mod, Architect High-1) with results[i] index-addressed per leg; each goroutine writes only its own slot. -race clean (go test -race green; barrier-mock concurrency tests pass)."
    dual_billing_INVARIANT_Q_F: "dispatchAB sums total += results[i].resp.Usage.TotalTokens over SERVED legs (80-88) then ONE TPMDeduct(ctx, apiKeyID, total) (117). Failed leg carries no usage → not charged. Test 6.4-INT-011 asserts ==legA.total+legB.total; 6.4-UNIT-033 asserts ==legA.total on one-leg-fail. dispatchAB coverage 100%."
    merge_shape_Q_A: "mergeABResponses (chat_completions_ab.go:135-168) — choices concatenated with re-assigned index, per-choice x_he_model=leg.model, summed prompt/completion/total usage, single id/created/object='chat.completion', top-level model=legs[0].model. Coverage 100%. Tests 6.4-UNIT-022/023."
    partial_failure_best_effort_Q_E: "served==0 → writeFailoverTerminal(representativeABError) + zero bill (92-97); ≥1 served → merged body where a failed leg becomes a marker choice finish_reason='he_upstream_error' + x_he_model + x_he_error §5.1.2 envelope (158-164); X-He-AB-Models response header lists only served ids (111). Tests 6.4-UNIT-030/032/033/035/036/038."
    representative_504_over_502_BR3_3: "representativeABError (190-204) returns the first leg whose classifyFailoverError code is 504_upstream_timeout, else the last leg error (→502), else the invalid-response sentinel. Test 6.4-UNIT-036 green."
    no_per_leg_failover_Q_D: "each leg = a single dispatchAdapterOnce call (73) — no failover_chain loop on the A/B path (legs are explicit concrete pins). Unresolved leg → errUpstreamInvalidResponse marker, no panic (66-68/BR3-4). Test 6.4-UNIT-032/038."
    scope_both_legs_Q_K_High2: "dispatchAB scope-gates BOTH legs via keypolicy.CheckModelScope(leg, scopeModels) BEFORE any dispatch (50-56); an out-of-scope leg → 403_model_not_in_scope for the WHOLE request. Upstream keypolicy middleware still gates body.model (High-2). Test 6.4-UNIT-025."
    no_x_he_selected_model_BR2_7: "A/B success path sets only X-He-AB-Models response header (111), NOT X-He-Selected-Model (it names one model). Non-A/B path keeps X-He-Selected-Model (serveAdapterNonStream:533). Test 6.4-UNIT-043 asserts the non-A/B header still present."
    streaming_guard_Q_B: "chat_completions.go:357 — req.Stream && routingclient.ABModelsPresent(r.Header) → 400_invalid_request BEFORE parse/routing/dispatch; keyed off raw presence so a malformed-but-present A/B header on a stream still 400s. Test 6.4-UNIT-040."
    one_rate_limit_tick_Q_J: "the A/B fan-out lives INSIDE ServeHTTP, AFTER the Story-5.3 rate-limit middleware → one HTTP request = one QPS/RPM admission tick; TPM reflects both legs (Q-F). Test 6.4-UNIT-044."
