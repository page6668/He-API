    parse_exactly_2_distinct_Q_H: "ParseABModels (routingclient/ab.go:38-61) splits on ',', trims, drops empty, dedups BEFORE the count check (a,a→1→ErrInvalidABModels), requires len==2. Blank header→(nil,nil) non-A/B passthrough. Tests 6.4-UNIT-001/003/005/006 green."
