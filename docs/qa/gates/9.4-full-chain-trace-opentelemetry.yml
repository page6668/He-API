status_reason: >
  Round 3 (incremental): the sole remaining open item, ADAPTER-DARK-001 (MEDIUM,
  architecture_concern), is now RESOLVED and independently re-verified. Per the
  Architect escalation ruling, Dev added T6 — instrumenting EXACTLY the adapter tier:
  all 6 adapter mains (apps/adapters/{deepseek,doubao,ernie,glm,kimi,qwen}/cmd/server/main.go)
  now build obs.NewTracerProvider + otel.SetTracerProvider + obs.SetupPropagation() and
  wrap the mux with obs.WrapHTTPHandler (gateway→adapter traceparent is EXTRACTED, the
  adapter server span joins the trace), and each internal/upstream/client.go wraps its
  bespoke vendor transport with otelhttp.NewTransport(<existing>) so the adapter→vendor
  model call is the TTFB client span (BR-TR-6, the key business span). The dark
  gateway→adapter→vendor edge is closed and AC1's worked example ("adapter→<vendor> ...
  one trace_id") is delivered. The two HIGH must_fix items (TRACE-ORPHAN-001,
  TAUDIT-SCOPE-001) remain RESOLVED from Round 2. QA independently re-verified: all 6
  mains + 6 upstream wraps present (grep), ALPN/forced-HTTP2 policy preserved in place
  (otelhttp wraps the bespoke transport as its base — deepseek *http2.Transport,
  qwen/doubao ForceAttemptHTTP2 intact), zero span attributes set by adapter code (PII
  clean), and the guards have teeth (UNIT-009 exemption narrowed apps/adapters/ →
  internal/upstream/ so adapter mains are back on the anti-orphan path; UNIT-016 positive
  guard added, RED→GREEN). Test runs GREEN: obs unit/blind-spot/T-AUDIT/UNIT-016 under
  go test -race; INT-001/-004 in-process under -tags=integration; build/vet/race for all
  6 adapter modules (incl. the HTTP/2 fake-upstream tests — no ALPN regression); otel
  pinned v1.26.0 / otelhttp v0.51.0, no workspace drift. Remaining UNCHECKED items are
  the honest, long-standing CI/staging deferrals of the multi-container integration
  (9.4-INT-002/005/006/007/008) + staging E2E (9.4-E2E-001) — not runnable locally
  (project_toolchain_env_limits), accepted policy since Round 1 (9.1/9.2/9.3 precedent),
  never a gate blocker. Reliability NFR (was CONCERNS: chain discontinuous at the adapter
  edge) is now PASS.
