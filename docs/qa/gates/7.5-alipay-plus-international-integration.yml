# Verification trace (Step 4.6 AC coverage)
evidence_trace:
  ac_covered: [1, 2, 3]
  ac_gaps: []
  high_gates_verified:
    SEC_002_canonicalisation: "alipay.go:271 signingString(POST, p.notifyPath, ...) reconstructs over the CONFIGURED public notify path (WithNotifyPath), NOT r.URL.Path; method fixed POST. TestAC3_VerifyWebhook (7.5-UNIT-025) asserts genuine verifies / r.URL.Path use would fail all genuine traffic."
    SEC_001_forged_rsa2: "alipay.go:233-277 fail-closed on nil/garbage key, missing Signature/Client-Id/Request-Time, Client-Id mismatch, stale Request-Time (freshness BEFORE verify), bad sig, wrong key; rsa.VerifyPKCS1v15(SHA256); body parsed ONLY after verify (reject-before-parse, BR-W-1). TestAC3_VerifyWebhook 7.5-UNIT-020..028 + TestAlipayIngress_Forged_Rejected green."
    DATA_001_minor_unit: "alipay.go:87 minorUnitDigits{USD:2,CNY:2} table-driven (no hardcoded /100); decimalToMinor/minorToDecimal fail CLOSED on sub-minor precision / non-integer minor value → no 100× mis-scale (BR-W-7). TestMinorUnits (7.5-UNIT-006/007) green."
  reuse_deviation_verified:
    credit_go_guard: "JUSTIFIED + correct. The inherited guard compared creditUSD (post-fx, USD) against the raw paid-currency intent → 50.0000 USD != 350.00 CNY → every CNY recharge silently parked (latent defect; prior USD-only tests never drove it). The story's own BR-C-3/Q-FX-INTENT REQUIRED comparing in the PAID currency before toUSD; BR-C-5 'verbatim' was the contradicted assumption. Fix is ~15 lines confined to the guard (parse settled+intent, compare same-currency + equal magnitude pre-conversion, THEN toUSD); tx/fence/credit/mirror untouched. USD path byte-identical — pre-existing USD credit_test.go stays green. New TestApply_Recharge_CNY_FxAtCredit (7.5-INT-012) + TestApply_Recharge_CNY_ShortSettle_ParksPreFx (7.5-INT-013) prove CNY credit + pre-fx park. User-approved 2026-06-10."
  reuse_discipline: "TECH-003 verified: producer / he.payment.v1 proto / payment.completed topic / recharge_orders schema / recharge endpoint shape ALL untouched. alipay is purely additive (new provider impl + registry entry + supportedProviders entry + 2 webhook route mounts + secrets). The ONE credit.go change is the scrutinised, justified guard fix above — no other spine modification."
  seam_parity: "alipay satisfies the same PaymentProvider contract (Name/CreateCheckout/VerifyWebhook/CreateSubscription); CreateSubscription returns a not-supported error (mirrors coinbase, Q-SUBSCOPE); no alipay branch leaks into the recharge handler or credit.go (proof-of-reuse for 7.6 WeChat)."
  toolchain: "go vet clean on payment-svc(alipay,webhook) + billing-svc(credit) + api-gateway(handlers); all referenced traceability-matrix test functions (14) confirmed to exist and pass."
