# No blocking issues. CI-001 is an env-limited execution follow-up; OBS-001 is a real-world
# integration nuance to watch, fail-safe by construction (false-reject only, never false-accept).
top_issues:
  - id: "CI-001"
    severity: low
    finding: "Full-stack testcontainers E2E (7.5-E2E-001/002, T4.1) is docker-gated; docker cannot run in the local review env. The AC1→AC2→AC3 journey is covered in composition by offline integration pieces: webhook/alipay_ingress_test.go (verify→emit boundary: forged→400+no-emit, S→one recharge_paid emit, U→no-emit, stale-replay→400) + credit_test.go (applier USD pass-through + CNY→USD fx-at-credit + pre-fx short-settle park)."
    suggested_action: "Run the full-stack recharge→notify→credit→GET /v1/balance journey (USD 1:1 / CNY@fx) in CI to obtain over-the-wire E2E proof, mirroring the 7.3/7.4 CI deferral."
  - id: "OBS-001"
    severity: low
    finding: "alipay.go parseSignatureHeader URL-decodes the Signature value via url.QueryUnescape. The inline comment claims only %-escapes are unescaped, but QueryUnescape also maps a literal '+' to space. Antom URL-encodes the base64 signature (a base64 '+' arrives as %2B), so genuine traffic is unaffected. A non-conformant literal '+' would corrupt the decode → verify-fail → reject (fail-closed). Worst case is a false-REJECT, never a false-accept."
    suggested_action: "Confirm against Antom sandbox that the Signature base64 is %-encoded (it is, per spec). If any literal '+' is ever observed, switch to a %-only unescape. No code change required for MVP — the failure mode is safe."

