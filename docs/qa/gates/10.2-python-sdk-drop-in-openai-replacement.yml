nfr_validation:
  security: { status: PASS, notes: "Key isolation verified in-code AND in-test (10.2-UNIT-012): `OPENAI_API_KEY` is never consulted — a missing/empty `HE_API_KEY` raises the native `openai.OpenAIError` BEFORE the upstream env fallback, so a real OpenAI key can never be silently routed to the He gateway (BR-10.2.7). Empty string treated as missing (BLIND-BOUNDARY-002), so no bare `Authorization: Bearer` is ever sent. Pure consumer — no new auth/crypto/PII/payment logic; credential handling is inherited from the openai SDK. No secrets in source." }
  performance: { status: PASS, notes: "Thin subclass; zero added per-request overhead beyond the inherited openai client. balance/usage are single forwarded GETs via the inherited escape-hatch." }
  reliability: { status: PASS, notes: "Drop-in identity by inheritance, not rewrite — SSE streaming, retries, pydantic models, `.with_raw_response`, async parity all inherited and asserted shape-faithful against `_protocol_invariants.py`. Layered pin (runtime `>=1.40,<2` + tight test `==1.40.*` + fail-loud drift guard) catches upstream breaking changes early. OQ5: `x-he-cost-usd` treated as possibly-absent, never billed from (10.2-INT-023)." }
  maintainability: { status: PASS, notes: "ruff clean (scoped to the package). hatchling backend, `__version__` single source of truth (asserted == importlib.metadata.version). Well-documented modules; new code minimal (only get_balance/get_usage). Establishes the SDK packaging paradigm reused by 10.3 (TS, Done) and 10.4 (Go, Approved)." }

