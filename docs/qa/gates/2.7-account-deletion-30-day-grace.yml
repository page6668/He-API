top_issues:
  - id: "QA-2.7-002"
    severity: low
    finding: >
      AC4 BR-4.1 (403_account_pending_deletion "for any non-recovery console/API
      access") is implemented on the GetMe/profile path + the console layout guard,
      not as a gateway-wide per-endpoint status gate (documented Dev Deviation #4).
      UNIT-024's example (GET /v1/me) is covered. Ratified by OQ-1 for MVP; acceptable.
    suggested_action: "Monitor — consider a gateway status-gate middleware in a follow-up (not blocking)."
  - id: "QA-2.7-003"
    severity: low
    finding: >
      Recovery page expired branch (account/recovery/page.tsx:43-47) also fires
      GraceExpiredSignOut when getDeletionState() returns kind:'error' (transient
      gateway read failure conflated with the genuine deleted/expired state —
      pre-existing line-44 grouping, not introduced by the QA-2.7-001 fix). A
      transient blip would sign the user out of recovery.
    suggested_action: >
      Monitor — bounded (fail-closed AC4 + OQ-1 re-loop signin→recovery means no
      lockout, only a redundant re-auth). Optional hardening: distinguish 'error'
      from 'deleted' and skip auto-signout on a transient read failure.

