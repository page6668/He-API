    - ac_id: AC2
      status: VERIFIED
      code_locations_verified: 4/4    # middleware/requestid + main.go wiring + go-observability extension + 11-obs.md §11.5
      test_locations_verified: 16/16  # UNIT-007..013 + UNIT-019 + UNIT-021 + BLIND-BOUNDARY-003 + BLIND-ERROR-002 + BLIND-CONCURRENCY-001/002 + BLIND-DATA-002 + BLIND-RESOURCE-001 + BLIND-FLOW-001 in requestid_test.go + INT-001/002/003/006 + UNIT-018 in logger_test.go
      aspects_verified:
