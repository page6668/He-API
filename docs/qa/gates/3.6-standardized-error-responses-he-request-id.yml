        business_rules: 10/10  # BR-2.1..BR-2.10
        data_validation: true
        error_handling: true
        ui_interaction: N_A
      notes: |
        middleware/requestid/requestid.go is the canonical stamper.
        RequestID(next) sets `X-He-Request-Id` header BEFORE
        next.ServeHTTP (BR-2.6), stamps context via private
        requestIDKey{} (BR-2.1), sets OTel span attribute
        `he.request_id` (BR-2.1 iii / BR-2.8 / §11.5 namespace).
        deriveRequestID(ctx) at line 86: `req_ + hex(TraceID[0:6])`
        when SpanContext is valid (BR-2.3 / OQ1); crypto/rand fallback
        when invalid (BR-2.4); sentinel `req_000000000000` if rand
        fails (D3 — observability-preserving on the unreachable Linux/
