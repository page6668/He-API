schema: 1
story: "3.6"
story_title: "标准化错误响应 + he_request_id"
gate: "PASS"
status_reason: |
  Round 1 full review. Both ACs traced and verified end-to-end. Story 3.6
  consolidates seven divergent error writers into a single canonical writer
  (`apps/api-gateway/internal/openaierr.Write`) and stamps a per-request
  `he_request_id` via the new `apps/api-gateway/internal/middleware/requestid`
  subpackage on every user-traffic response. Independent test execution:
  Story-3.6-specific packages all GREEN — `internal/openaierr` (15 unit
  tests + 50+ table-driven subtests; 1 intentional SKIP on the unreachable
  marshal-fail), `internal/middleware/requestid` (13 unit tests + 1
  intentional INAPPLICABLE-SKIP on per-span attribute model that downstream
  spans don't inherit), `cmd/server` (INT-001..006 PASS in
  `requestid_int_test.go`), `packages/go-observability` (5 tests including 3
  new BR-2.10 anchors). `openaierr.Write` call sites verified by grep: 64
  across 15 files (handlers + middleware); all divergent writers
  (`writeError`, `writeChatError`, `writeAPIKeyError`, `writeJWTError`,
  `mapErrorType`, `mapChatErrorType`) DELETED; the `paramValue` helper
  migrated out of `chat_completions.go` into `openaierr/`; inline
  `http.Error` JSON literals in `csrf.go` + `oauth_ratelimit.go` REMOVED.
  Canonical envelope shape pinned byte-exact by struct-based marshalling
  (BR-1.7 / Architect Round 1 OQ2 RATIFIED) — field order
  `code → message → type → param → he_request_id`. Derivation rule
  `req_ + hex(TraceID[0:6])` (BR-2.3 / OQ1) anchored by UNIT-008 (known
  TraceID → known req_id) and UNIT-007 (crypto/rand fallback for invalid
  span). All six Architect Round 1 OQs honoured as written: OQ1 derivation,
  OQ2 struct field order, OQ3 `Write` returns error, OQ4 no `details` field
  (5-field envelope contract preserved), OQ5 `WithRequestIDExtractor`
  auto-inject (slog stamps `he_request_id` alongside `trace_id` /
  `span_id`), OQ6 `requestid/` subpackage path. Architect Round 2 Low
  observations all anchored: L1 RETIRED-row exclusion (UNIT-014 PASS), L2
  csrf refactor mechanism (writeCSRFViolation re-signed to take `r
  *http.Request`), L3 jwt_verify 2→5 field shape upgrade (verified at code
  by grep — 4 openaierr.Write call sites in jwt_verify.go). Docs
  ratification complete: rest-api-spec.md §5.1.2 promoted non-OpenAI auth/
  account codes into the single canonical superset (Architect Round 1
  Medium-Issue ruling); §5.3 Change Log row appended;
  11-可观测性observability.md §11.5 created reserving the `he.` span-
  attribute namespace with `he.request_id` registered as first member;
  dev/api-registry.md + dev/models-registry.md updated. Dev decisions D1-D4
  all defensible (D1 codeMetadata superset expansion 38→57 codes non-
  regressive — UNIT-003 table-driven exercises all; D2 `WithRequestID`
  exported with GoDoc warning for cross-package tests; D3 rand-fail emits
  sentinel + proceeds — availability-preserving on the unreachable Linux/
  Darwin path; D4 two pre-existing flakes verified — TestColdStart passes
  in isolation, `TestChatCompletionsStream_ClientDisconnect_ConnectionClose`
  reproduces on stashed/clean tree → originated Story 3.4 commit 1b90571
  → NOT a Story 3.6 regression). Single MEDIUM finding: 3.6-BLIND-DATA-001
  (`Test_All_7_refactor_sites_header_equals_body`) cross-site integration
  sweep not implemented as a standalone matrix test (test design
  expectation). Substance partially covered at three sites (INT-002 / INT-
  004 / INT-005 cover bearer_auth + chat_completions + auth.go envelopes);
  gaps for jwt_verify (L3 anchor) + csrf (L2 anchor) + oauth_ratelimit
  envelope-shape integration tests. Mitigated by single-canonical-writer
  architecture: every code path now routes through `openaierr.Write` whose
  unit tests pin the envelope byte-exact, and the joint header==body
  invariant is structurally guaranteed by the writer reading from the same
  context-stamped req-id. Does NOT block PASS (defence-in-depth gap, not a
  correctness gap). FOLLOWUP Story recommended to add INT-009 / INT-010 /
  INT-011 for explicit anchoring.
