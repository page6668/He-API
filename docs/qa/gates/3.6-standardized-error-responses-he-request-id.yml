top_issues:
  - id: "QA-3.6-001"
    severity: medium
    finding: |
      3.6-BLIND-DATA-001 cross-site integration sweep
      (`Test_All_7_refactor_sites_header_equals_body`) not implemented as a
      standalone matrix test. Substance partially covered at three sites:
      INT-002 (models 401 — bearer_auth.go writeAPIKeyError),
      INT-004 (chat 413 — chat_completions.go writeChatError),
      INT-005 (auth signin 401 — auth.go writeError). Dedicated 5-field
      envelope-shape integration tests are missing for: jwt_verify.go
      writeJWTError (Architect Round 2 L3 anchor — 2→5 field shape
      upgrade), csrf.go writeCSRFViolation (Architect Round 2 L2 anchor —
      writeCSRFViolation refactor mechanism), oauth_ratelimit.go 503/429.
    disposition: |
      MEDIUM, non-blocking. The 5-field envelope contract is held in
      production via the single-canonical-writer architecture
      (`openaierr.Write` is the sole writer; 64 call sites across 15
      files; ALL divergent writers DELETED). Envelope shape is pinned
      byte-exact by openaierr unit tests (UNIT-001 / 016 byte comparison +
      UNIT-003 table-driven across 50+ codes). Joint header==body
      invariant is structurally guaranteed: every call reads the same
      context-stamped req-id via `requestid.FromContext`. The missing
      sweep would only catch FUTURE regressions where a contributor
      reintroduces a divergent writer, a class catchable by static
      analysis (forbid `http.ResponseWriter.Write` outside `openaierr/`).
      Recommendation: FOLLOWUP Story to add INT-009 (jwt 401/403),
      INT-010 (csrf 403), INT-011 (oauth_ratelimit 429/503) — satisfies
      BLIND-DATA-001 + L2/L3 explicit anchoring. Does NOT block Story 3.6
      gate PASS.
    location: "docs/qa/assessments/3.6-test-design-20260519.md line 173 (test design spec); no implementation in apps/api-gateway/"

monitor_carry_overs:
  - id: "QA-3.6-001"
    severity: low
    finding: |
      Story-3.6 Python SDK contract tests
      (apps/api-gateway/tests/openai_sdk_error_contract_test.py — E2E-001..005)
      are env-guarded (Story-3.3 BR-3.4 pattern — `pytest.mark.skipif` on
      `HE_API_TEST_GATEWAY_URL`) and were NOT executed during this QA review
      run because no live gateway is started. Static verification: file
      `py_compile`-clean (5254 bytes); 5 `def test_*` functions populated
      with real assertions (NOT stubs); skipif guard raises clearly when env
      var missing.
    disposition: |
      Confirm the next PR's `gateway / openai-sdk-contract` CI job picks up
      the new test file and exits 0 to close this monitor entry. Pytest
      auto-discovers `*_test.py` under `apps/api-gateway/tests/` so no CI
      wiring change is needed. The Go-side INT-001..006 already prove the
      middleware → handler → response wire chain end-to-end inside the
      process via `httptest.NewServer` (TCP loopback). The only delta vs
      E2E is the OpenAI SDK Pydantic-model layer.
    location: "apps/api-gateway/tests/openai_sdk_error_contract_test.py"
  - id: "QA-3.6-002"
    severity: low
    finding: |
      Pre-existing test flake — `TestChatCompletionsStream_ClientDisconnect_ConnectionClose`
      at apps/api-gateway/internal/handlers/chat_completions_stream_test.go:591
      fails intermittently with `log never showed client_disconnected=true`.
      QA verified the flake reproduces on a stashed clean tree (with Story
      3.6 changes stashed away), confirming it is NOT a Story 3.6
      regression. The test was introduced by Story 3.4 commit 1b90571.
    disposition: |
      Out of scope for Story 3.6. Track via Story 3.4 hotfix or Epic 9
      observability hardening. The test's flake mode is timing-based —
      assertion runs before the response handler's deferred slog emit
      completes. Recommendation: convert the polling assertion to use
      `assert.Eventually` with a 2s deadline, or refactor the handler to
      emit the `client_disconnected=true` log synchronously before
      returning from the stream loop.
    location: "apps/api-gateway/internal/handlers/chat_completions_stream_test.go:591"

