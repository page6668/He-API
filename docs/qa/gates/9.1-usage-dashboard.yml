round1_blocker_resolution:
  9.1-H-A:
    round1: "AC3 消费 card structurally always $0 (gateway has no cost source); H-1 premise false."
    round2: RESOLVED
    evidence: >
      Architect *review-escalation ruled H-1-R (消费 ← PG usage_ledger). Dev re-wired (verified):
      analyticsquery/store.go — CH todayQuery/aggQuery NO LONGER select cost_usd (R2-3); NEW pgCostStore
      runs `SELECT COALESCE(SUM(cost_usd),0)::text FROM he_api.usage_ledger WHERE user_id=$1 AND ts>=$2`
      (IDOR-fenced, R2-6) over the SAME user-tz bounds as CH (R2-1). handler.go — cost_usd *string nullable;
      costFor() returns nil → null on usage_ledger error WITHOUT emitting 503 (R2-4 independent degradation).
      main.go — NewCostStore(billingPool) REUSES the existing billing pgxpool, typed-nil guarded (R2-6, no
      new PG path). Console UsageStatCards renders cost null→"—" via the reused 5.5 money helper; me-usage.ts
      Zod cost_usd nullable. 11 analyticsquery tests GREEN (-race) incl. TestIDORFence (both stores +
      query-param strict-reject + no-store-queried-on-attack), TestSummaryThreeWindows (+ same-bounds assert),
      TestCostPartialDegradation (R2-4), TestNilCostStoreRendersNull, TestZeroRequestsNullSuccessRate.
  9.1-H-B:
    round1: "All 30 T0-T7 checkboxes unchecked (under-claim)."
    round2: RESOLVED
    evidence: "26 boxes [x] (deliverable exists AND test GREEN/CI-executed); 3 left [ ] honestly — T7.1 (E2E test.skip), T7.3 (perf, not measured), T7.4 (visual test.skip) — each with an explicit STATUS note. No false claims."
  9.1-H-C:
    round1: "User-facing /dashboard + P0 E2E/integration never executed in any env."
    round2: PARTIALLY_RESOLVED
    evidence: >
      NEW .github/workflows/test.yml `clickhouse-integration` job: boots ClickHouse 24.3, applies migration
      002 (up → asserts request_logs + hourly_agg EXIST = 9.1-INT-003 forward), runs `go test -tags=integration`
