# Non-blocking follow-ups (documented, precedent-aligned, with compensating controls):
follow_ups:
  - id: "FU-8.5-1"
    severity: low
    finding: "INT-003 (create user + logs → DELETE FROM users → logs survive) and MIG-002 (apply 0014 + `atlas migrate down 1` round-trip) are not exercised against a live DB — local env has no docker/atlas (project_toolchain_env_limits). Dev disclosed this clearly."
    compensating_control: "MIG-001 statically asserts content_safety_logs carries NO `REFERENCES he_api.users` and NO `ON DELETE CASCADE` (executable DDL, comments stripped) — a cascade is structurally impossible, so the delete-user-survives property holds by construction. Migration is additive (brand-new table + 2 indexes, no backfill) → reversible by construction."
    suggested_action: "A docker/atlas-capable CI or staging step should run the delete-user-survives integration test and the apply/down-1 round-trip before/at deploy."
  - id: "FU-8.5-2"
    severity: low
    finding: "The v1 production excerpt (maskedMatchExcerpt) is ■×rune-count of the canonical matched_rule id — it carries the match LENGTH but no surrounding 命中 context, because the frozen SafetyEvent seam (BR-1.5) carries no raw window. The full RedactExcerpt policy (masked span + PII-masked context window) is implemented and HARD property-tested but not yet fed a real window."
    compensating_control: "By design and documented (recorder.go / redact.go doc comments + story Dev Notes). The structured fields (direction/severity/category via lexicon, matched_rule canonical id, strictness) carry the audit-meaningful attribution; the excerpt is supplementary. NULL is a valid column state."
    suggested_action: "A future story that threads a raw context window into SafetyEvent can switch the recorder to RedactExcerpt(window, match) with zero redaction-policy change (the policy is already shipped + tested)."
  - id: "FU-8.5-3"
    severity: low
    finding: "TestColdStart (a PRE-EXISTING Story-3.1 cold-start P95 bench in cmd/server, not an 8.5 test) flapped once during the full -race suite run: P95 2.61s vs 1s budget, driven entirely by a single 4.7s first-of-10-boots sample (the other 9 ~23ms)."
    compensating_control: "Isolated re-runs of TestColdStart PASS ×2 (3.5s each). The 8.5 main.go change only hoists buildBillingPool (lazy pgxpool.New — no connection at boot) and swaps NopRecorder for the persisting Recorder whose worker starts as a goroutine — neither adds per-boot latency (if it did, all 10 samples would be elevated, not just the first). Root cause is OS page-cache warmup of the freshly-built binary's first exec under a machine still saturated by the heavy -race suite."
    suggested_action: "Pre-existing bench-host-variance concern independent of this story; consider a warmup discard or larger sample in the 3.1 cold-start runner."

