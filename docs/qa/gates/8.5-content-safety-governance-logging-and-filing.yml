  performance: { status: PASS, notes: "Record is a non-blocking channel enqueue on the rare block path; the INSERT runs off-path on a single drain goroutine; clean path untouched. BENCH-001 soft-gate (50µs ceiling) present." }
  reliability: { status: PASS, notes: "Graceful flush-then-exit on ctx cancel (bounded drainTimeout) so a normal redeploy loses no in-flight events; bounded buffer drops + counts under sustained DB outage rather than wedging; nil pool degrades to NopRecorder (degraded-but-serving)." }
  maintainability: { status: PASS, notes: "Persisting Recorder isolated in the NEW safetylog package; contentsafety stays lexicon-only / import-cycle-free; SafetyEvent seam reused verbatim (no new field, no call-site change); migration additive + forward-only (0006 convention)." }

