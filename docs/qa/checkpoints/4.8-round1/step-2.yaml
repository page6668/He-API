rationale: |
  Repo is a Go monolith (apps/api-gateway + apps/adapters/{vendor}) + Python contract tests
  (apps/api-gateway/tests/). For Story 4.8 review, the testable deliverables are:
  (a) Python meta-tests _protocol_invariants_test.py (pytest)
  (b) Six fake-upstream Go binaries + their main_test.go (go test)
