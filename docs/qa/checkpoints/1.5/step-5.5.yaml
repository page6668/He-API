issues:
  - severity: LOW
    category: ERROR
    description: |
      WrapHTTPHandler does not guard against nil handler input (BLIND-ERROR-004). Current
      behavior: mux.Handle("/", nil) will panic with a descriptive Go runtime message —
      "http: nil handler". Acceptable for an internal API (callers control the input), but
      a `if h == nil { h = http.NotFoundHandler() }` defensive guard would harden the
      contract for the 14 future services. Non-blocking; defer to Epic 2 Story 2.1 followup.
    recommendation: 'Add nil-guard or document the contract explicitly'

  - severity: LOW
    category: ALL
    description: |
      18/20 blind-spot scenarios are test.skip with reason "runtime/CI/E2E scenario".
      Same operator-deferral pattern as AC1.C/AC1.D evidence and accepted in Stories 1.3/1.4.
      Recommend a follow-up Story (or Epic 2 piggyback) to wire these into an integration job
      that actually scaffolds a throwaway service and runs the regex/cleanup/race assertions
      against a real bash subshell.
    recommendation: 'Run integration job in CI that scaffolds throwaway-svc + exercises regex/SIGTERM/parallel'

