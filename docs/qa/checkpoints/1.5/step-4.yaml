  go_tests:
    test_command: 'go test -ldflags="-linkmode=external -extldflags=-Wl,-random_uuid" ./...'
    workaround_reason: |
      Pure-Go binaries on macOS 15.x ARM64 missing LC_UUID; forcing external linkmode
      injects a UUID and unblocks loader. Default `go test ./...` fails with
      `dyld[<pid>]: missing LC_UUID load command — signal: abort trap`. NOT a Story
      1.5 code issue.
