step: 6
name: evidence_collection
evidence:
  directory: 'docs/qa/evidence/1.5/'
  files_collected: 0  # no on-disk evidence artefacts; all evidence is in-line in checkpoint files + dev-log
  rationale: |
    No screenshots or runtime captures applicable — runtime evidence is operator-deferred
    (AC1.C wall-clock + AC1.D cluster) and documented in docs/dev/logs/1.5-dev-log.md §E2E.
    QA findings live in the checkpoint files (step-4.yaml..step-5.5.yaml) and in the gate
    YAML; all reproduction commands are bash one-liners that run from the repo root.
issues_with_evidence:
