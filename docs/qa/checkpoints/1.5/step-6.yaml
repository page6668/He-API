    evidence_paths:
      - 'scripts/scaffold-svc/templates/package.json.tmpl:8-9 (source)'
      - 'apps/sample-grpc-app/package.json:8-9 (dogfood output)'
    reproduction: |
      pnpm --filter @he-api/sample-grpc-app test  # stdout shows: `test runs via go workspace not Turborepo "`
  - issue_id: 'LOW-1.5-AC1.D-WrapHTTPHandler-nil-guard'
    evidence_paths:
      - 'packages/go-observability/http.go:19-24'
    reproduction: |
      # Would panic with "http: nil handler"
      go test ./... -run TestWrapHTTPHandlerNilInput  # test not present; deferred BLIND-ERROR-004
  - issue_id: 'LOW-1.5-AC1.C-AC1.D-runtime-deferred'
    evidence_paths:
      - 'docs/dev/logs/1.5-dev-log.md §E2E (operator hand-off recipe)'
      - 'docs/stories/1.5-internal-grpc-service-template-go.md "Open Issues" L:879-880'
