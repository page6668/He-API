    issues:
      - severity: LOW
        ref: "BR-5.10"
        finding: "Account-lock precedence ('BEFORE running any 2FA logic, return 423 if users.status='locked'') is not checked at the start of ChallengeTOTP. Practically the lockout that matters (in-flight 5-fail) is correctly handled — line 109-126 soft-locks + DELs JTI. The cross-endpoint case (user gets locked between login and challenge) would surface as a downstream failure rather than the prescribed 423 early-return."
        recommendation: "Add an early users.status='locked' AND locked_until>NOW() short-circuit in ChallengeTOTP/UseRecoveryCode before KMS decrypt. Non-blocking — defense-in-depth."
    notes: "Cross-token rejection (Architect Q2 HARD) verified at three boundaries: jwt.ParseMFAToken purpose check (mfa_token.go:160), VerifyAccess purpose-empty check (mfa_token.go:200), and gateway middleware. Tests UNIT-035 + UNIT-036 + UNIT-036b present."
