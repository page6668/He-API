        finding: "ASVS L2 checklist at docs/qa/checkpoints/2.4/asvs-l2-checklist.md has Dev Evidence Summary block at the top but 53 per-requirement '⏳ PENDING DEV' markers remain. Dev landed a summary; per-control evidence rows were not filled."
        recommendation: "Dev fills the per-control evidence rows (one-line citations to source/tests) in a follow-up edit; QA signs off post-fill."
        blocking: false
    notes: "DefaultRedactKeys list = [password, token, cookie, secret, authorization, bearer, recovery_code, otpauth] — case-insensitive substring matching covers BR-5.8 sensitive-field redaction."
  AC6:
