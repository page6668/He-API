    issues:
      - severity: LOW
        id: "AC6-UI-001"
        ref: "T1.4 / T2.7 / T3.5 / T4.4 / T6.3 / T6.4"
        finding: "Console UI (TOTPEnrollWizard, /2fa-challenge page, RegenerateRecoveryCodesModal, TOTPDisableModal, LowRecoveryCodesBanner, QRCodePanel, RecoveryCodesGrid), axe-core a11y, and RTL visual baselines are deferred to a follow-up PR by Dev. AC6 'UI flows' explicitly enumerates these as in-scope deliverables."
        impact: "Backend AC6 (i18n key parity) is met; user-facing UI is not. End users cannot exercise 2FA through console until follow-up PR ships."
        recommendation: "Track as follow-up PR (Dev already documented this in §AC traceability notes). For Story 2.4 closure-as-Done: either narrow AC6 to backend-only or split into 2.4a (backend) + 2.4b (UI)."
        blocking: false   # documented deferral; spec scope question, not implementation defect
