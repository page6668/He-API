    aspects:
      main_scenario: true       # password + OAuth paths both wire mfa_token issuance
      business_rules: true      # BR-2.2 single-use JTI ✓, BR-2.3 IP/UA binding ✓, BR-2.4 ±1 window ✓, BR-2.5 crypto/subtle ✓, BR-2.6 5-fail soft-lock + DEL JTI ✓, BR-2.8 aal=2 claim ✓
