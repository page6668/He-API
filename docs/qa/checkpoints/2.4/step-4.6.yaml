    traceability_entry_found: true
    status: VERIFIED
    aspects:
      main_scenario: true
      business_rules: true      # BR-3.1 50-bit base32 entropy ✓, BR-3.2 bcrypt cost=12 ✓, BR-3.3 atomic mark-used WHERE used_at IS NULL ✓, BR-3.6 constant-time iterate-all-rows ✓ (line 142-149 deliberately Do-NOT-break), BR-3.7 low signal ✓, BR-3.8 every-use email ✓
      data_validation: true
      error_handling: true
    issues: []
    notes: "totp_recovery.go:145 uses short-circuit Compare(...)&&matchedID==Nil; Go evaluates left-to-right so bcrypt.Compare is still called on every iteration — constant-time invariant preserved."
  AC4:
    traceability_entry_found: true
    status: PARTIAL_HIGH
    aspects:
      main_scenario: true
      business_rules: false     # BR-3.9 + AC4 Scenario require 'single PG transaction'; implementation runs ClearTOTPSecret + DeleteAllRecoveryCodesForUser as two non-transactional statements
      data_validation: true
      error_handling: true
    issues:
      - severity: HIGH
        id: "AC4-TX-001"
        ref: "AC4 Scenario / BR-3.9"
        finding: "DisableTOTP runs ClearTOTPSecret (UPDATE users) and DeleteAllRecoveryCodesForUser (DELETE FROM mfa_recovery_codes) as TWO independent non-transactional statements (totp_disable.go:121-126). Comment at line 115-120 explicitly acknowledges: 'we don't open a transaction here … see Architect §Rec.1 design note for the production cmd/server tx-capable upgrade.'"
        impact: "On partial failure (DB connection drop between the two statements), user ends up with totp_enabled=FALSE but ORPHAN recovery_code rows. Re-enroll (AC1) would then accumulate stale codes; forensic queries would see inconsistent state; violates BR-3.9 ('all mfa_recovery_codes rows for the user are physically deleted')."
        recommendation: "Either (a) elevate the Querier interface to support tx-capable callers and wrap both statements in a single transaction, or (b) accept the gap explicitly via a Story 2.4 follow-up TODO + ticket + Open Issue in Dev Agent Record. Blind-spot test 2.4-BLIND-DATA-002 ('inject failure → both rolled back') is also missing."
        blocking: true
    notes: "aal=2 gate enforced at gateway via RequireAAL(2); factor re-verify defense-in-depth in auth-svc; HIGH-severity audit + email out-of-band all correct."
