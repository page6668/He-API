      reproduction_steps: |
        1. cat apps/auth-svc/internal/handlers/totp_disable.go +115..+126
        2. Observe: ClearTOTPSecret (UPDATE users) and DeleteAllRecoveryCodesForUser
           (DELETE) execute as two independent statements on the same Querier.
        3. Code comment at line 115-120 acknowledges: "we don't open a transaction
           here … see Architect §Rec.1 design note for the production cmd/server
           tx-capable upgrade".
      acceptance_criteria_violated:
