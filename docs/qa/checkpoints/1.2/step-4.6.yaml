step: 4.6
name: ac_coverage_verification
mode: incremental_focused   # previous round had failed_acs: ["AC1", "AC2"]

# 4.6.1.5 Placeholder pre-scan (was the original FAIL trigger in Round 1)
placeholder_scan:
  total_acs: 2
  placeholder_detected: 0       # all code_locations are now real file:line-range refs
  aspects_unchanged: 0          # at least main_scenario, business_rules, data_validation are true
  clean_entries: 2
  flagged_acs: []

# 4.6.2 Per-AC semantic verification
details:
  - ac_id: AC1
    title: "PR 自动跑 lint / unit / integration"
    traceability_entry_found: true
    code_locations_verified:
      - { path: ".github/workflows/lint.yml:1-60", exists: true, semantically_implements: true }
      - { path: ".github/workflows/test.yml:1-85", exists: true, semantically_implements: true }
      - { path: ".github/workflows/build-images.yml:1-36", exists: true, semantically_implements: true }
      - { path: ".golangci.yml:1-15", exists: true, semantically_implements: true }
      - { path: "apps/api-gateway/cmd/server/main_test.go:1-9", exists: true, semantically_implements: true }
      - { path: "packages/shared-types/__tests__/empty.test.ts:1-9", exists: true, semantically_implements: true }
      - { path: "packages/shared-types/vitest.config.ts:1-8", exists: true, semantically_implements: true }
      - { path: "packages/shared-types/package.json:16-23", exists: true, semantically_implements: true }
    test_locations_verified:
      - { path: "packages/shared-types/__tests__/1.2-ci-cd-pipeline-github-actions.test.ts", tests_pass: true, count: "UNIT-001..011 + BLIND-BOUNDARY-004 + deliverable-presence" }
    aspects_verified:
      main_scenario: true         # 6 PR status checks defined via lint.yml + test.yml + build-images.yml.build-image-pr
      business_rules: true        # UNIT-007 concurrency + BLIND-BOUNDARY-004 scope-drift guard
      data_validation: true       # UNIT-001 enforces .golangci linters, UNIT-005 enforces CGO_ENABLED=1+race
      error_handling: deferred    # injection of lint/test failures → red is INT-002/003/004 (test.skip, runtime PR scope)
      ui_interaction: N_A
    status: VERIFIED              # all 4 static aspects pass; error_handling deferral is documented design intent
    issues: []

  - ac_id: AC2
    title: "merge 自动部署 staging"
    traceability_entry_found: true
    code_locations_verified:
      - { path: ".github/workflows/deploy-staging.yml:1-100", exists: true, semantically_implements: true }
      - { path: ".github/workflows/build-images.yml:36-85", exists: true, semantically_implements: true }
      - { path: "apps/api-gateway/Dockerfile:1-13", exists: true, semantically_implements: true }
      - { path: "README.md (CI/CD section line 97+)", exists: true, semantically_implements: true }
    test_locations_verified:
      - { path: "packages/shared-types/__tests__/1.2-ci-cd-pipeline-github-actions.test.ts", tests_pass: true, count: "UNIT-012..020 + BLIND-BOUNDARY-001/002/003 + BLIND-ERROR-002/004 + BLIND-CONCURRENCY-002 + BLIND-RESOURCE-001/002" }
    aspects_verified:
      main_scenario: true         # UNIT-015 workflow_run + UNIT-018 probe_helm gating + UNIT-019 download-artifact run-id pin
      business_rules: true        # UNIT-012/013/014 HAS_ACR gating + immutable :${github.sha} + unconditional artifact upload
      data_validation: true       # BLIND-BOUNDARY-003 image-sha emptiness fails visibly; UNIT-019 run-id pinned
      error_handling: true        # UNIT-015 conclusion guard + BLIND-ERROR-002 retention + BLIND-ERROR-004 README bypass guard
      ui_interaction: N_A
    status: VERIFIED
    issues: []

# 4.6.3 Cross-reference with Dev self-review
discrepancies: []                 # QA findings match Dev claims exactly

summary:
  total_acs: 2
  fully_verified: 2
  partially_verified: 0
  not_verified: 0
  coverage_rate: 100

issues_by_severity:
  critical: []
  high: []
  medium: []

# 4.6.5 Decision
ac_coverage_result:
  result: PASS
  coverage_rate: 100
  blocking_issues: 0

ac_coverage:
  verification_method: 'traceability_verification'
  coverage_rate: 100
  passed: true
  blocking_issues_count: 0
  issues: []
