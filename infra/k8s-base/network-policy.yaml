# Default-deny baseline NetworkPolicy + allow-from-ingress-nginx.
#
# Per Architect Round 1 + docs/architecture/infrastructure-deployment.md §7.2:
#   * Each he-api-* namespace gets `default-deny-ingress` — no inbound traffic
#     is permitted unless an explicit NetworkPolicy allows it.
#   * `allow-from-ingress-nginx` lets pods in `ingress-nginx` namespace reach
#     workloads (effective once Story 1.4 installs the ingress controller;
#     until then this NP is a no-op because the namespace has no pods).
#   * Cross-namespace traffic between he-api-* namespaces is denied by
#     default. Workloads that need it must add their own NP.
---
# ============================================================================
# he-api-staging
# ============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: he-api-staging
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-ingress-nginx
  namespace: he-api-staging
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
---
# ============================================================================
# he-api-prod
# ============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: he-api-prod
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-ingress-nginx
  namespace: he-api-prod
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
