# Staging resource quota — limits to prevent accidental large-chart installs
# from exhausting the 3-node worker pool. Tuned for the Story 1.3 / 1.4 / 1.5
# scope; revisit at Story 1.6 when stateful workloads land.
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: he-api-staging-quota
  namespace: he-api-staging
spec:
  hard:
    pods: "10"
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "8"
    limits.memory: 16Gi
