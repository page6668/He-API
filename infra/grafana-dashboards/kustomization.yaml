apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Grafana dashboards are shipped as ConfigMaps carrying the
# `grafana_dashboard: "1"` label. The Grafana sidecar enabled in
# infra/helm/observability/kube-prometheus-stack/values-staging.yaml auto-loads
# any ConfigMap with this label, regardless of namespace.

commonLabels:
  grafana_dashboard: "1"
  app.kubernetes.io/part-of: he-api
  app.kubernetes.io/managed-by: kustomize-story-1.4

configMapGenerator:
  - name: he-api-dashboards
    files:
      - gateway.json
      - business.json
      - model.json
      - payment.json
      - compliance.json
    options:
      labels:
        grafana_dashboard: "1"
      disableNameSuffixHash: true
