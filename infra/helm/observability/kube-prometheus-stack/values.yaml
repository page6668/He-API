# Default values for the kube-prometheus-stack wrapper.
#
# Per-env overrides live in values-staging.yaml. Architect Round 1 Q1 ruling:
# hybrid distribution — this chart is the umbrella (Prometheus + Grafana +
# Alertmanager + Operator + kube-state-metrics).
kube-prometheus-stack:
  fullnameOverride: kube-prometheus-stack

# Story 10.7 AC1 (OQ-10.7-1.2 / BR-10.7.3) — Alertmanager receiver secrets
# (PagerDuty routing key / 飞书 / Slack webhook URLs / SMTP password) pulled from
# Vault by an ExternalSecret (templates/externalsecret-alerting.yaml). DISABLED
# by default — enabled only in a real cluster with external-secrets + Vault
# provisioned. dev/CI never holds a real key (the receivers read absent files).
alertingExternalSecret:
  enabled: false
  refreshInterval: 1h
  secretStoreRef:
    name: he-api-vault
    kind: ClusterSecretStore
  vaultPath: "kv/data/he-api/alerting"
