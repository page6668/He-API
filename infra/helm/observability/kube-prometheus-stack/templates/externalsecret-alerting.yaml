{{- if .Values.alertingExternalSecret.enabled }}
# Story 10.7 AC1 (OQ-10.7-1.2 / BR-10.7.3) — the Alertmanager receiver secrets.
#
# PagerDuty routing key, 飞书 webhook URL, Slack webhook URL, and the SMTP auth
# password are pulled from Vault (kv/data/he-api/alerting/*) into a K8s Secret
# named `alertmanager-alerting-secrets`, which the Alertmanager pod mounts via
# `alertmanagerSpec.secrets` (see values-staging.yaml). Receivers reference the
# mounted files by `*_file` — the secret values are NEVER committed to git.
# Disabled in dev/CI (alertingExternalSecret.enabled=false) so no real key is
# ever required to render/lint the chart.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: alertmanager-alerting-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: kube-prometheus-stack
    app.kubernetes.io/part-of: he-api
spec:
  refreshInterval: {{ .Values.alertingExternalSecret.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.alertingExternalSecret.secretStoreRef.name }}
    kind: {{ .Values.alertingExternalSecret.secretStoreRef.kind }}
  target:
    # MUST match alertmanagerSpec.secrets[] so the keys mount at
    # /etc/alertmanager/secrets/alertmanager-alerting-secrets/<key>.
    name: alertmanager-alerting-secrets
    creationPolicy: Owner
  data:
    - secretKey: pagerduty_routing_key
      remoteRef:
        key: {{ .Values.alertingExternalSecret.vaultPath }}
        property: pagerduty_routing_key
    - secretKey: feishu_webhook_url
      remoteRef:
        key: {{ .Values.alertingExternalSecret.vaultPath }}
        property: feishu_webhook_url
    - secretKey: slack_webhook_url
      remoteRef:
        key: {{ .Values.alertingExternalSecret.vaultPath }}
        property: slack_webhook_url
    - secretKey: smtp_auth_password
      remoteRef:
        key: {{ .Values.alertingExternalSecret.vaultPath }}
        property: smtp_auth_password
{{- end }}
