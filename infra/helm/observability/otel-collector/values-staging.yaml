# OpenTelemetry Collector staging overrides — Story 1.4.
#
# Architect Round 1 rulings:
#   * Q1 — gateway-form Collector (deployment mode), single replica for staging.
#   * Q2 + M-5 — exports traces ONLY to jaeger-collector (architecture §11.1).
#   * M-1 — metrics flow OTLP → Prometheus exporter scraped by kube-prometheus-stack.
#
# Static-test contract: values-staging.yaml is loaded by
# packages/shared-types/__tests__/1.4-otel-prometheus-loki-grafana.test.ts
# (1.4-UNIT-050 … -059).

mode: deployment
replicaCount: 1

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

config:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

  processors:
    batch:
      timeout: 5s
      send_batch_size: 1024
    # Story 9.4 BR-TR-16 / Q-COLLECTOR — defense-in-depth PII keep-list. With
    # allow_all_keys=false the redaction processor DROPS any span attribute whose
    # key is not explicitly allowed, BEFORE the trace reaches Jaeger storage. This
    # is the runtime backstop to the code-level discipline (BR-TR-7): even a future
    # careless span cannot leak a prompt/key/email/client-IP into the store.
    # The list is a SUPERSET of the registered §11.5 `he.*` keys + the OTel semconv
    # we emit. Deliberately EXCLUDED (so they are stripped): client.address /
    # net.sock.peer.addr (client IP), url.full (query secrets), and anything
    # carrying request/response bodies, Authorization, or api-key material.
    redaction:
      allow_all_keys: false
      allowed_keys:
        # he.* allow-list (⊇ §11.5 registry: he.request_id; + forward-safe keys)
        - he.request_id
        - he.selected_model
        - he.cost_usd
        # HTTP server/client semconv (no client IP, no full URL)
        - http.request.method
        - http.method
        - http.response.status_code
        - http.status_code
        - http.route
        - http.target
        - url.path
        - url.scheme
        - server.address
        - server.port
        - network.protocol.version
        - network.protocol.name
        - network.transport
        - user_agent.original
        # RPC (connect/gRPC) semconv
        - rpc.system
        - rpc.service
        - rpc.method
        - rpc.grpc.status_code
        # storage semconv (no statement text / no params)
        - db.system
        - db.name
        - db.operation
        # messaging (Kafka) semconv
        - messaging.system
        - messaging.destination.name
        - messaging.operation
        # span status
        - otel.status_code
        - otel.status_description
      summary: debug
    # Story 9.4 Q-COLLECTOR — tail sampling: ALWAYS keep ERROR / non-OK traces at
    # 100% (the home of "errors always sampled" from Q-SAMPLE — head sampling can't
    # know an error at root-span time), and a bounded probabilistic baseline for the
    # rest. See infrastructure-deployment.md for the head ↔ tail volume interaction.
    tail_sampling:
      decision_wait: 10s
      num_traces: 50000
      expected_new_traces_per_sec: 100
      policies:
        - name: keep-errors
          type: status_code
          status_code:
            status_codes: [ERROR]
        - name: baseline-probabilistic
          type: probabilistic
          probabilistic:
            sampling_percentage: 10
    k8sattributes:
      auth_type: serviceAccount
      passthrough: false
      extract:
        metadata:
          - k8s.pod.name
          - k8s.namespace.name
          - k8s.node.name
          - k8s.pod.uid
      pod_association:
        - sources:
            - from: resource_attribute
              name: k8s.pod.ip
        - sources:
            - from: connection

  exporters:
    otlp:
      # Trace backend is Jaeger only (architecture §11.1; Q2 ruling).
      endpoint: jaeger-collector.monitoring.svc.cluster.local:4317
      tls:
        insecure: true
    prometheus:
      # Scraped by the kube-prometheus-stack Prometheus via the
      # ServiceMonitor declared in templates/servicemonitor.yaml.
      endpoint: 0.0.0.0:8889

  service:
    pipelines:
      traces:
        # Story 9.4 — redaction (PII keep-list) → tail_sampling (errors 100% +
        # baseline) → batch → Jaeger. Order matters: scrub BEFORE the sampling
        # decision and BEFORE export.
        receivers: [otlp]
        processors: [redaction, tail_sampling, batch]
        exporters: [otlp]
      metrics:
        receivers: [otlp]
        processors: [batch]
        exporters: [prometheus]

ports:
  otlp:
    enabled: true
    containerPort: 4317
    servicePort: 4317
    protocol: TCP
  otlp-http:
    enabled: true
    containerPort: 4318
    servicePort: 4318
    protocol: TCP
  metrics:
    enabled: true
    containerPort: 8889
    servicePort: 8889
    protocol: TCP

serviceAccount:
  create: true
  name: otel-collector
