{{- if .Values.serviceMonitor.enabled -}}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "db-doctor.fullname" . }}
  labels:
    {{- include "db-doctor.labels" . | nindent 4 }}
    # Match the kube-prometheus-stack Prometheus serviceMonitorSelector (release label).
    release: {{ .Values.serviceMonitor.release }}
spec:
  selector:
    matchLabels:
      {{- include "db-doctor.selectorLabels" . | nindent 6 }}
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  endpoints:
    - port: metrics
      path: /metrics
      interval: {{ .Values.serviceMonitor.interval }}
      targetPort: 9090
{{- end }}
