apiVersion: v1
kind: Secret
# Story 1.6 M-1 ruling: plain Kubernetes Secret only. ExternalSecret /
# SealedSecret operators are intentionally NOT used here; values are sourced
# from Terraform-injected variables flowing through `helm install -f values-staging.yaml`.
# A future dedicated Vault Story will replace this template's data source with
# an ExternalSecret CR pointing at Vault path secret/he-api/staging/db/* — the
# Secret name (he-api-db-creds) stays identical so application contracts are
# zero-touch (see docs/architecture/database-bootstrap.md §3 Vault Migration Path).
metadata:
  name: he-api-db-creds
  namespace: {{ .Release.Namespace }}
  annotations:
    cloud.alibaba.com/kms-encrypted: "true"
  labels:
    {{- include "db-doctor.labels" . | nindent 4 }}
type: Opaque
data:
  HE_API_DB_POSTGRES_URI: {{ .Values.postgres.uri | b64enc | quote }}
  HE_API_DB_REDIS_URI: {{ .Values.redis.uri | b64enc | quote }}
  HE_API_DB_CLICKHOUSE_URI: {{ .Values.clickhouse.uri | b64enc | quote }}
