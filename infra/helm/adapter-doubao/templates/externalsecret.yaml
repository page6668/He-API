{{- if .Values.externalSecret.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: adapter-doubao-upstream-api-key
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: adapter-doubao
    app.kubernetes.io/part-of: he-api
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.externalSecret.secretStoreRef.name }}
    kind: {{ .Values.externalSecret.secretStoreRef.kind }}
  target:
    name: adapter-doubao-upstream-api-key
    creationPolicy: Owner
  data:
    - secretKey: api_key
      remoteRef:
        # Architect Round 1 OQ3 ratification (Story 4.1) — Story 4.5
        # inherits: kv/data/he-api/upstream/doubao/, key `api_key`.
        # Operator-managed (Volcengine does NOT support API-key auto-rotation;
        # same operational posture as DeepSeek + Qwen + Kimi + GLM).
        #
        # NOTE: the endpoint-id constants DOUBAO_PRO_ENDPOINT_ID +
        # DOUBAO_LITE_ENDPOINT_ID are NOT secrets — they live in the
        # `doubao-endpoint-ids` ConfigMap per OQ-4.5-4 ratification.
        key: {{ .Values.externalSecret.vaultPath }}
        property: {{ .Values.externalSecret.remoteKey }}
{{- end }}
