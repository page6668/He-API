replicaCount: 1

image:
  repository: he-api-registry-vpc.cn-hongkong.cr.aliyuncs.com/he-api/console
  tag: "latest"
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: acr-pull

# In-cluster api-gateway Service URL the console BFF calls (public models,
# auth/BFF server actions). he-api-staging namespace → short Service name.
gatewayUrl: http://api-gateway:8080

service:
  type: ClusterIP
  port: 3000
  annotations: {}

resources:
  requests:
    cpu: 100m
    memory: 192Mi
  limits:
    cpu: "1"
    memory: 512Mi
