image:
  repository: he-api-registry.cn-hongkong.cr.aliyuncs.com/he-api/analytics-svc
  tag: "f5af7a5c0f3c62f8d5530029b78f87d9f66d2024"
  pullPolicy: IfNotPresent
replicaCount: 1
service:
  type: ClusterIP
  port: 8080
networkPolicy:
  enabled: true
serviceAccount:
  create: true
  name: ""
serviceMonitor:
  enabled: true
  interval: 15s
