apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "analytics-svc.fullname" . }}
  labels:
    {{- include "analytics-svc.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "analytics-svc.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "analytics-svc.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "analytics-svc.serviceAccountName" . }}
      # Pod Security Restricted profile — 6 literal fields (matches auth-svc).
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: analytics-svc
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.env.OTEL_EXPORTER_OTLP_ENDPOINT | quote }}
            - name: HE_API_KAFKA_BROKERS
              value: {{ .Values.env.kafkaBrokers | quote }}
            - name: HE_API_OSS_GDPR_EXPORTS_BUCKET
              value: {{ .Values.env.ossGdprExportsBucket | quote }}
          envFrom:
            # Story 1.6 — shared DB creds (PG/Redis URIs). ClickHouse DSN is an
            # out-of-band downstream prerequisite (BR8.4), not wired here.
            - secretRef:
                name: {{ .Values.db.credsSecretName }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.httpGet.path }}
              port: {{ .Values.probes.readiness.httpGet.port }}
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.httpGet.path }}
              port: {{ .Values.probes.liveness.httpGet.port }}
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
