# api-gateway default values.
#
# Per-env overrides (e.g., values-staging.yaml) MUST be minimal — only override
# fields whose default would silently regress a security baseline if changed
# (e.g., networkPolicy.enabled). See Architect Round 1 Q1 ruling.

# -----------------------------------------------------------------------------
# Container image
# -----------------------------------------------------------------------------
image:
  repository: he-api/api-gateway
  tag: "0.1.0"
  pullPolicy: IfNotPresent

# -----------------------------------------------------------------------------
# Replica count — Deployment.spec.replicas
# -----------------------------------------------------------------------------
replicaCount: 1

# -----------------------------------------------------------------------------
# Service — ClusterIP by default; Story 1.4 ingress-nginx fronts public traffic
# -----------------------------------------------------------------------------
service:
  type: ClusterIP
  port: 8080

# -----------------------------------------------------------------------------
# Resource requests / limits — tuned for the staging 3× ecs.c7.large pool
# -----------------------------------------------------------------------------
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

# -----------------------------------------------------------------------------
# Probes — /healthz is kept as a Story 1.5 historical alias; /health is the
# canonical path per Story 3.1 (2026-05-18). Both resolve to the same
# handler (apps/api-gateway/internal/handlers/health.go); the gateway
# registers /health and /healthz on a sibling probeMux that bypasses the
# SecurityHeaders + CSRF chain (BR-1.3).
# -----------------------------------------------------------------------------
probes:
  readiness:
    httpGet:
      path: /healthz
      port: 8080
    initialDelaySeconds: 5
    periodSeconds: 10
  liveness:
    httpGet:
      path: /healthz
      port: 8080
    initialDelaySeconds: 15
    periodSeconds: 20

# -----------------------------------------------------------------------------
# Ingress — disabled by default; enabled per env in Story 1.4
# -----------------------------------------------------------------------------
ingress:
  enabled: false
  className: ""
  hosts: []
  tls: []

# -----------------------------------------------------------------------------
# NetworkPolicy — DEFAULT-DENY ingress + allow-from ingress-nginx ns
# (env overrides MUST keep this `true` to preserve the staging security baseline)
# -----------------------------------------------------------------------------
networkPolicy:
  enabled: true

# -----------------------------------------------------------------------------
# ServiceAccount — created per release; empty `name` triggers the default
# `_helpers.tpl` naming (chart fullname)
# -----------------------------------------------------------------------------
serviceAccount:
  create: true
  name: ""
  annotations: {}

# -----------------------------------------------------------------------------
# Pod scheduling (placeholders — Story 1.5+ refines)
# -----------------------------------------------------------------------------
nodeSelector: {}
tolerations: []
affinity: {}

# -----------------------------------------------------------------------------
# Autoscaling (HPA) — disabled until Story 1.4 brings metrics-server online
# -----------------------------------------------------------------------------
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70

# -----------------------------------------------------------------------------
# Story 5.3 — Rate-limit free-tier ceilings (operator-tunable per env).
#
# Values are templated into container env vars
# `RATELIMIT_FREE_TIER_{QPS,RPM,TPM}_MAX` consumed at boot by
# apps/api-gateway/cmd/server/main.go. cmd/server HALTs if any value is
# outside [1, defensive_upper_bound] — protects against operator typos
# (e.g., qpsMax=0 would deny every authenticated request).
#
# Per-env overrides via values-staging.yaml / values-prod.yaml; operator
# runbook for rotation: `helm upgrade --set ratelimit.freeTierDefaults.qpsMax=50`
# OR `kubectl edit deployment/api-gateway` then `rollout restart`.
#
# Reference budget rationale (Story 5.3 BR-1.3 / BR-2.3 / BR-3.3):
#   qpsMax=10   matches Story-5.1 BR-1.10 key-CREATE anti-abuse cap
#   rpmMax=300  permits short bursts above 5/s up to 10/s for ≤30s
#   tpmMax=60K  generous for evaluation; well below Stripe / OpenAI free-tier
# -----------------------------------------------------------------------------
ratelimit:
  freeTierDefaults:
    qpsMax: 10
    rpmMax: 300
    tpmMax: 60000

# Story 6.2 — routing-svc Connect-RPC endpoint. EMPTY by design (back-compat):
# with no endpoint the gateway passes req.Model through (pre-6.2 behaviour, no
# routing-svc round-trip). Set per-env in values-{staging,prod}.yaml to the
# in-cluster routing-svc Service, e.g.
# "http://routing-svc.he-api-staging.svc.cluster.local:8080".
routing:
  endpoint: ""

# -----------------------------------------------------------------------------
# Story 5.2 (Q-E) — trusted-proxy CIDRs for the keypolicy XFF walker.
# Comma-separated CIDR lists surfaced to the pod as CLOUDFLARE_CIDRS +
# INGRESS_CIDRS via the api-gateway-trusted-proxies ConfigMap. EMPTY by design
# (failsafe-against-misconfig): with no CIDRs the walker ignores X-Forwarded-For
# and trusts only r.RemoteAddr, so a public-IP attacker cannot spoof XFF to
# satisfy an IP whitelist. Operators set per-env in values-{staging,prod}.yaml
# (CLOUDFLARE_CIDRS from https://www.cloudflare.com/ips/, INGRESS_CIDRS from the
# cluster network plan). A ConfigMap edit needs a `kubectl rollout restart
# deployment/api-gateway` — the env snapshot is read at process init.
# -----------------------------------------------------------------------------
trustedProxies:
  cloudflareCidrs: ""
  ingressCidrs: ""

# -----------------------------------------------------------------------------
# Story 1.6 — shared DB credentials Secret (he-api-db-creds). Projects
# HE_API_DB_POSTGRES_URI into pods via envFrom. Consumed by the Story-8.5
# safety-log-retention CronJob (same Secret the auth-svc cron uses).
# -----------------------------------------------------------------------------
db:
  credsSecretName: he-api-db-creds

# -----------------------------------------------------------------------------
# Story 8.5 AC2 — §9.3 治理日志 "保留 6 个月" retention CronJob. Deletes
# he_api.content_safety_logs rows older than 6 months (strict `<` cutoff,
# idempotent, index-backed). Mirrors the auth-svc monthly-cost-reset posture:
# concurrencyPolicy: Forbid + backoffLimit: 0 → one cron, one outcome,
# human-verified on failure (security-sensitive-cron). K8s 5-field schedule +
# `.spec.timeZone` (Architect Medium fix — NOT a 6-field "... UTC" string).
# Scheduled day-1 03:00 UTC, AFTER monthly-cost-reset (00:00) + monthly-invoice.
# -----------------------------------------------------------------------------
safetyLogRetention:
  enabled: true
  schedule: "0 3 1 * *"        # 03:00 UTC on day 1 of each month (5-field)
  timeZone: "Etc/UTC"          # K8s 1.27+ CronJob TimeZone
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 200
  backoffLimit: 0              # no auto-retry; on-call investigates
  activeDeadlineSeconds: 330   # > the binary's 5-min ctx deadline
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  image:
    repository: he-api/safety-log-retention
    tag: "0.0.1"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

# -----------------------------------------------------------------------------
# AD-002 — 模型目录发现任务(specs/model-catalogue-arch.md)。每天拉一次上游可用
# 模型清单:新 id 落 status='pending'(不可见、不可计费,等人工补定价与能力),
# 上游消失的 id 标 deprecated。永不删行、永不自动上架。
#
# 默认 enabled: false —— 它需要一个上游密钥 Secret,而适配器那份在
# he-api-adapters 命名空间里,Secret 跨命名空间引用不可行。运营需先在网关所在
# 命名空间创建同名 Secret 再打开:
#
#   kubectl -n he-api-staging create secret generic models-sync-upstream-api-key \
#     --from-literal=api_key='<百炼密钥>'
#
# 打开前可先用 dryRun: true 跑一次,只打印上游清单不写库。
# -----------------------------------------------------------------------------
modelsSync:
  enabled: false
  schedule: "0 4 * * *"        # 04:00 UTC 每天(错开 03:00 的 retention cron)
  timeZone: "Etc/UTC"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 200
  backoffLimit: 0              # 会改目录状态,失败由人看日志,不盲目重试
  activeDeadlineSeconds: 150   # > the binary's 2-min ctx deadline
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  # 百炼兼容端点一个密钥即可覆盖 Qwen / DeepSeek / GLM / Kimi 多厂商。
  upstreamURL: "https://dashscope.aliyuncs.com/compatible-mode/v1/models"
  vendor: "alibaba"            # 新发现行的默认 vendor,人工上架时按实际厂商修正
  dryRun: false
  apiKeySecret:
    name: models-sync-upstream-api-key
    key: api_key
  image:
    repository: he-api/models-sync
    tag: "0.0.1"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

# -----------------------------------------------------------------------------
# Pod Security — K8s 1.29 Pod Security "Restricted" profile baseline.
# Every field below MUST be present for ACK PSA enforcement to accept the pod.
# -----------------------------------------------------------------------------
securityContext:
  runAsNonRoot: true
  runAsUser: 65532
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
  seccompProfile:
    type: RuntimeDefault

# -----------------------------------------------------------------------------
# Story 10.7 AC1 (OQ-10.7-5) — gateway RED alert rules (§11.3). Thresholds are
# quoted strings so the Helm template renders them verbatim into PromQL. The
# rules' severity/channel labels feed the Alertmanager route (critical →
# PagerDuty + 飞书 mirror; warning·feishu → 飞书 + email).
# -----------------------------------------------------------------------------
prometheusRule:
  enabled: true
  p95LatencySecondsThreshold: "0.5"
  errorRateThreshold: "0.01"
  upstreamErrorRateThreshold: "0.1"
  overseasEgressBytesThreshold: "0"

# Stories 4.1-4.6 — 厂商适配器 Connect-RPC 端点(internal/adapterclient/registry.go)。
# 键名大写后即 <VENDOR>_ADAPTER_ENDPOINT。空值 = 不注入该 env = 该厂商模型回落到
# Story-3.3 的 **mock 假回复**;要真正调通上游,必须同时:
#   ① 这里配好端点(适配器在 he-api-adapters 命名空间,用全限定 Service DNS)
#   ② 给对应适配器的 Secret adapter-<vendor>-upstream-api-key 填真实上游 key
adapters:
  deepseek: http://adapter-deepseek.he-api-adapters.svc.cluster.local:8080
  qwen: http://adapter-qwen.he-api-adapters.svc.cluster.local:8080
  kimi: http://adapter-kimi.he-api-adapters.svc.cluster.local:8080
  glm: http://adapter-glm.he-api-adapters.svc.cluster.local:8080
  doubao: http://adapter-doubao.he-api-adapters.svc.cluster.local:8080
  ernie: http://adapter-ernie.he-api-adapters.svc.cluster.local:8080

# 追加"模型 id → 厂商"路由,免发版即可上架新模型(internal/adapterclient
# ExtraModelRoutesEnv)。格式 "modelID=vendor,..." ,vendor ∈ deepseek|qwen|kimi|
# glm|doubao|ernie。
#
# 背景:2026-07 实测发现内置模型表已全面过时 —— 上游早已把 qwen-max/deepseek-v3/
# glm-4 等下线,线上调用一律 403 Model.AccessDenied。下列 id 取自百炼
# /compatible-mode/v1/models 的真实清单。长期方案是模型目录改数据库驱动 + 自动同步。
#
# 注:阿里云百炼一个入口即可直连多厂商模型(DeepSeek V4 / GLM / Kimi / MiniMax),
# 故这些 id 都路由到 qwen 适配器(它指向 dashscope 兼容端点)。
extraModelRoutes: "qwen3.7-max=qwen,qwen3.7-plus=qwen,qwen3.6-flash=qwen,deepseek-v4-pro=qwen,deepseek-v4-flash=qwen,glm-5.2=qwen,kimi-k2.6=qwen,qwen3.6-plus=qwen,qwen3.6-max-preview=qwen,glm-5.2-fast-preview=qwen,kimi-k2.7-code=qwen"
