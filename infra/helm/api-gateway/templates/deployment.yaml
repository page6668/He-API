apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "api-gateway.fullname" . }}
  labels:
    {{- include "api-gateway.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "api-gateway.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "api-gateway.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "api-gateway.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: {{ .Values.securityContext.runAsNonRoot }}
        runAsUser: {{ .Values.securityContext.runAsUser }}
        seccompProfile:
          type: {{ .Values.securityContext.seccompProfile.type }}
      containers:
        - name: api-gateway
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            # Story 5.3 — rate-limit free-tier ceilings (operator-tunable
            # per env via values-{staging,prod}.yaml). cmd/server validates
            # range [1, defensive_upper_bound] and HALTs on misconfig.
            - name: RATELIMIT_FREE_TIER_QPS_MAX
              value: {{ .Values.ratelimit.freeTierDefaults.qpsMax | quote }}
            - name: RATELIMIT_FREE_TIER_RPM_MAX
              value: {{ .Values.ratelimit.freeTierDefaults.rpmMax | quote }}
            - name: RATELIMIT_FREE_TIER_TPM_MAX
              value: {{ .Values.ratelimit.freeTierDefaults.tpmMax | quote }}
            {{- if .Values.routing.endpoint }}
            # Story 6.2 — routing-svc Connect-RPC endpoint. Set → the gateway
            # consults routing-svc on every chat request (he-router-* + the
            # X-He-Routing-Strategy header resolve to a real selection). Unset
            # → the gateway passes req.Model through (pre-6.2 behaviour).
            - name: ROUTING_SVC_ENDPOINT
              value: {{ .Values.routing.endpoint | quote }}
            {{- end }}
          envFrom:
            # Story 5.2 (Q-E) — trusted-proxy CIDRs for the keypolicy XFF
            # walker (CLOUDFLARE_CIDRS + INGRESS_CIDRS). Snapshot read at
            # process init; ConfigMap edit needs a rollout restart.
            - configMapRef:
                name: api-gateway-trusted-proxies
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.httpGet.path }}
              port: {{ .Values.probes.readiness.httpGet.port }}
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.httpGet.path }}
              port: {{ .Values.probes.liveness.httpGet.port }}
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            runAsNonRoot: {{ .Values.securityContext.runAsNonRoot }}
            runAsUser: {{ .Values.securityContext.runAsUser }}
            readOnlyRootFilesystem: {{ .Values.securityContext.readOnlyRootFilesystem }}
            allowPrivilegeEscalation: {{ .Values.securityContext.allowPrivilegeEscalation }}
            capabilities:
              drop:
                {{- toYaml .Values.securityContext.capabilities.drop | nindent 16 }}
            seccompProfile:
              type: {{ .Values.securityContext.seccompProfile.type }}
          volumeMounts:
            # JWT public key — the gateway verifies access tokens signed by
            # auth-svc's private key. Projected read-only from the shared
            # he-api-auth-jwt-keys Secret (public_key.pem only).
            - name: jwt-public-key
              mountPath: /etc/api-gateway/keys
              readOnly: true
      volumes:
        - name: jwt-public-key
          secret:
            secretName: he-api-auth-jwt-keys
            items:
              - key: public_key.pem
                path: public_key.pem
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
