# sample-otel-app staging overrides — Story 1.4 (B4 standardised by Story 1.7).
#
# `${ACR_REGISTRY}` is the unified deploy-time substitution token (T0.3). The tag
# is the chart appVersion (semver) — NOT `latest`: Story 1.7 BR4.1 bans moving
# tags in ANY values*.yaml repo-wide (the sample is excluded from the "17" deploy
# set but still subject to the immutable-tag grep gate, 1.7-UNIT-030/080).
image:
  repository: ${ACR_REGISTRY}/he-api/sample-otel-app
  tag: "0.1.0"
  pullPolicy: IfNotPresent

replicaCount: 1

service:
  type: ClusterIP
  port: 8080

env:
  # Wire the SDK to the OTel Collector deployed in the `monitoring` namespace
  # (see infra/helm/observability/otel-collector/values-staging.yaml).
  OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector.monitoring.svc.cluster.local:4317

serviceAccount:
  create: true
  name: ""

serviceMonitor:
  enabled: true
  interval: 15s
