{{- if .Values.serviceMonitor.enabled -}}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "sample-otel-app.fullname" . }}
  labels:
    {{- include "sample-otel-app.labels" . | nindent 4 }}
    # Match the kube-prometheus-stack Prometheus serviceMonitorSelector
    # (release label) so this monitor is picked up regardless of namespace.
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      {{- include "sample-otel-app.selectorLabels" . | nindent 6 }}
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      targetPort: 8080
{{- end -}}
