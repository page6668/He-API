# Story 4.3 — Kimi (Moonshot) adapter Helm values.
#
# Architect Round 1 (Story 4.3) rulings encoded:
#   OQ-4.3-1 — Moonshot OpenAI-compatible endpoint
#              (https://api.moonshot.cn — request path is
#              `/v1/chat/completions`; the adapter appends the path).
#   OQ-4.3-2 — Env-var naming follows the adapter service BRAND
#              (KIMI_*) NOT the model-id prefix (moonshot-v1-*).
#   OQ-4.3-3 — HTTP/2-preferred + ALPN HTTP/1.1 fallback cascade-default
#              from Story-4.2 OQ-4.2-5 (in code; no values knob).
#   OQ-4.3-4 — Context-window-exceeded handling: slog disambiguation
#              only (BR-4.5); no pre-validation; distinct envelope code
#              deferred to Story 4.7 capability matrix.
#   OQ-4.3-5 — N=3 per-vendor `assert.Same` chain (in tests; no values knob).
#
# Inherited from Story 4.1:
#   OQ3 — Vault path: kv/data/he-api/upstream/kimi/
#   M4  — Namespace `he-api-adapters` shared across all six adapters.
#   M5  — Cold-start budget ≤ 2s (readiness-probe gated).

replicaCount: 2

image:
  repository: ghcr.io/he-api/adapter-kimi
  tag: 0.1.0
  pullPolicy: IfNotPresent

namespace: he-api-adapters

# BR-1.10 — three bound model ids hosted by this single Deployment.
# Grafana per-model breakdown can group-by the `model` slog attribute.
supportedModels:
  - moonshot-v1-8k
  - moonshot-v1-32k
  - moonshot-v1-128k

service:
  type: ClusterIP
  port: 8080
  # Connect-RPC over h2c on the in-VPC hop; mTLS hardening lands in Epic 9.
  appProtocol: h2c

upstream:
  # KIMI_UPSTREAM_BASE_URL — overridable per environment. The adapter
  # appends /v1/chat/completions per OQ-4.3-1.
  baseUrl: "https://api.moonshot.cn"
  # KIMI_UPSTREAM_TIMEOUT_SECONDS — BR-1.8 default 60s.
  timeoutSeconds: 60

externalSecret:
  # External Secrets Operator reference. The actual Vault sync infra is
  # provisioned in Epic 9; this manifest declares the contract.
  enabled: true
  secretStoreRef:
    name: he-api-vault
    kind: ClusterSecretStore
  # Story-4.1 OQ3 cascade — kv/data/he-api/upstream/kimi/
  vaultPath: "kv/data/he-api/upstream/kimi"
  remoteKey: "api_key"

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

probes:
  liveness:
    path: /healthz
    initialDelaySeconds: 5
    periodSeconds: 10
  readiness:
    path: /healthz
    # M5 — adapter cold-start budget ≤ 2s; probe takes a few periods.
    initialDelaySeconds: 2
    periodSeconds: 5

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  fsGroup: 65532

securityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
