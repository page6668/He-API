apiVersion: v1
kind: Service
metadata:
  name: adapter-kimi
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: adapter-kimi
    app.kubernetes.io/part-of: he-api
spec:
  type: {{ .Values.service.type }}
  selector:
    app.kubernetes.io/name: adapter-kimi
  ports:
    - name: connect
      port: {{ .Values.service.port }}
      targetPort: connect
      protocol: TCP
      # h2c on the in-VPC hop per Story-4.1 OQ2 ruling.
      appProtocol: {{ .Values.service.appProtocol }}
