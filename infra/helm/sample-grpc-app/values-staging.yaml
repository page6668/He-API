# sample-grpc-app staging overrides (scaffolded by scripts/scaffold-svc.sh, Story 1.5;
# B4 standardised by Story 1.7). `he-api-registry.cn-hongkong.cr.aliyuncs.com` is the unified deploy-time
# substitution token (T0.3) — the old double-dollar scaffold variant is gone
# (1.7-UNIT-031 no split). tag is the chart appVersion (semver), NOT `latest`
# (BR4.1 immutable-tag grep gate applies to every values*.yaml, 1.7-UNIT-030).
image:
  repository: he-api-registry.cn-hongkong.cr.aliyuncs.com/he-api/sample-grpc-app
  tag: "0.0.1"
  pullPolicy: IfNotPresent

replicaCount: 1

service:
  type: ClusterIP
  port: 8080

env:
  OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector.monitoring.svc.cluster.local:4317

serviceAccount:
  create: true
  name: ""

serviceMonitor:
  enabled: true
  interval: 15s
