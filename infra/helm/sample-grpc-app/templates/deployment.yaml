apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sample-grpc-app.fullname" . }}
  labels:
    {{- include "sample-grpc-app.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "sample-grpc-app.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "sample-grpc-app.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "sample-grpc-app.serviceAccountName" . }}
      # Pod Security Restricted profile — 6 fields literal so the
      # 1.4-UNIT-221 / 1.5-UNIT-12{4..9} static regex checks can verify
      # without expanding any Helm template expressions (Q7 ruling).
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sample-grpc-app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.env.OTEL_EXPORTER_OTLP_ENDPOINT | quote }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          # Container-level Pod Security Restricted full 6 fields (literal).
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
