apiVersion: v1
kind: Service
metadata:
  name: {{ include "sample-grpc-app.fullname" . }}
  labels:
    {{- include "sample-grpc-app.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
  selector:
    {{- include "sample-grpc-app.selectorLabels" . | nindent 4 }}
