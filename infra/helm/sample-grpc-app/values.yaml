# Default values for sample-grpc-app (scaffolded by scripts/scaffold-svc.sh, Story 1.5).
# Values mirror infra/helm/sample-otel-app/ baseline (Story 1.4) so Pod Security
# Restricted admission stays uniform across all 14+ services.

image:
  repository: he-api/sample-grpc-app
  tag: "0.0.1"
  pullPolicy: IfNotPresent

replicaCount: 1

service:
  type: ClusterIP
  port: 8080

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

env:
  OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector.monitoring.svc.cluster.local:4317

serviceAccount:
  create: true
  name: ""
  annotations: {}

serviceMonitor:
  enabled: true
  interval: 15s

nodeSelector: {}
tolerations: []
affinity: {}
