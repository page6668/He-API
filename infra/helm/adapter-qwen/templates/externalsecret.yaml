{{- if .Values.externalSecret.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: adapter-qwen-upstream-api-key
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: adapter-qwen
    app.kubernetes.io/part-of: he-api
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.externalSecret.secretStoreRef.name }}
    kind: {{ .Values.externalSecret.secretStoreRef.kind }}
  target:
    name: adapter-qwen-upstream-api-key
    creationPolicy: Owner
  data:
    - secretKey: api_key
      remoteRef:
        # Architect Round 1 OQ3 ratification (Story 4.1) — Story 4.2
        # inherits: kv/data/he-api/upstream/qwen/, key `api_key`.
        # Operator-managed (DashScope does NOT support API-key
        # auto-rotation; same operational posture as DeepSeek).
        key: {{ .Values.externalSecret.vaultPath }}
        property: {{ .Values.externalSecret.remoteKey }}
{{- end }}
