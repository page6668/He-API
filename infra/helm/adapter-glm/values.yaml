# Story 4.4 — GLM (Zhipu) adapter Helm values.
#
# Architect Round 1 (Story 4.4) rulings encoded:
#   OQ-4.4-1 — Zhipu v4 OpenAI-compatible endpoint
#              (https://open.bigmodel.cn — request path is
#              `/api/paas/v4/chat/completions`; the adapter appends the
#              path). Plain `Authorization: Bearer` auth at v4 (NOT
#              JWT-signed legacy scheme).
#   OQ-4.4-2 — Env-var naming follows the adapter service BRAND
#              (GLM_*) per Story-4.2 OQ-4.2-6 cascade text (brand wins
#              over company name zhipu).
#   OQ-4.4-3 — Identity-mapping translate.go (Zhipu v4 OpenAI drop-in;
#              in code, no values knob).
#   OQ-4.4-4 — HTTP/2-preferred + ALPN HTTP/1.1 fallback cascade-default
#              from Story-4.2 OQ-4.2-5 (in code; no values knob).
#   OQ-4.4-5 — stream_options.include_usage=true honoured (in code; no
#              values knob).
#   OQ-4.4-6 — Verbatim REUSE of Story-4.2 BR-4.4 + Story-4.1 BR-1.4
#              upstream-error mapping (no Zhipu-specific carve-outs).
#
# Inherited from Story 4.1:
#   OQ3 — Vault path: kv/data/he-api/upstream/glm/
#   M4  — Namespace `he-api-adapters` shared across all six adapters.
#   M5  — Cold-start budget ≤ 2s (readiness-probe gated).

replicaCount: 1

image:
  repository: ghcr.io/he-api/adapter-glm
  tag: 0.1.0
  pullPolicy: IfNotPresent

namespace: he-api-adapters

# BR-1.10 N=1 — single bound model id hosted by this Deployment.
# Grafana per-model breakdown can group-by the `model` slog attribute.
supportedModels:
  - glm-4

service:
  type: ClusterIP
  port: 8080
  # Connect-RPC over h2c on the in-VPC hop; mTLS hardening lands in Epic 9.
  appProtocol: h2c

upstream:
  # GLM_UPSTREAM_BASE_URL — overridable per environment. The adapter
  # appends /api/paas/v4/chat/completions per OQ-4.4-1.
  baseUrl: "https://open.bigmodel.cn"
  # GLM_UPSTREAM_TIMEOUT_SECONDS — BR-1.8 default 60s.
  timeoutSeconds: 60

externalSecret:
  # External Secrets Operator reference. The actual Vault sync infra is
  # provisioned in Epic 9; this manifest declares the contract.
  enabled: true
  secretStoreRef:
    name: he-api-vault
    kind: ClusterSecretStore
  # Story-4.1 OQ3 cascade — kv/data/he-api/upstream/glm/
  vaultPath: "kv/data/he-api/upstream/glm"
  remoteKey: "api_key"

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

probes:
  liveness:
    path: /healthz
    initialDelaySeconds: 5
    periodSeconds: 10
  readiness:
    path: /healthz
    # M5 — adapter cold-start budget ≤ 2s; probe takes a few periods.
    initialDelaySeconds: 2
    periodSeconds: 5

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  fsGroup: 65532

securityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
