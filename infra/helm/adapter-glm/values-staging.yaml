# adapter-glm staging overrides (Story 1.7 B3/B4). Unified ${ACR_REGISTRY}
# deploy-time token (T0.3); image.tag SHA-bumped by deploy-staging (BR4.1; never
# `latest`). Other knobs inherit from values.yaml (he-api-adapters namespace,
# replicaCount, supportedModels, externalSecret).
image:
  repository: ${ACR_REGISTRY}/he-api/adapter-glm
  tag: "04d812c2ad166ff70dfa204ab8a27dd999fb3c2f"
  pullPolicy: IfNotPresent
# staging: ESO/Vault 延后(Epic 9)→ 手建 K8s Secret adapter-glm-upstream-api-key
# (docs/runbooks/staging-secrets-hongkong-minimal.md)。关掉 ExternalSecret,避免 ESO
# 未装时 ArgoCD 因缺 external-secrets.io CRD 同步失败。base values.yaml 的 true 保留给 Epic 9。
externalSecret:
  enabled: false
