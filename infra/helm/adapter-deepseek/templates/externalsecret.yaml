{{- if .Values.externalSecret.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: adapter-deepseek-upstream-api-key
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: adapter-deepseek
    app.kubernetes.io/part-of: he-api
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.externalSecret.secretStoreRef.name }}
    kind: {{ .Values.externalSecret.secretStoreRef.kind }}
  target:
    name: adapter-deepseek-upstream-api-key
    creationPolicy: Owner
  data:
    - secretKey: api_key
      remoteRef:
        # OQ3 ruling — kv/data/he-api/upstream/deepseek/, key `api_key`.
        # Operator-managed (DeepSeek does NOT support API-key auto-rotation;
        # Vault dynamic-secret is N/A).
        key: {{ .Values.externalSecret.vaultPath }}
        property: {{ .Values.externalSecret.remoteKey }}
{{- end }}
