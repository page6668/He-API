apiVersion: v1
kind: Service
metadata:
  name: adapter-deepseek
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: adapter-deepseek
    app.kubernetes.io/part-of: he-api
spec:
  type: {{ .Values.service.type }}
  selector:
    app.kubernetes.io/name: adapter-deepseek
  ports:
    - name: connect
      port: {{ .Values.service.port }}
      targetPort: connect
      protocol: TCP
      # h2c on the in-VPC hop per OQ2 ruling (Connect-RPC over HTTP/2
      # cleartext); the gateway-side adapterclient uses the same wire.
      appProtocol: {{ .Values.service.appProtocol }}
