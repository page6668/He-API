# notification-svc staging overrides (Story 2.2; B4 standardised by Story 1.7).
# `${ACR_REGISTRY}` is the unified deploy-time substitution token (T0.3);
# image.tag is SHA-bumped by deploy-staging (BR4.1; NEVER `latest`).
image:
  repository: ${ACR_REGISTRY}/he-api/notification-svc
  tag: "6e211035dd2a1e406acc8ef373d42304e09bbbdb"
  pullPolicy: IfNotPresent
replicaCount: 1
service:
  type: ClusterIP
  port: 8080
env:
  OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector.monitoring.svc.cluster.local:4317
serviceAccount:
  create: true
  name: ""
serviceMonitor:
  enabled: true
  interval: 15s
