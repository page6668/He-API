# notification-svc staging overrides (Story 2.2).
image:
  repository: $$ACR_REGISTRY/he-api/notification-svc
  tag: latest
  pullPolicy: IfNotPresent

replicaCount: 1

service:
  type: ClusterIP
  port: 8080

env:
  OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector.monitoring.svc.cluster.local:4317

serviceAccount:
  create: true
  name: ""

serviceMonitor:
  enabled: true
  interval: 15s
