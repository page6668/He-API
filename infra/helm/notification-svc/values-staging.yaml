# notification-svc staging overrides (Story 2.2; B4 standardised by Story 1.7).
# `he-api-registry.cn-hongkong.cr.aliyuncs.com` is the unified deploy-time substitution token (T0.3);
# image.tag is SHA-bumped by deploy-staging (BR4.1; NEVER `latest`).
image:
  repository: he-api-registry.cn-hongkong.cr.aliyuncs.com/he-api/notification-svc
  tag: "f5af7a5c0f3c62f8d5530029b78f87d9f66d2024"
  pullPolicy: IfNotPresent
replicaCount: 1
service:
  type: ClusterIP
  port: 8080
env:
  OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector.monitoring.svc.cluster.local:4317
serviceAccount:
  create: true
  name: ""
serviceMonitor:
  enabled: true
  interval: 15s
