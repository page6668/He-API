apiVersion: v1
kind: Service
metadata:
  name: {{ include "notification-svc.fullname" . }}
  labels:
    {{- include "notification-svc.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
  selector:
    {{- include "notification-svc.selectorLabels" . | nindent 4 }}
