# auth-svc staging overrides (Story 2.2; B4 standardised by Story 1.7).
# `he-api-registry.cn-hongkong.cr.aliyuncs.com` is the unified deploy-time substitution token (T0.3 —
# convention ②, wired in deploy-staging.yml). image.tag is SHA-bumped by
# deploy-staging's update-helm-values step (BR4.1 immutable-tag; NEVER `latest`).
image:
  repository: he-api-registry.cn-hongkong.cr.aliyuncs.com/he-api/auth-svc
  tag: "cd15d623f36cf2694af3fe8d5b3c7fc475f70e58"
  pullPolicy: IfNotPresent
replicaCount: 1
service:
  type: ClusterIP
  port: 8080
env:
  OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector.monitoring.svc.cluster.local:4317
# Story 1.7 B4 — the two auth-svc cron images are build-matrix entries, so their
# tags are SHA-bumped here too (tri-count closure, T8.1). The cron `schedule`
# literals live in values.yaml ONLY (H-2 / monthly-cost-reset gold-gate) and are
# NOT overridden here — only the image tags are staging-bumped.
monthlyCostReset:
  image:
    repository: he-api-registry.cn-hongkong.cr.aliyuncs.com/he-api/monthly-cost-reset
    tag: "cd15d623f36cf2694af3fe8d5b3c7fc475f70e58"
    pullPolicy: IfNotPresent
accountDeletionSweeper:
  image:
    repository: he-api-registry.cn-hongkong.cr.aliyuncs.com/he-api/account-deletion-sweeper
    tag: "cd15d623f36cf2694af3fe8d5b3c7fc475f70e58"
    pullPolicy: IfNotPresent
serviceAccount:
  create: true
  name: ""
serviceMonitor:
  enabled: true
  interval: 15s
