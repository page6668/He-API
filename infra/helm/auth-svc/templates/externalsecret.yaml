{{- if .Values.externalSecret.enabled }}
# Story 5.4 H-3 — Vault ExternalSecret projecting the auth-svc PG/Redis/Kafka
# credentials into a K8s Secret consumed (via envFrom) by BOTH the auth-svc
# Deployment and the monthly-cost-reset CronJob. Disabled by default; enabling
# requires the external-secrets operator + a ClusterSecretStore named per
# .Values.externalSecret.secretStoreRef.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.externalSecret.targetSecretName }}
  labels:
    {{- include "auth-svc.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecret.secretStoreRef.name }}
    kind: {{ .Values.externalSecret.secretStoreRef.kind }}
  target:
    name: {{ .Values.externalSecret.targetSecretName }}
    creationPolicy: Owner
  data:
    {{- range .Values.externalSecret.data }}
    - secretKey: {{ .secretKey }}
      remoteRef:
        key: {{ $.Values.externalSecret.vaultPath }}
        property: {{ .property }}
    {{- end }}
{{- end }}
