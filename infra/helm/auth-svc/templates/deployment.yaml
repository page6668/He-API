apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "auth-svc.fullname" . }}
  labels:
    {{- include "auth-svc.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "auth-svc.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "auth-svc.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "auth-svc.serviceAccountName" . }}
      # Pod Security Restricted profile — 6 fields literal so static regex
      # checks can verify without expanding Helm expressions (matches the
      # sample-grpc-app pattern from Story 1.5 Q7 ruling).
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: auth-svc
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.env.OTEL_EXPORTER_OTLP_ENDPOINT | quote }}
            # Story 2.2 P5c — audit Kafka publisher. Empty string falls
            # back to audit.NoOpPublisher (handled in cmd/server).
            - name: HE_API_AUDIT_KAFKA_BROKERS
              value: {{ .Values.audit.kafkaBrokers | quote }}
            - name: HE_API_NOTIFICATION_SVC_URL
              value: {{ .Values.audit.notificationSvcURL | quote }}
            - name: HE_API_CONSOLE_BASE_URL
              value: {{ .Values.audit.consoleBaseURL | quote }}
            # Story 2.3 — OAuth provider credentials (Wright Round 1 Q5).
            # Secret holds 4 client-credentials keys; ConfigMap holds the
            # non-secret OAUTH_REDIRECT_URI_BASE. auth-svc reads these at
            # startup; rotation = `kubectl rollout restart deploy/auth-svc`
            # after Terraform applies the new Secret.
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.oauth.secretName }}
                  key: GOOGLE_CLIENT_ID
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.oauth.secretName }}
                  key: GOOGLE_CLIENT_SECRET
            - name: GITHUB_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.oauth.secretName }}
                  key: GITHUB_CLIENT_ID
            - name: GITHUB_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.oauth.secretName }}
                  key: GITHUB_CLIENT_SECRET
            - name: OAUTH_REDIRECT_URI_BASE
              valueFrom:
                configMapKeyRef:
                  name: {{ .Values.oauth.configMapName }}
                  key: OAUTH_REDIRECT_URI_BASE
          envFrom:
            # Story 1.6 — PostgreSQL + Redis URIs (HE_API_DB_POSTGRES_URI,
            # HE_API_DB_REDIS_URI) are mounted from the shared Secret.
            - secretRef:
                name: {{ .Values.db.credsSecretName }}
          volumeMounts:
            # Story 2.2 — JWT signing key (TS-CONS-003). The Secret carries
            # the private + public PEMs; mount read-only.
            - name: jwt-keys
              mountPath: {{ .Values.jwt.mountPath }}
              readOnly: true
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: jwt-keys
          secret:
            secretName: {{ .Values.jwt.secretName }}
            items:
              - key: private_key.pem
                path: {{ .Values.jwt.privateKeyFile }}
              - key: public_key.pem
                path: {{ .Values.jwt.publicKeyFile }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
