# Default values for auth-svc (Story 2.2). Pod Security Restricted profile
# matches the sample-grpc-app baseline so admission stays uniform.

image:
  repository: he-api/auth-svc
  tag: "0.0.1"
  pullPolicy: IfNotPresent

replicaCount: 1

service:
  type: ClusterIP
  port: 8080

resources:
  requests:
    cpu: 100m
    memory: 96Mi
  limits:
    cpu: 500m
    memory: 256Mi

env:
  OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector.monitoring.svc.cluster.local:4317

# Story 2.2 P5c (T4.5) — Kafka audit publisher.
# Comma-separated broker host:port list; empty value falls back to
# audit.NoOpPublisher (dev / non-staging environments). Production +
# staging values files override this.
audit:
  kafkaBrokers: ""
  notificationSvcURL: "http://notification-svc:8080"
  consoleBaseURL: "https://console.he-api.com"

# Story 2.2 — JWT signing key Secret (mounted as files); auth-svc reads
# /etc/auth-svc/keys/private_key.pem at startup (TS-CONS-003).
jwt:
  secretName: he-api-auth-jwt-keys
  mountPath: /etc/auth-svc/keys
  privateKeyFile: private_key.pem
  publicKeyFile: public_key.pem

# Story 2.2 — DB creds reused from Story 1.6 he-api-db-creds Secret.
# auth-svc consumes HE_API_DB_POSTGRES_URI + HE_API_DB_REDIS_URI via envFrom.
db:
  credsSecretName: he-api-db-creds

# Story 2.3 — OAuth provider credentials (Wright Round 1 Q5 ruling).
# `secretName` holds the 4 client-credentials keys (Google + GitHub IDs +
# secrets); `configMapName` holds the non-secret OAUTH_REDIRECT_URI_BASE.
# Both are provisioned by the `oauth-credentials` Terraform module.
oauth:
  secretName: he-api-oauth-credentials
  configMapName: he-api-oauth-config

serviceAccount:
  create: true
  name: ""
  annotations: {}

serviceMonitor:
  enabled: true
  interval: 15s

# Story 2.2 P5d (T4.7) — Alertmanager rules per BR-4.9.
prometheusRule:
  enabled: true
  # 5-min sums above these thresholds trigger the BR-4.9 alerts.
  signinFailureThreshold: 100
  accountLockedThreshold: 10
  # Story 2.3 BR-4.8 OAuth alert thresholds.
  oauthSubjectMismatchThreshold: 5
  oauthBypassedLockThreshold: 3

# Story 2.2 P5d (INT-067) — NetworkPolicy.
# Default-deny ingress+egress; explicit allow lists below.
# In production, populate the *CIDRs lists with the managed-service VPC
# CIDR blocks (RDS / Tair / Kafka). Empty CIDRs default to 0.0.0.0/0
# which is permissive — operator MUST tighten before prod cutover.
networkPolicy:
  enabled: true
  monitoringNamespace: monitoring
  postgresCIDRs: []
  postgresPort: 5432
  redisCIDRs: []
  redisPort: 6379
  kafkaCIDRs: []
  kafkaPort: 9092
  # Story 2.3 (T0.4) — OAuth provider egress to accounts.google.com /
  # oauth2.googleapis.com / github.com / api.github.com on port 443.
  # FQDN matching is operator-tightenable via providerCIDRs; the default
  # empty list lands as 0.0.0.0/0 + port 443, matching the off-cluster
  # ipBlock pattern Story 2.2 already uses for PG / Redis / Kafka.
  providerCIDRs: []
  providerEgressPort: 443

nodeSelector: {}
tolerations: []
affinity: {}

# Story 5.4 AC3 — monthly cost-reset CronJob. Resets api_keys.current_month_cost_usd
# + purges the Redis cap-state key families at the UTC month boundary.
# The schedule string is a CI single-source-of-truth (scripts/ci/verify-cron-schedule.sh
# greps the literal "0 0 1 * *"); changing it requires updating that gate.
monthlyCostReset:
  enabled: true
  schedule: "0 0 1 * *"        # 00:00 UTC on day 1 of each month (BR-3.1)
  timeZone: "Etc/UTC"          # K8s 1.27+ CronJob TimeZone (TC-7)
  concurrencyPolicy: Forbid    # BR-3.2
  startingDeadlineSeconds: 200 # BR-3.3
  backoffLimit: 0              # BR-3.4 (no auto-retry; on-call investigates)
  successfulJobsHistoryLimit: 3 # L-1
  failedJobsHistoryLimit: 3     # L-1
  image:
    repository: he-api/monthly-cost-reset
    tag: "0.0.1"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

# Story 2.7 AC6 — account-deletion sweeper CronJob. Physical-erasure pass after
# the 30-day grace. Same security-sensitive-cron posture as monthly-cost-reset
# (Forbid / backoffLimit 0 / human-verified on failure).
accountDeletionSweeper:
  enabled: true
  schedule: "0 2 * * *"        # 02:00 UTC daily (AC6 BR-6.1)
  timeZone: "Etc/UTC"          # K8s 1.27+ CronJob TimeZone
  concurrencyPolicy: Forbid    # BLIND-CONCURRENCY-003 — no overlapping sweeps
  startingDeadlineSeconds: 200
  backoffLimit: 0              # no auto-retry; failures reconcile next run / on-call
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  notificationSvcURL: ""       # completion email (best-effort; empty → skip)
  image:
    repository: he-api/account-deletion-sweeper
    tag: "0.0.1"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

# Story 5.4 H-3 — Vault ExternalSecret. When enabled, projects the auth-svc
# PG/Redis/Kafka credentials from Vault into a K8s Secret (auth-svc-vault-secret)
# that BOTH the Deployment + the monthly-cost-reset CronJob consume via envFrom.
# Disabled by default so clusters without the external-secrets operator keep
# using the Story-1.6 he-api-db-creds Secret (db.credsSecretName) unchanged.
externalSecret:
  enabled: false
  targetSecretName: auth-svc-vault-secret
  refreshInterval: 1h
  secretStoreRef:
    name: he-api-vault
    kind: ClusterSecretStore
  # Vault KV path → env-var key mappings. Tighten to the real Vault layout
  # before enabling in a cluster.
  vaultPath: "kv/data/he-api/auth-svc"
  data:
    - secretKey: HE_API_DB_POSTGRES_URI
      property: postgres_uri
    - secretKey: HE_API_DB_REDIS_URI
      property: redis_uri
    - secretKey: HE_API_AUDIT_KAFKA_BROKERS
      property: kafka_brokers
