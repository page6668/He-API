{{- if .Values.image }}
# Story 1.7 B6 — Service fronting the billing-svc main-service Deployment.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "billing-svc.fullname" . }}
  labels:
    {{- include "billing-svc.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type | default "ClusterIP" }}
  ports:
    - name: http
      port: {{ .Values.service.port | default 8080 }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "billing-svc.selectorLabels" . | nindent 4 }}
{{- end }}
