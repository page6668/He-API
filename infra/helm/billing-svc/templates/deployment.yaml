{{- if .Values.image }}
# Story 1.7 B6 — billing-svc main-service Deployment. SEPARATE workload from the
# fx-refresh CronJob (cronjob-fx-refresh.yaml); they share this chart's values +
# ServiceAccount but render from distinct templates (BLIND-DATA-003). Pod
# Security Restricted profile (6 literal fields) mirrors auth-svc (BR6.2).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "billing-svc.fullname" . }}
  labels:
    {{- include "billing-svc.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount | default 1 }}
  selector:
    matchLabels:
      {{- include "billing-svc.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "billing-svc.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "billing-svc.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: billing-svc
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port | default 8080 }}
              protocol: TCP
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.env.OTEL_EXPORTER_OTLP_ENDPOINT | quote }}
          envFrom:
            # Story 1.6 — PostgreSQL URI (HE_API_DB_POSTGRES_URI) + Redis from
            # the shared Secret; consumed for the pricing snapshot + ledger.
            - secretRef:
                name: {{ .Values.db.credsSecretName }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.httpGet.path }}
              port: {{ .Values.probes.readiness.httpGet.port }}
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.httpGet.path }}
              port: {{ .Values.probes.liveness.httpGet.port }}
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
