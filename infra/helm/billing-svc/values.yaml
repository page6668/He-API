# Default values for billing-svc. Ships BOTH the Story-7.2 fx-refresh CronJob
# AND (Story 1.7 B6) the billing-svc main-service Deployment. The two are
# SEPARATE workloads that share this values file but render from distinct
# templates (deployment.yaml vs cronjob-fx-refresh.yaml) — the fx-refresh cron
# `schedule` literal is the H-2 gold-gate (verify-cron-schedule.sh) and is NOT
# touched by the Deployment block.

env:
  OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector.monitoring.svc.cluster.local:4317

# DB creds reused from Story 1.6 he-api-db-creds Secret.
# billing-svc consumes HE_API_DB_POSTGRES_URI via envFrom.
db:
  credsSecretName: he-api-db-creds

# Story 1.7 B6 — billing-svc main-service Deployment image. Distinct from the
# fx-refresh cron image (fxRefresh.image); the Deployment binary is built from
# apps/billing-svc/cmd/server (he-api/billing-svc). values.yaml keeps the
# semver appVersion tag; values-staging.yaml SHA-bumps it (BR4.4).
image:
  repository: he-api/billing-svc
  tag: "0.0.1"
  pullPolicy: IfNotPresent

replicaCount: 1

service:
  type: ClusterIP
  port: 8080

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

# billing-svc server health endpoints (apps/billing-svc/internal/server):
# /livez (liveness) + /ready (readiness gates traffic until the pricing
# snapshot is loaded + the HTTP listener is up). /metrics is scraped via the
# shared observability middleware.
probes:
  readiness:
    httpGet:
      path: /ready
      port: 8080
    initialDelaySeconds: 5
    periodSeconds: 10
  liveness:
    httpGet:
      path: /livez
      port: 8080
    initialDelaySeconds: 15
    periodSeconds: 20

serviceAccount:
  create: true
  name: ""
  annotations: {}

# Story 7.2 AC2 — fx-refresh CronJob. Appends a he_api.fx_rates USD→CNY row at
# the UTC day boundary. The schedule string is a CI single-source-of-truth
# (scripts/ci/verify-cron-schedule.sh locks the literal "0 0 * * *"); changing
# it requires updating that gate (H-2 — money-adjacent schedule-drift gold-gate).
fxRefresh:
  enabled: true
  schedule: "0 0 * * *"        # 00:00 UTC daily (BR-C-2)
  timeZone: "Etc/UTC"          # K8s 1.27+ CronJob TimeZone
  concurrencyPolicy: Forbid    # BR-C-4 (no overlap; append-only guard)
  startingDeadlineSeconds: 200 # parity with 5.4
  backoffLimit: 0              # BR-C-3 (no auto-retry; stale-serve + on-call)
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  image:
    repository: he-api/fx-refresh
    tag: "0.0.1"
    pullPolicy: IfNotPresent
  # FX provider secret (BR-C-7) — a K8s Secret holding HE_API_FX_PROVIDER_URL
  # (the base-URL/key), env-injected via envFrom. Provisioned out-of-band; see
  # docs/dev/secrets/fxrate-provider.md. Empty disables the secretRef (dev uses
  # the manual override below instead).
  providerSecretName: he-api-fxrate-provider
  # Dev / CI / air-gapped manual override (FX_MANUAL_USD_CNY). EMPTY in
  # staging/prod so the real provider is used; set in a dev values overlay.
  manualUsdCny: ""
  # Optional row `source` label (defaults to manual|http in the binary).
  source: ""
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
