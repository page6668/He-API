apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "payment-svc.fullname" . }}
  labels:
    {{- include "payment-svc.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "payment-svc.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "payment-svc.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "payment-svc.serviceAccountName" . }}
      # Pod Security Restricted profile — 6 literal fields (matches auth-svc).
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: payment-svc
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.env.OTEL_EXPORTER_OTLP_ENDPOINT | quote }}
            # payment.completed Kafka producer brokers; empty → producer disabled.
            - name: HE_API_KAFKA_BROKERS
              value: {{ .Values.env.kafkaBrokers | quote }}
          {{- if .Values.paymentProvider.secretName }}
          envFrom:
            # Story 1.7 B7 (BR7.1) — the 5 providers' credentials are injected
            # from the out-of-band Secret. The Secret's keys are the env-var
            # names in paymentProvider.requiredKeys (BR7.3 single-source);
            # NEVER rendered into this manifest, NEVER logged.
            - secretRef:
                name: {{ .Values.paymentProvider.secretName }}
          {{- end }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.httpGet.path }}
              port: {{ .Values.probes.readiness.httpGet.port }}
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.httpGet.path }}
              port: {{ .Values.probes.liveness.httpGet.port }}
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
