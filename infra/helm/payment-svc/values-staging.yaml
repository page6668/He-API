# payment-svc staging overrides (Story 1.7 B7). `he-api-registry-vpc.cn-hongkong.cr.aliyuncs.com` is the
# unified deploy-time substitution token (T0.3 — convention ②, wired in
# deploy-staging.yml). image.tag is SHA-bumped by deploy-staging's
# update-helm-values step (BR4.1 immutable-tag; NEVER `latest`).
image:
  repository: he-api-registry-vpc.cn-hongkong.cr.aliyuncs.com/he-api/payment-svc
  tag: "2d86008708c75739fc7a940c108c3374c272099d"
  pullPolicy: IfNotPresent
replicaCount: 1
service:
  type: ClusterIP
  port: 8080
# The provider Secret is hand-built in staging (docs/dev/secrets/payment-provider.md).
paymentProvider:
  secretName: he-api-payment-provider
networkPolicy:
  enabled: true
serviceAccount:
  create: true
  name: ""
serviceMonitor:
  enabled: true
  interval: 15s
