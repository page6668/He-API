apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: analytics-svc
  namespace: argocd
  labels:
    he-api/epic: "9"
    he-api/story: "9.1"
  # Story 1.7 B7b/AC8 (H-1) — source.path points at infra/helm/analytics-svc
  # created THIS story; previously dangling (no chart). 1.7-INT-003 guards it.
spec:
  project: he-api
  source:
    repoURL: git@github.com:page6668/He-API.git
    targetRevision: HEAD
    path: infra/helm/analytics-svc
    helm:
      releaseName: analytics-svc
      # Story 1.7 B3 (BR3.4) — values.yaml first, values-staging.yaml overlay last.
      valueFiles:
        - values.yaml
        - values-staging.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: he-api-staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
