apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: adapter-doubao
  namespace: argocd
  labels:
    he-api/epic: "4"
    he-api/story: "4.5"
spec:
  project: he-api
  source:
    repoURL: git@github.com:page6668/He-API.git
    targetRevision: HEAD
    path: infra/helm/adapter-doubao
    helm:
      releaseName: adapter-doubao
      valueFiles:
        - values.yaml
        - values-staging.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: he-api-adapters
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
