apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: api-gateway
  namespace: argocd
  labels:
    he-api/epic: "3"
    he-api/story: "3.1"
spec:
  project: he-api
  source:
    repoURL: git@github.com:page6668/He-API.git
    targetRevision: HEAD
    path: infra/helm/api-gateway
    helm:
      releaseName: api-gateway
      # Story 1.7 B3 (BR3.4) — values.yaml first, values-staging.yaml overlay
      # last (overlay wins). The staging overlay carries the SHA-bumped image.
      valueFiles:
        - values.yaml
        - values-staging.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: he-api-staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
