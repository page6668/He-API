apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: routing-svc
  namespace: argocd
  labels:
    he-api/epic: "6"
    he-api/story: "6.1"
spec:
  project: he-api
  source:
    repoURL: https://github.com/he-api/he-api
    targetRevision: HEAD
    path: infra/helm/routing-svc
    helm:
      releaseName: routing-svc
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: he-api-staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
