apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: payment-svc
  namespace: argocd
  labels:
    he-api/epic: "7"
    he-api/story: "7.3"
  # Story 1.7 B7 — Application + chart both created this story. The payment-svc
  # service originates Epic 7; its Helm chart was added by 1.7/T7.1.
spec:
  project: he-api
  source:
    repoURL: https://github.com/page6668/He-API
    targetRevision: HEAD
    path: infra/helm/payment-svc
    helm:
      releaseName: payment-svc
      # Story 1.7 B3 (BR3.4) — values.yaml first, values-staging.yaml overlay last.
      valueFiles:
        - values.yaml
        - values-staging.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: he-api-staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
