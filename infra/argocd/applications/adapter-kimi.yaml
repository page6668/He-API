apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: adapter-kimi
  namespace: argocd
  labels:
    he-api/epic: "4"
    he-api/story: "4.3"
spec:
  project: he-api
  source:
    repoURL: https://github.com/he-api/he-api
    targetRevision: HEAD
    path: infra/helm/adapter-kimi
    helm:
      releaseName: adapter-kimi
      valueFiles:
        - values.yaml
        - values-staging.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: he-api-adapters
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
