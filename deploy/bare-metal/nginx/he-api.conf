# ============================================================
# He-API Nginx 反向代理配置
# 路径：/etc/nginx/conf.d/he-api.conf
# 部署说明：
#   1. 复制到 /etc/nginx/conf.d/he-api.conf
#   2. 修改 ssl_certificate 路径为你的 Let's Encrypt 证书
#   3. nginx -t && systemctl reload nginx
# ============================================================

# ---------- upstream 定义 ----------
upstream gateway {
    server 127.0.0.1:8080;
    keepalive 64;
}

upstream console {
    server 127.0.0.1:3000;
    keepalive 32;
}

# ---------- API 网关 ----------
server {
    listen 443 ssl http2;
    server_name api.he-api.example.com;

    ssl_certificate /etc/letsencrypt/live/he-api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/he-api.example.com/privkey.pem;

    # 安全响应头
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-XSS-Protection "1; mode=block";

    location / {
        proxy_pass http://gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        client_max_body_size 10M;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # 健康检查端点（nginx 层面可访问）
    location /healthz {
        proxy_pass http://gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }
}

# ---------- Console 前端 ----------
server {
    listen 443 ssl http2;
    server_name console.he-api.example.com;

    ssl_certificate /etc/letsencrypt/live/he-api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/he-api.example.com/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;

    location / {
        proxy_pass http://console;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
    }
}

# ---------- HTTP → HTTPS 重定向 ----------
server {
    listen 80;
    server_name api.he-api.example.com console.he-api.example.com;
    return 301 https://$host$request_uri;
}
