# ============================================================
# He-API Nginx 反向代理配置（同源单域部署）
# 路径：/etc/nginx/conf.d/he-api.conf
# 部署步骤：
#   1. 复制本文件到 /etc/nginx/conf.d/he-api.conf
#   2. 修改 server_name 与 ssl_certificate 为你的域名/证书
#   3. nginx -t && systemctl reload nginx
#
# 拓扑：console 与 gateway 同一域名（同源），auth cookie（Path=/v1/auth/refresh,
# SameSite=Strict）为第一方，零跨域问题。
#   /            → console  (Next.js standalone :3000)
#   /v1, /healthz → gateway (:8080)，含 SSE 流式（proxy_buffering off）
# ============================================================

# ---------- upstream 定义 ----------
upstream gateway {
    server 127.0.0.1:8080;
    keepalive 64;
}

upstream console {
    server 127.0.0.1:3000;
    keepalive 32;
}

# ---------- 主站（同源：console + gateway）----------
server {
    listen 443 ssl http2;
    server_name he-api.example.com;

    ssl_certificate     /etc/letsencrypt/live/he-api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/he-api.example.com/privkey.pem;

    # 安全响应头
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-XSS-Protection "1; mode=block";

    # ---------- API 网关（含流式 SSE）----------
    location /v1/ {
        proxy_pass http://gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # 流式响应（chat/completions SSE）必须关闭缓冲
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        client_max_body_size 10M;
    }

    # 健康检查端点
    location = /healthz {
        proxy_pass http://gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # ---------- Console 前端 ----------
    location / {
        proxy_pass http://console;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
    }
}

# ---------- HTTP → HTTPS 重定向 ----------
server {
    listen 80;
    server_name he-api.example.com;
    return 301 https://$host$request_uri;
}
