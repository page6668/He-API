# Kafka KRaft 单节点配置文件
# Kafka 3.7.0 | KRaft 模式（无需 Zookeeper）

# ─────────────────────────────────────────
# 节点与集群标识（单节点 = 0）
# ─────────────────────────────────────────
node.id=0

# KRaft 控制器 quorum voters（单节点配置）
# 格式：<node.id>@<host>:<CONTROLLER端口9093>
controller.quorum.voters=0@localhost:9093

# ─────────────────────────────────────────
# 监听器配置
# ─────────────────────────────────────────
listeners=PLAINTEXT://localhost:9092,CONTROLLER://localhost:9093
listener.security.protocol.map=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
inter.broker.listener.name=PLAINTEXT

# 广告地址（外部访问时改为公网 IP 或域名）
advertised.listeners=PLAINTEXT://localhost:9092

# 控制台日志级别（可选，调试时改为 DEBUG）
log.level=INFO

# ─────────────────────────────────────────
# 日志存储
# ─────────────────────────────────────────
log.dirs=/opt/kafka/data

# ─────────────────────────────────────────
# Topic 默认配置（覆盖场景可单独指定）
# ─────────────────────────────────────────
num.partitions=3
default.replication.factor=1
min.insync.replicas=1

# 日志保留（7 天 = 168 小时；审计日志由 ClickHouse 存储，此处仅作缓冲）
# 计费事件、通知事件：7 天（604800000 ms）
# 审计日志：30 天（2592000000 ms），单独在 topic 创建时指定
log.retention.hours=168
log.retention.bytes=-1
log.segment.bytes=1073741824   # 1 GiB

# 压缩
compression.type=producer

# ─────────────────────────────────────────
# 清理策略
# ─────────────────────────────────────────
log.cleanup.policy=delete

# ─────────────────────────────────────────
# JVM 堆内存（4G RAM VM 建议 2G，生产环境可调）
# ─────────────────────────────────────────
KAFKA_HEAP_OPTS=-Xmx2g -Xms2g

# JMX 监控端口（可选）
JMX_PORT=9999

# ─────────────────────────────────────────
# KRaft 模式（必须声明）
# ─────────────────────────────────────────
process.roles=broker,controller

# ─────────────────────────────────────────
# 日志追加器（Kafka 自身日志，非业务日志）
# ─────────────────────────────────────────
# Kafka server log4j（通过 log4j-logger.properties 配置）
