// billing.proto — He-API billing contract for Epic 7 (计费、定价与多通道支付).
// Realises the rest-api-spec.md §5.2 `BillingService` sketch (pre-declared,
// never implemented) as a concrete proto under the Story-1.5-ratified layout
// `packages/proto/he/<domain>/v1/<service>.proto`.
//
// Story 7.1 defines:
//   - UsageEvent — the `usage.recorded` Kafka payload. The api-gateway is the
//     PRODUCER (Architect Q-PRODUCER — only the gateway holds per-request token
//     counts + he_request_id at response time); billing-svc/audit-svc/analytics-
//     svc are CONSUMERS (data-models §4.4). The event carries RAW inputs ONLY —
//     NO cost_usd field (Architect Q-CH: billing-svc is the sole cost authority).
//   - BillingService.CheckBalance — a sync, PG-authoritative balance read for
//     console / reconciliation callers (the hot-path 402 gate uses a fast Redis
//     read, NOT this RPC). DeductBalance stays DEFERRED (deduction is the async
//     Kafka path).
//
// Story 7.3 ADDS (additive — passes `buf breaking: FILE`):
//   - BillingService.CreateRechargeOrder — realises the §5.2-sketched RPC.
//     billing-svc is the SOLE writer of recharge_orders (Q-ORDEROWNER);
//     payment-svc calls this to persist the PENDING order, then carries the
//     returned order_id into the provider checkout as metadata.
//
// NEW package `he.billing.v1` (not `he.api.v1`) — since this is a NEW file (not
// an edit to an existing proto), `buf breaking: FILE` is not crossed.
//
// Toolchain note: buf/protoc cannot run in this environment
// ([[project_toolchain_env_limits]]); the vendored *.pb.go is hand-authored from
// a descriptorpb-built FileDescriptorProto and verified by a round-trip
// marshal/unmarshal test (7.1-CONTRACT-002).

syntax = "proto3";

package he.billing.v1;

option go_package = "github.com/he-api/he-api/packages/proto/gen/go/he/billing/v1;billingv1";

// BillingMode selects the cost model. PER_TOKEN is the only billed mode in 7.1;
// PER_CALL is reserved (Architect Q-PERCALL — the model_pricing.per_call_price_usd
// column lands additive+nullable but UNWIRED). UNSPECIFIED(0) ≡ PER_TOKEN.
enum BillingMode {
  BILLING_MODE_UNSPECIFIED = 0; // proto3 zero-value; engine treats it as PER_TOKEN
  BILLING_MODE_PER_TOKEN = 1;
  BILLING_MODE_PER_CALL = 2; // reserved — OFF in 7.1
}

// UsageEvent is the `usage.recorded` Kafka payload (JSON-serialized on the wire,
// mirroring the notification-svc audit.event precedent). RAW inputs only — each
// consumer computes cost from the shared pricing logic (Q-CH).
message UsageEvent {
  // ledger_key is the exactly-once dedup key (Q-ABKEY): he_request_id for a
  // single request, `{he_request_id}:{leg_index}` for an A/B leg.
  string ledger_key = 1;
  string he_request_id = 2;
  string user_id = 3;
  string api_key_id = 4;
  string team_id = 5; // nullable — empty string when absent
  string model = 6;
  uint32 prompt_tokens = 7;
  uint32 completion_tokens = 8;
  uint32 total_tokens = 9;
  bool is_streaming = 10;
  bool is_ab_leg = 11;
  string ts = 12; // RFC3339 event timestamp (post-flush)
  BillingMode billing_mode = 13;
}

// CheckBalanceRequest asks for a user's PG-authoritative balance.
message CheckBalanceRequest {
  string user_id = 1;
}

// CheckBalanceResponse carries string-decimal money (Q-Spec-4 — never a JSON
// number) + a sufficiency flag (current_usd > 0).
message CheckBalanceResponse {
  string current_usd = 1; // string-decimal, e.g. "12.3400"
  bool sufficient = 2;
}

// CreateRechargeOrderRequest creates a PENDING recharge order (Story 7.3,
// Q-ORDEROWNER). external_order_id is NOT supplied at create — it is bound at
// credit time from the provider-verified webhook (the UNIQUE(payment_provider,
// external_order_id) fence guards against two orders binding one charge).
message CreateRechargeOrderRequest {
  string user_id = 1;
  string amount = 2;           // string-decimal intent (Q-Spec-4)
  string currency = 3;         // ISO-4217 (7.3 enables USD only — Q-CURRENCY)
  string payment_provider = 4; // stripe / paypal
}

// CreateRechargeOrderResponse returns our internal order id + its initial status.
message CreateRechargeOrderResponse {
  string order_id = 1; // recharge_orders.id (UUID) — carried as provider metadata
  string status = 2;   // always 'pending' at create
}

// --- Story 7.8 additions (additive — passes `buf breaking: FILE`) ---
// The subscription-tier read + change seam. NOTE: Stories 7.7 added 6 further
// BillingService RPCs (SetAutoRecharge … GetInvoicePdf) directly to the vendored
// descriptor; this .proto source lagged on those. The generated descriptor
// (billing.pb.go) is the authoritative, round-trip-tested contract.

// GetSubscriptionRequest resolves the AUTHENTICATED user's subscription
// (user_id is server-resolved; BR-S-7 cross-user read impossible).
message GetSubscriptionRequest {
  string user_id = 1;
}

// GetSubscriptionResponse carries the current plan + status + period end. The
// gateway resolves entitlements from its in-process plan-catalogue (BR-E-5).
message GetSubscriptionResponse {
  string plan = 1;                // free | pro | team | enterprise (else free — Q-PLAN-DEFAULT)
  string status = 2;             // active | cancelled | past_due
  string current_period_end = 3; // RFC3339 (next-billing / period roll)
}

// ChangePlanRequest upgrades/downgrades (or cancels) the AUTHENTICATED user's
// subscription (server-resolved user_id; BR-S-7).
message ChangePlanRequest {
  string user_id = 1;
  string new_plan = 2; // target tier; unknown → 400_invalid_payment_request (Medium-1)
  bool cancel = 3;     // DELETE /v1/billing/subscription → revert to free at period end
}

// ChangePlanResponse reports the resolved direction + whether deferred.
message ChangePlanResponse {
  string direction = 1;               // upgrade | downgrade | same
  string new_plan = 2;
  bool deferred_to_period_end = 3;    // downgrade/cancel scheduled at period end (BR-S-2)
}

// GetEntitlementsRequest resolves a user's tier entitlement.
message GetEntitlementsRequest {
  string user_id = 1;
}

// GetEntitlementsResponse mirrors packages/plan-catalogue.Entitlement (money is
// string-decimal — Q-Spec-4).
message GetEntitlementsResponse {
  string plan = 1;
  int64 rpm = 2;
  int64 tpm = 3;
  int64 qps = 4;
  string monthly_included_credit_usd = 5; // string-decimal
  string monthly_quota_usd = 6;           // string-decimal
}

service BillingService {
  // CheckBalance returns the PG-authoritative current_usd for a user.
  rpc CheckBalance(CheckBalanceRequest) returns (CheckBalanceResponse);
  // CreateRechargeOrder persists a PENDING recharge order (Story 7.3 additive).
  rpc CreateRechargeOrder(CreateRechargeOrderRequest) returns (CreateRechargeOrderResponse);
  // GetSubscription resolves the caller's current subscription (Story 7.8).
  rpc GetSubscription(GetSubscriptionRequest) returns (GetSubscriptionResponse);
  // ChangePlan upgrades/downgrades/cancels the caller's subscription (Story 7.8).
  rpc ChangePlan(ChangePlanRequest) returns (ChangePlanResponse);
  // GetEntitlements resolves a caller's tier entitlement (Story 7.8).
  rpc GetEntitlements(GetEntitlementsRequest) returns (GetEntitlementsResponse);
}
