// sample.proto — proto contract for the sample domain (scaffolded by
// scripts/scaffold-svc.sh, Story 1.5 Q4 ruling). Generated Go code is vendored
// at packages/proto/gen/go/he/sample/v1/.
syntax = "proto3";

package he.sample.v1;

option go_package = "github.com/he-api/he-api/packages/proto/gen/go/he/sample/v1;samplev1";

service SampleService {
  rpc Ping(PingRequest) returns (PingResponse);
}

message PingRequest {
  string ping = 1;
}

message PingResponse {
  string pong = 1;
}
