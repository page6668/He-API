// auth.proto — He-API authentication service contract (Story 2.2).
// Generated Go code is vendored at packages/proto/gen/go/he/auth/v1/.
//
// Wright Round 1 Q1 ruling: console BFF → api-gateway REST → auth-svc gRPC.
// auth-svc is internal-only (ClusterIP, NetworkPolicy ingress=api-gateway).
//
// LoginUserResponse.status is a forward-compat enum: `STATUS_OK` returns
// access+refresh tokens directly; `STATUS_REQUIRES_2FA` (Story 2.4 hook)
// returns mfa_token instead, no session yet.
syntax = "proto3";

package he.auth.v1;

option go_package = "github.com/he-api/he-api/packages/proto/gen/go/he/auth/v1;authv1";

service AuthService {
  rpc RegisterUser(RegisterUserRequest) returns (RegisterUserResponse);
  rpc VerifyEmail(VerifyEmailRequest) returns (VerifyEmailResponse);
  rpc ResendVerification(ResendVerificationRequest) returns (ResendVerificationResponse);
  rpc LoginUser(LoginUserRequest) returns (LoginUserResponse);
  rpc RefreshToken(RefreshTokenRequest) returns (RefreshTokenResponse);

  // Story 2.3 — OAuth (Google + GitHub) Authorization Code + PKCE flow.
  // BeginOAuth: generate state + PKCE verifier, persist to Redis (TTL=600s
  // GETDEL one-shot per Wright Round 1 Q1=(a)), return provider authorize URL.
  // CompleteOAuth: redeem code+state, validate provider token, execute
  // verify-only auto-link decision (Wright Round 1 Q2=(a); 10 branches per
  // BR-3.1..BR-3.10), issue JWT (Story 2.2 jwt pkg) or 2FA challenge.
  rpc BeginOAuth(BeginOAuthRequest) returns (BeginOAuthResponse);
  rpc CompleteOAuth(CompleteOAuthRequest) returns (CompleteOAuthResponse);
}

// --- RegisterUser --------------------------------------------------------

message RegisterUserRequest {
  string email = 1;
  string password = 2;
  string locale = 3;
  // Client-attribution metadata. Caller (api-gateway) MUST populate from
  // request headers; auth-svc uses these for ratelimit + audit only.
  string client_ip = 4;
  string user_agent = 5;
}

message RegisterUserResponse {
  // Anti-enumeration: response shape is identical for new vs duplicate email.
  // user_id is intentionally omitted; api-gateway translates to a generic
  // {message:"verification_email_sent"} HTTP body.
  string status = 1; // always "pending_verification"
}

// --- VerifyEmail ---------------------------------------------------------

message VerifyEmailRequest {
  string token = 1; // base64url 32-byte CSPRNG; SHA-256 hashed before Redis lookup
  string client_ip = 2;
  string user_agent = 3;
}

message VerifyEmailResponse {
  string user_id = 1;
  // ISO-8601 timestamp; populated when newly verified OR already verified
  // (idempotent — BR-2.3).
  string email_verified_at = 2;
  // "email_verified" for fresh consume; "already_verified" for idempotent path.
  string status = 3;
}

// --- ResendVerification --------------------------------------------------

message ResendVerificationRequest {
  string email = 1;
  string client_ip = 2;
  string user_agent = 3;
}

message ResendVerificationResponse {
  // Anti-enumeration (Wright Round 1 m-5 ruling): identical shape across
  // {sent, already_verified, unknown_email}; api-gateway returns generic
  // {status:"ok"} 200.
  string status = 1; // always "ok"
}

// --- LoginUser -----------------------------------------------------------

message LoginUserRequest {
  string email = 1;
  string password = 2;
  string client_ip = 3;
  string user_agent = 4;
}

enum LoginStatus {
  LOGIN_STATUS_UNSPECIFIED = 0;
  LOGIN_STATUS_OK = 1;            // tokens issued; api-gateway sets cookies
  LOGIN_STATUS_REQUIRES_2FA = 2;  // Story 2.4 hook — returns mfa_token only
}

message LoginUserResponse {
  LoginStatus status = 1;
  // Populated when status == LOGIN_STATUS_OK.
  string access_token = 2;
  string refresh_token = 3;
  int32 access_token_expires_in_seconds = 4; // 900
  int32 refresh_token_expires_in_seconds = 5; // 2592000
  // Populated when status == LOGIN_STATUS_REQUIRES_2FA (Story 2.4 hook).
  string mfa_token = 6;
}

// --- RefreshToken --------------------------------------------------------

message RefreshTokenRequest {
  string refresh_token = 1;
  string client_ip = 2;
  string user_agent = 3;
}

message RefreshTokenResponse {
  string access_token = 1;
  string refresh_token = 2; // rotated jti; old jti DEL'd in Redis
  int32 access_token_expires_in_seconds = 3;
  int32 refresh_token_expires_in_seconds = 4;
}

// --- BeginOAuth (Story 2.3) ---------------------------------------------

message BeginOAuthRequest {
  // "google" | "github" — validated server-side; unknown values rejected
  // with INVALID_ARGUMENT.
  string provider = 1;
  // Caller-requested post-callback destination. MUST pass the api-gateway
  // allow-list (BR-1.5) before reaching Redis; rejection happens before any
  // state write.
  string return_to = 2;
  // next-intl locale propagated for provider hl= hint + Branch C INSERT
  // locale column.
  string locale = 3;
  // Client-attribution metadata. api-gateway populates from request headers
  // and X-Forwarded-For first-hop; auth-svc hashes both for state binding
  // (BR-1.6) — relaxed to /24 IPv4 / /64 IPv6 per Wright Round 1 m-4 ruling.
  string client_ip = 4;
  string user_agent = 5;
}

message BeginOAuthResponse {
  // Provider authorize endpoint URL with state + PKCE code_challenge + scope
  // + redirect_uri. api-gateway forwards via 302 Location header.
  string authorize_url = 1;
  // Raw base64url state_id (≥256-bit entropy crypto/rand 32 bytes). The
  // api-gateway stamps this verbatim into the short-lived he_oauth_state
  // cookie (Path=/v1/auth/oauth, Secure, HttpOnly, SameSite=Lax, Max-Age=600)
  // per BR-1.3.
  string state_id = 2;
  // Unix-seconds expiry of the state (now + 600s). Used by api-gateway for
  // cookie Max-Age + observability.
  int64 expires_at_unix = 3;
}

// --- CompleteOAuth (Story 2.3) ------------------------------------------

message CompleteOAuthRequest {
  string provider = 1;
  // Provider-issued authorization code from the callback URL query.
  string code = 2;
  // Raw state_id extracted from query AND he_oauth_state cookie (caller
  // verifies cookie == query before invocation; auth-svc re-verifies the
  // Redis sha256(state_id) match).
  string state_id = 3;
  string client_ip = 4;
  string user_agent = 5;
}

message CompleteOAuthResponse {
  // Newly created or existing user UUID. Populated on success only.
  string user_id = 1;
  // RS256 JWT access token (15 min) on full session; or 90s-exp 2FA
  // challenge token when requires_2fa=true (Story 2.2 BR-3.5 hook).
  string access_token = 2;
  // RS256 JWT refresh token (7 days). Empty when requires_2fa=true.
  string refresh_token = 3;
  // True when users.totp_enabled — caller MUST redirect to /2fa-challenge
  // instead of return_to.
  bool requires_2fa = 4;
  // True for Branch C (new-user-via-OAuth); false for Branch A/B.
  bool is_new_user = 5;
  // Branch outcome for audit + observability; never user-facing.
  // Renamed from `OAuthLinkOutcome` to `LinkOutcome` to satisfy buf lint
  // (the canonical enum-value prefix rule treats "OAuth" as "O" + "Auth";
  // semantically identical; CompleteOAuth scope makes the OAuth context
  // explicit at the response level).
  LinkOutcome link_outcome = 6;
  // Validated post-callback redirect target. Always within allow-list per
  // BR-1.5; api-gateway emits 302 Location with this value.
  string return_to = 7;
}

enum LinkOutcome {
  LINK_OUTCOME_UNSPECIFIED = 0;
  // Branch C — fresh INSERT (email did not exist in users).
  LINK_OUTCOME_NEW_USER = 1;
  // Branch B.1 — existing-verified-user auto-link (UPDATE oauth_provider,
  // oauth_subject).
  LINK_OUTCOME_LINKED = 2;
  // Branch A — existing OAuth user re-login (UPDATE updated_at only).
  LINK_OUTCOME_RELOGIN = 3;
}
