// auth.proto — He-API authentication service contract (Story 2.2).
// Generated Go code is vendored at packages/proto/gen/go/he/auth/v1/.
//
// Wright Round 1 Q1 ruling: console BFF → api-gateway REST → auth-svc gRPC.
// auth-svc is internal-only (ClusterIP, NetworkPolicy ingress=api-gateway).
//
// LoginUserResponse.status is a forward-compat enum: `STATUS_OK` returns
// access+refresh tokens directly; `STATUS_REQUIRES_2FA` (Story 2.4 hook)
// returns mfa_token instead, no session yet.
syntax = "proto3";

package he.auth.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/he-api/he-api/packages/proto/gen/go/he/auth/v1;authv1";

service AuthService {
  rpc RegisterUser(RegisterUserRequest) returns (RegisterUserResponse);
  rpc VerifyEmail(VerifyEmailRequest) returns (VerifyEmailResponse);
  rpc ResendVerification(ResendVerificationRequest) returns (ResendVerificationResponse);
  rpc LoginUser(LoginUserRequest) returns (LoginUserResponse);
  rpc RefreshToken(RefreshTokenRequest) returns (RefreshTokenResponse);

  // Story 2.3 — OAuth (Google + GitHub) Authorization Code + PKCE flow.
  // BeginOAuth: generate state + PKCE verifier, persist to Redis (TTL=600s
  // GETDEL one-shot per Wright Round 1 Q1=(a)), return provider authorize URL.
  // CompleteOAuth: redeem code+state, validate provider token, execute
  // verify-only auto-link decision (Wright Round 1 Q2=(a); 10 branches per
  // BR-3.1..BR-3.10), issue JWT (Story 2.2 jwt pkg) or 2FA challenge.
  rpc BeginOAuth(BeginOAuthRequest) returns (BeginOAuthResponse);
  rpc CompleteOAuth(CompleteOAuthRequest) returns (CompleteOAuthResponse);

  // Story 2.4 — TOTP 2FA (RFC 6238 + recovery codes + KMS envelope).
  // EnrollTOTPInit: generate 160-bit secret + 10 recovery codes, KMS-encrypt,
  // stage in Redis (auth:2fa:enroll:{user_id}, TTL=600s GETDEL one-shot),
  // return otpauth_uri + QR + plaintext recovery codes (only response that
  // returns them).
  // EnrollTOTPVerify: consume staged enrollment, validate first TOTP code,
  // persist totp_secret_encrypted + 10 bcrypt-hashed recovery codes in a
  // single PG transaction. Out-of-band 2fa_enabled email.
  // ChallengeTOTP: validates mfa_token (short-lived RS256 JWT, purpose=
  // '2fa_challenge') + 6-digit code, issues full-session access+refresh
  // tokens with aal=2 claim. Single-use JTI (Redis DEL on success).
  // UseRecoveryCode: alternative to ChallengeTOTP — bcrypt-compares input
  // against unused mfa_recovery_codes rows, atomic mark-used, issues aal=2
  // session tokens. Out-of-band 2fa_recovery_used email.
  // DisableTOTP: clears totp_secret_encrypted + deletes all recovery codes,
  // requires aal=2 session + factor re-verification (TOTP or password).
  // Out-of-band 2fa_disabled email (HIGH severity).
  // RegenerateRecoveryCodes: marks all current unused codes as used (forensic
  // trail) + issues 10 fresh codes in a single PG transaction. Requires
  // aal=2 + factor re-verification.
  rpc EnrollTOTPInit(EnrollTOTPInitRequest) returns (EnrollTOTPInitResponse);
  rpc EnrollTOTPVerify(EnrollTOTPVerifyRequest) returns (EnrollTOTPVerifyResponse);
  rpc ChallengeTOTP(ChallengeTOTPRequest) returns (ChallengeTOTPResponse);
  rpc UseRecoveryCode(UseRecoveryCodeRequest) returns (UseRecoveryCodeResponse);
  rpc DisableTOTP(DisableTOTPRequest) returns (DisableTOTPResponse);
  rpc RegenerateRecoveryCodes(RegenerateRecoveryCodesRequest) returns (RegenerateRecoveryCodesResponse);

  // Story 2.5 — profile management.
  // GetMe: profile read for Settings → Profile (returns whole-user snapshot
  // including email + totp_enabled + oauth_provider so the page renders
  // without a second RTT). api-gateway populates user_id from the verified
  // JWT `sub` claim; clients NEVER supply it (BR-1.1 IDOR defence).
  // UpdateProfile: partial profile mutation (display_name / locale /
  // timezone). Optimistic concurrency via `if_match` etag = updated_at
  // UnixMicro() string (Architect Q2 ruling 2026-05-16). On
  // successful locale change, api-gateway also rewrites `he_locale` cookie
  // so next-intl reflects the new locale on next render (Architect Q3).
  rpc GetMe(GetMeRequest) returns (GetMeResponse);
  rpc UpdateProfile(UpdateProfileRequest) returns (UpdateProfileResponse);

  // Story 3.2 — API Key validation for the api-gateway Bearer-auth middleware.
  // Called per request on cache miss; bcrypt-compares the supplied plaintext
  // against api_keys rows matching the 12-char key_prefix. Returns ok=true
  // with identity + scope on match; ok=false with REASON for not-found /
  // revoked. Plaintext key MUST NOT appear in logs, span attributes, or
  // errors — AC2 BR-2.6 + docs/architecture/coding-standards.md §12.3.
  rpc ValidateApiKey(ValidateApiKeyRequest) returns (ValidateApiKeyResponse);

  // Story 5.1 — API Key management surface (Create / List / Revoke).
  //
  // CreateApiKey: crypto/rand 32B → base62 → "he-" prefix → bcrypt(cost=12)
  // hash → INSERT he_api.api_keys → Kafka audit.event api_key.created.
  // Response carries the plaintext key ONCE (BR-1.5). user_id is gateway-
  // populated from JWT sub (BR-1.3 IDOR defence); client-supplied values
  // REJECTED.
  //
  // ListApiKeys: SELECT user-bound keys (LIMIT 100; ORDER BY created_at
  // DESC, id ASC). key_hash explicitly OMITTED from SELECT (BR-2.5 defence-
  // in-depth at the SQL boundary).
  //
  // RevokeApiKey: idempotent terminal-state UPDATE SET revoked_at=NOW();
  // sentinel SET auth:apikey:revoked:{api_key_id} EX 300 for cross-pod
  // cache-invalidation (BR-3.8; Architect Q2 ratified option-c). Returns
  // historical revoked_at + was_already_revoked on idempotent re-revoke.
  // Anti-enumeration: cross-user / not-found collapse to same NotFound
  // (BR-3.2; Architect Q4 ratified collapse).
  rpc CreateApiKey(CreateApiKeyRequest) returns (CreateApiKeyResponse);
  rpc ListApiKeys(ListApiKeysRequest) returns (ListApiKeysResponse);
  rpc RevokeApiKey(RevokeApiKeyRequest) returns (RevokeApiKeyResponse);

  // Story 5.2 — API Key configuration (partial update of scope + cost cap).
  //
  // UpdateApiKey: partial-update of api_keys.scope (models[] + ip_whitelist[])
  // and monthly_cost_cap_usd. Only fields PRESENT in the patch mutate
  // (BR-1.7 merge semantics). SELECT ... FOR UPDATE re-asserts ownership +
  // revoke-state (anti-enumeration NotFound collapse per BR-1.8 cascade from
  // Story-5.1 BR-3.2); the UPDATE WHERE clause re-asserts revoked_at IS NULL
  // against TOCTOU. On commit: SET auth:apikey:config_updated:{api_key_id}
  // sentinel EX 300 for cross-pod cache-invalidation (BR-1.9; mirrors the
  // Story-5.1 revoke sentinel) + Kafka audit.event api_key.config_updated
  // (BR-1.11; PII-safe; changed_fields[]). users.status='pending_deletion'
  // → FailedPrecondition account_pending_deletion (Q-I). No updated_at write
  // (Architect Q-K — the schema has no such column).
  rpc UpdateApiKey(UpdateApiKeyRequest) returns (UpdateApiKeyResponse);

  // Story 5.4 (Architect Round 1 Q-L Fix-A) — internal lookup feeding the
  // notification-svc monthly-cap email path. notification-svc cannot import
  // auth-svc's internal/repository across the go.work module boundary, so
  // auth-svc (the sole canonical reader of the PII-sensitive api_keys table)
  // exposes the JOIN result over gRPC. Single PG round-trip; called
  // fire-and-forget off the gateway hot path.
  rpc GetCapNotificationContext(GetCapNotificationContextRequest) returns (GetCapNotificationContextResponse);

  // Story 2.7 — GDPR account deletion (30-day grace). Added to the EXISTING
  // auth service (BR-2.2), NOT a new service.
  //
  // RequestAccountDeletion: re-auth-gated active→pending_deletion transition
  // (OWASP ASVS L2 V8.3). Server-side re-verifies a fresh credential
  // (password / confirm_email for OAuth-only / +TOTP when totp_enabled),
  // single-winner CAS `UPDATE ... WHERE id=$1 AND status='active'`, sets
  // pending_deletion_at = NOW() + 30d (server UTC, never client-supplied),
  // revokes all sessions, audits account.deletion.requested, fires
  // EMAIL_TEMPLATE_ACCOUNT_DELETION_REQUESTED. Idempotent: a 2nd request while
  // already pending returns the SAME pending_deletion_at (no new audit/email).
  // user_id is gateway-populated from JWT sub (BR-2.4 IDOR defence).
  //
  // CancelAccountDeletion: restorative pending_deletion→active CAS during the
  // grace window. Requires ONLY a valid JWT — no fresh re-auth (OQ-2 ratified
  // asymmetry; deletion is destructive, cancellation is restorative and is
  // already gated by signin). 0 rows + grace expired/deleted → grace_expired.
  //
  // GetAccountDeletionState: read-only hydration for AC1 dialog field
  // branching (has_password / totp_enabled are server-authoritative; the
  // password hash NEVER leaves auth-svc) + AC3 recovery countdown + AC4 guard.
  rpc RequestAccountDeletion(RequestAccountDeletionRequest) returns (RequestAccountDeletionResponse);
  rpc CancelAccountDeletion(CancelAccountDeletionRequest) returns (CancelAccountDeletionResponse);
  rpc GetAccountDeletionState(GetAccountDeletionStateRequest) returns (GetAccountDeletionStateResponse);
}

// --- RegisterUser --------------------------------------------------------

message RegisterUserRequest {
  string email = 1;
  string password = 2;
  string locale = 3;
  // Client-attribution metadata. Caller (api-gateway) MUST populate from
  // request headers; auth-svc uses these for ratelimit + audit only.
  string client_ip = 4;
  string user_agent = 5;
}

message RegisterUserResponse {
  // Anti-enumeration: response shape is identical for new vs duplicate email.
  // user_id is intentionally omitted; api-gateway translates to a generic
  // {message:"verification_email_sent"} HTTP body.
  string status = 1; // always "pending_verification"
}

// --- VerifyEmail ---------------------------------------------------------

message VerifyEmailRequest {
  string token = 1; // base64url 32-byte CSPRNG; SHA-256 hashed before Redis lookup
  string client_ip = 2;
  string user_agent = 3;
}

message VerifyEmailResponse {
  string user_id = 1;
  // ISO-8601 timestamp; populated when newly verified OR already verified
  // (idempotent — BR-2.3).
  string email_verified_at = 2;
  // "email_verified" for fresh consume; "already_verified" for idempotent path.
  string status = 3;
}

// --- ResendVerification --------------------------------------------------

message ResendVerificationRequest {
  string email = 1;
  string client_ip = 2;
  string user_agent = 3;
}

message ResendVerificationResponse {
  // Anti-enumeration (Wright Round 1 m-5 ruling): identical shape across
  // {sent, already_verified, unknown_email}; api-gateway returns generic
  // {status:"ok"} 200.
  string status = 1; // always "ok"
}

// --- LoginUser -----------------------------------------------------------

message LoginUserRequest {
  string email = 1;
  string password = 2;
  string client_ip = 3;
  string user_agent = 4;
}

enum LoginStatus {
  LOGIN_STATUS_UNSPECIFIED = 0;
  LOGIN_STATUS_OK = 1;            // tokens issued; api-gateway sets cookies
  LOGIN_STATUS_REQUIRES_2FA = 2;  // Story 2.4 hook — returns mfa_token only
}

message LoginUserResponse {
  LoginStatus status = 1;
  // Populated when status == LOGIN_STATUS_OK.
  string access_token = 2;
  string refresh_token = 3;
  int32 access_token_expires_in_seconds = 4; // 900
  int32 refresh_token_expires_in_seconds = 5; // 2592000
  // Populated when status == LOGIN_STATUS_REQUIRES_2FA (Story 2.4 hook).
  string mfa_token = 6;
  // Authentication Assurance Level (NIST SP 800-63B §4). Populated when
  // status == LOGIN_STATUS_OK. 1 = password-only; 2 = post-2FA challenge.
  // Story 2.2 always emits aal=1 here (password leg); the aal=2 path goes
  // through ChallengeTOTPResponse / UseRecoveryCodeResponse instead.
  int32 aal = 7;
}

// --- RefreshToken --------------------------------------------------------

message RefreshTokenRequest {
  string refresh_token = 1;
  string client_ip = 2;
  string user_agent = 3;
}

message RefreshTokenResponse {
  string access_token = 1;
  string refresh_token = 2; // rotated jti; old jti DEL'd in Redis
  int32 access_token_expires_in_seconds = 3;
  int32 refresh_token_expires_in_seconds = 4;
}

// --- BeginOAuth (Story 2.3) ---------------------------------------------

message BeginOAuthRequest {
  // "google" | "github" — validated server-side; unknown values rejected
  // with INVALID_ARGUMENT.
  string provider = 1;
  // Caller-requested post-callback destination. MUST pass the api-gateway
  // allow-list (BR-1.5) before reaching Redis; rejection happens before any
  // state write.
  string return_to = 2;
  // next-intl locale propagated for provider hl= hint + Branch C INSERT
  // locale column.
  string locale = 3;
  // Client-attribution metadata. api-gateway populates from request headers
  // and X-Forwarded-For first-hop; auth-svc hashes both for state binding
  // (BR-1.6) — relaxed to /24 IPv4 / /64 IPv6 per Wright Round 1 m-4 ruling.
  string client_ip = 4;
  string user_agent = 5;
}

message BeginOAuthResponse {
  // Provider authorize endpoint URL with state + PKCE code_challenge + scope
  // + redirect_uri. api-gateway forwards via 302 Location header.
  string authorize_url = 1;
  // Raw base64url state_id (≥256-bit entropy crypto/rand 32 bytes). The
  // api-gateway stamps this verbatim into the short-lived he_oauth_state
  // cookie (Path=/v1/auth/oauth, Secure, HttpOnly, SameSite=Lax, Max-Age=600)
  // per BR-1.3.
  string state_id = 2;
  // Unix-seconds expiry of the state (now + 600s). Used by api-gateway for
  // cookie Max-Age + observability.
  int64 expires_at_unix = 3;
}

// --- CompleteOAuth (Story 2.3) ------------------------------------------

message CompleteOAuthRequest {
  string provider = 1;
  // Provider-issued authorization code from the callback URL query.
  string code = 2;
  // Raw state_id extracted from query AND he_oauth_state cookie (caller
  // verifies cookie == query before invocation; auth-svc re-verifies the
  // Redis sha256(state_id) match).
  string state_id = 3;
  string client_ip = 4;
  string user_agent = 5;
}

message CompleteOAuthResponse {
  // Newly created or existing user UUID. Populated on success only.
  string user_id = 1;
  // RS256 JWT access token (15 min) on full session; or 90s-exp 2FA
  // challenge token when requires_2fa=true (Story 2.2 BR-3.5 hook).
  string access_token = 2;
  // RS256 JWT refresh token (7 days). Empty when requires_2fa=true.
  string refresh_token = 3;
  // True when users.totp_enabled — caller MUST redirect to /2fa-challenge
  // instead of return_to.
  bool requires_2fa = 4;
  // True for Branch C (new-user-via-OAuth); false for Branch A/B.
  bool is_new_user = 5;
  // Branch outcome for audit + observability; never user-facing.
  // Renamed from `OAuthLinkOutcome` to `LinkOutcome` to satisfy buf lint
  // (the canonical enum-value prefix rule treats "OAuth" as "O" + "Auth";
  // semantically identical; CompleteOAuth scope makes the OAuth context
  // explicit at the response level).
  LinkOutcome link_outcome = 6;
  // Validated post-callback redirect target. Always within allow-list per
  // BR-1.5; api-gateway emits 302 Location with this value.
  string return_to = 7;
  // Story 2.4 — short-lived RS256 JWT (purpose='2fa_challenge', 5-min TTL,
  // JTI tracked in Redis auth:2fa:challenge:{sha256(jti)}). Populated only
  // when requires_2fa=true. api-gateway stamps this into the he_mfa cookie
  // and 302s to /{locale}/2fa-challenge.
  string mfa_token = 8;
}

enum LinkOutcome {
  LINK_OUTCOME_UNSPECIFIED = 0;
  // Branch C — fresh INSERT (email did not exist in users).
  LINK_OUTCOME_NEW_USER = 1;
  // Branch B.1 — existing-verified-user auto-link (UPDATE oauth_provider,
  // oauth_subject).
  LINK_OUTCOME_LINKED = 2;
  // Branch A — existing OAuth user re-login (UPDATE updated_at only).
  LINK_OUTCOME_RELOGIN = 3;
}

// --- TOTP 2FA (Story 2.4) ------------------------------------------------
//
// Verification factor enum — shared by DisableTOTP + RegenerateRecoveryCodes
// for the re-authentication step. TOTP path requires KMS-decrypt of the
// stored secret; password path bcrypt-compares against users.password_hash
// (Story 2.2 BR-3.x). Spelling values with the canonical prefix so buf-lint
// (ENUM_VALUE_PREFIX) stays clean.
enum VerificationFactor {
  VERIFICATION_FACTOR_UNSPECIFIED = 0;
  VERIFICATION_FACTOR_TOTP = 1;
  VERIFICATION_FACTOR_PASSWORD = 2;
}

message EnrollTOTPInitRequest {
  // The authenticated user_id from JWT `sub` claim (api-gateway populates
  // after verifying he_access cookie). auth-svc rejects with INVALID_ARGUMENT
  // when empty / non-UUID.
  string user_id = 1;
  string client_ip = 2;
  string user_agent = 3;
}

message EnrollTOTPInitResponse {
  // otpauth://totp/He-API:{email}?secret=...&issuer=He-API&algorithm=SHA1
  // &digits=6&period=30 — RFC 6238 KeyURI format.
  string otpauth_uri = 1;
  // Server-rendered PNG (256x256, EC level Q) embedding otpauth_uri. Console
  // base64-encodes for <img src="data:image/png;base64,...">. Server-side
  // render avoids client-side QR library bundle + XSS surface.
  bytes qr_code_png = 2;
  // 10 plaintext recovery codes (10-char RFC 4648 base32). Returned ONLY in
  // this response (and RegenerateRecoveryCodesResponse). Console displays
  // once + locks; subsequent enrollment-verify does NOT re-emit them.
  repeated string recovery_codes = 3;
  // Unix-seconds expiry of the pending Redis blob (now + 600s). Console
  // surfaces a countdown so users know enrollment must complete in 10 min.
  int64 expires_at_unix = 4;
}

message EnrollTOTPVerifyRequest {
  string user_id = 1;
  // 6-digit ASCII (regex ^\d{6}$). Validated against ±1 30s window
  // (RFC 6238 §5.2) on the staged secret in Redis.
  string code = 2;
  // BR-1.7 — server rejects with FAILED_PRECONDITION when false.
  bool ack_recovery_codes_saved = 3;
  string client_ip = 4;
  string user_agent = 5;
}

message EnrollTOTPVerifyResponse {
  bool ok = 1;
  // Unix-seconds populated from the PG UPDATE returning clause.
  int64 enrolled_at_unix = 2;
}

message ChallengeTOTPRequest {
  // RS256 JWT — claims: sub, purpose='2fa_challenge', login_method,
  // client_ip_hash, user_agent_hash, jti, iat, exp (iat+300), return_to.
  // api-gateway forwards the he_mfa cookie value verbatim.
  string mfa_token = 1;
  // 6-digit ASCII.
  string code = 2;
  string client_ip = 3;
  string user_agent = 4;
}

message ChallengeTOTPResponse {
  string access_token = 1;
  string refresh_token = 2;
  int32 access_token_expires_in_seconds = 3; // 900
  int32 refresh_token_expires_in_seconds = 4; // 2592000
  // Always 2 — issued only on successful challenge.
  int32 aal = 5;
  // Validated return-to (BR-2.10 allow-list per Story 2.3 BR-1.5).
  string return_to = 6;
}

message UseRecoveryCodeRequest {
  string mfa_token = 1;
  // Normalized server-side: uppercase + strip non-alphanumeric → 10-char
  // base32. UI may pass with hyphens ("ABCD-EFGH-J2") for readability.
  string code = 2;
  string client_ip = 3;
  string user_agent = 4;
}

message UseRecoveryCodeResponse {
  string access_token = 1;
  string refresh_token = 2;
  int32 access_token_expires_in_seconds = 3;
  int32 refresh_token_expires_in_seconds = 4;
  int32 aal = 5;
  // Unused count AFTER this code was marked used. Drives dashboard low-codes
  // banner when <= 3 (BR-3.7).
  int32 recovery_codes_remaining = 6;
  bool recovery_codes_low = 7;
  string return_to = 8;
}

message DisableTOTPRequest {
  string user_id = 1;
  VerificationFactor factor = 2;
  // 6-digit TOTP code OR plaintext password — semantics depend on `factor`.
  string value = 3;
  string client_ip = 4;
  string user_agent = 5;
}

message DisableTOTPResponse {
  bool ok = 1;
}

message RegenerateRecoveryCodesRequest {
  string user_id = 1;
  VerificationFactor factor = 2;
  string value = 3;
  string client_ip = 4;
  string user_agent = 5;
}

message RegenerateRecoveryCodesResponse {
  // 10 fresh plaintext codes. Old codes are bulk-marked used (regenerated_
  // reason='user_initiated') in the same transaction; previously-used codes
  // are NOT touched.
  repeated string recovery_codes = 1;
}

// --- Story 2.5 — Profile (GetMe + UpdateProfile) -------------------------
//
// Both messages use proto3 `optional` keyword (Architect Round 1 m-4 ruling
// 2026-05-16) so absent fields generate Go *string / *bool wire types,
// avoiding the parallel `*_present` bool boilerplate. Partial-update
// semantics for UpdateProfileRequest: a nil-valued optional means "do not
// change"; an explicit empty string in display_name means "clear" (handler
// normalises to NULL per BR-2.4).

message GetMeRequest {
  // user_id is set by api-gateway from the verified JWT `sub` claim — clients
  // MUST NOT supply it (BR-1.1 IDOR defence). auth-svc rejects empty /
  // non-UUID with INVALID_ARGUMENT.
  string user_id = 1;
}

message GetMeResponse {
  string user_id = 1;
  string email = 2;
  optional string display_name = 3;        // NULL → field absent (proto3 optional)
  string locale = 4;
  string timezone = 5;
  bool totp_enabled = 6;
  optional string oauth_provider = 7;      // NULL for non-OAuth users
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
  // etag = `"{updated_at.UnixMicro()}"` (quoted-string per RFC 7232 §2.3) —
  // Architect Q2 ruling 2026-05-16. The api-gateway forwards verbatim as the
  // ETag response header.
  string etag = 10;
  // Story 6.5 — account-level default routing strategy ("quality"|"cost"|
  // "latency"), or absent when the user has set no default (→ STRATEGY_DEFAULT
  // passthrough). Additive (buf breaking: FILE stays green).
  optional string default_routing_strategy = 11;
}

message UpdateProfileRequest {
  string user_id = 1;
  // Each field uses proto3 `optional` — wire-absent means "do not change"
  // (BR-2.1). For display_name specifically, the value "" carries the
  // "clear to NULL" intent (BR-2.4 / BR-1.6).
  optional string display_name = 2;
  optional string locale = 3;
  optional string timezone = 4;
  // if_match echoes the etag returned by GetMeResponse / a prior
  // UpdateProfileResponse. Empty/missing → INVALID_ARGUMENT (api-gateway
  // also enforces at the HTTP If-Match layer — 428 Precondition Required).
  string if_match = 5;
  // Client attribution (api-gateway populates from request headers — same
  // pattern as RegisterUserRequest etc).
  string client_ip = 6;
  string user_agent = 7;
  // Story 6.5 — proto3 optional carries the three-way intent the gateway
  // resolves from the HTTP body: wire-absent = "do not change"; "" = clear to
  // NULL (→ STRATEGY_DEFAULT passthrough); "quality"|"cost"|"latency" = set.
  // auth-svc validates the enum (any other value → INVALID_ARGUMENT, no write).
  optional string default_routing_strategy = 8;
}

message UpdateProfileResponse {
  // Mirrors GetMeResponse so console reuses the same renderer.
  string user_id = 1;
  string email = 2;
  optional string display_name = 3;
  string locale = 4;
  string timezone = 5;
  bool totp_enabled = 6;
  optional string oauth_provider = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
  string etag = 10;
  // True when the supplied UpdateProfileRequest.locale differed from the
  // pre-update DB value. api-gateway uses this to decide whether to
  // rewrite the he_locale cookie (BR-3.10 / Architect Q3).
  bool locale_changed = 11;
  // Story 6.5 — echoes the persisted default_routing_strategy so the console
  // renders the saved value on PUT success (absent → no default).
  optional string default_routing_strategy = 12;
}

// --- Story 3.2 — ValidateApiKey (Bearer-token API key validation) --------

message ValidateApiKeyRequest {
  // Full plaintext bearer token (e.g., 'he-abc123XYZ...'). auth-svc applies
  // the syntactic regex `^he-[A-Za-z0-9]{10,253}$` BEFORE any DB query
  // (AC2 BR-2.6 — bcrypt-DoS-via-oversized-input defence).
  string plaintext_key = 1;
  // Client-attribution metadata; informational only in 3.2 (BR-2.7) —
  // forwarded for future audit-svc logging when Story 9.x lands. MUST NOT
  // affect the validate outcome.
  string client_ip = 2;
  string user_agent = 3;
}

message ValidateApiKeyResponse {
  bool ok = 1;
  // Populated when ok=true.
  string api_key_id = 2;     // UUID of the matched api_keys row
  string user_id = 3;        // UUID; the key's owner
  string team_id = 4;        // UUID or empty string when api_keys.team_id IS NULL
  string scope = 5;          // JSON-encoded string of api_keys.scope JSONB column
  // Populated for SRE alerting + downstream metric attribution.
  // NEVER surfaced to the HTTP client — gateway maps ALL ok=false to a
  // single 401 envelope (AC2 BR-2.4 anti-enumeration parity between
  // NOT_FOUND and REVOKED).
  ApiKeyValidationReason reason = 6;
  // Story 5.2 — the key's monthly_cost_cap_usd (string-decimal; null when the
  // DB column is NULL = "no cap"). Carried on the Validate hot path so the
  // api-gateway keypolicy middleware (AC4) enforces the cap from the bearer
  // cache WITHOUT a per-request PG round-trip (Q-A cache-shape extension).
  optional string monthly_cost_cap_usd = 7;
  // Story 8.4 — the key's content_safety_strictness ("strict"/"default"/"loose")
  // on the Validate hot path so the gateway gates the bidirectional filter from
  // cache (NOT NULL column → always populated on ok=true; "" fail-closes strict).
  string content_safety_strictness = 8;
}

enum ApiKeyValidationReason {
  API_KEY_VALIDATION_REASON_UNSPECIFIED = 0;  // ok=true path
  API_KEY_VALIDATION_REASON_NOT_FOUND = 1;    // no matching prefix / no bcrypt match / regex reject
  API_KEY_VALIDATION_REASON_REVOKED = 2;      // match found but revoked_at IS NOT NULL
}

// --- Story 5.1 — Create / List / Revoke API Key --------------------------

// CreateApiKeyRequest. user_id is the gateway-extracted JWT sub claim — the
// client request body MUST NOT carry it (BR-1.3). name is NFC-normalized
// + trimmed; 1-100 runes; allowed code-point classes L/M/N/P/Sc + ASCII
// space (BR-1.7). Client-attribution metadata for audit payload only.
message CreateApiKeyRequest {
  string user_id = 1;
  string name = 2;
  string client_ip = 3;
  string user_agent = 4;
}

// CreateApiKeyResponse. plaintext is set ONCE (BR-1.5) — NEVER persisted,
// NEVER re-fetchable, NEVER logged. key_prefix is the first 12 chars of
// plaintext (security.md §8.2 step 4) and is surfaced on subsequent ListApiKeys
// calls so users can identify keys without seeing the secret.
message CreateApiKeyResponse {
  string api_key_id = 1;
  string key_prefix = 2;
  string name = 3;
  google.protobuf.Timestamp created_at = 4;
  string plaintext = 5;
}

message ListApiKeysRequest {
  string user_id = 1;
}

message ListApiKeysResponse {
  repeated ApiKeyEntry keys = 1;
}

// ApiKeyEntry intentionally OMITS key_hash (BR-2.5 defence-in-depth at the
// proto boundary). monthly_cost_cap_usd + current_month_cost_usd are string-
// decimal (BR-2.10 / Architect Q-Spec-4 — Stripe precedent; JSON number
// would lose NUMERIC(10,2) / NUMERIC(12,4) precision on round-trip).
message ApiKeyEntry {
  string api_key_id = 1;
  string name = 2;
  string key_prefix = 3;
  string scope = 4;                                    // JSON-encoded scope JSONB
  optional string monthly_cost_cap_usd = 5;            // null when DB NULL
  string current_month_cost_usd = 6;                   // "0" default
  optional google.protobuf.Timestamp last_used_at = 7;
  optional google.protobuf.Timestamp revoked_at = 8;
  google.protobuf.Timestamp created_at = 9;
  // Story 8.4 — content_safety_strictness on the LIST/GET read path so the
  // owner can observe the effective level (NOT NULL → always populated).
  string content_safety_strictness = 10;
}

message RevokeApiKeyRequest {
  string user_id = 1;
  string api_key_id = 2;
  string client_ip = 3;
  string user_agent = 4;
}

// RevokeApiKeyResponse. was_already_revoked = true on idempotent re-revoke
// (BR-3.3); revoked_at carries the HISTORICAL timestamp in that case so the
// UI can show "Revoked on YYYY-MM-DD" without a re-SELECT (Architect Q-Spec-1
// upgrade of rest-api-spec.md §5.2 sketch).
message RevokeApiKeyResponse {
  string api_key_id = 1;
  google.protobuf.Timestamp revoked_at = 2;
  bool was_already_revoked = 3;
}

// --- Story 5.2 — UpdateApiKey (configure scope + monthly cost cap) --------

// ScopePatch carries the optional scope mutation. proto3's "no native
// presence for repeated fields" means absent-vs-empty cannot be inferred
// from the slice alone — the explicit *_present booleans distinguish "field
// omitted from the patch (preserve existing)" from "field present and empty
// (clear the list)" per BR-1.7 merge semantics.
message ScopePatch {
  repeated string models = 1;
  bool models_present = 2;        // true → mutate scope.models (even to [])
  repeated string ip_whitelist = 3;
  bool ip_whitelist_present = 4;  // true → mutate scope.ip_whitelist (even to [])
}

// UpdateApiKeyRequest. user_id is the gateway-extracted JWT sub claim — the
// client request body MUST NOT carry it (BR-1.1 IDOR defence). api_key_id is
// the path parameter (UUID v4). The gateway validates models[] against its
// in-process registry + ip_whitelist[] CIDR shape + cap range BEFORE this
// RPC; auth-svc re-validates cap range + CIDR shape (stdlib net/netip) as
// defence-in-depth. monthly_cost_cap_usd is a string-decimal (BR-1.6 /
// Q-Spec-4 cascade); clear_monthly_cap=true clears the cap to NULL.
message UpdateApiKeyRequest {
  string user_id = 1;
  string api_key_id = 2;
  ScopePatch scope = 3;                       // nil → scope untouched
  optional string monthly_cost_cap_usd = 4;   // present & !clear → set value
  bool clear_monthly_cap = 5;                 // true → set monthly_cost_cap_usd = NULL
  string client_ip = 6;                       // audit (hashed)
  string user_agent = 7;                      // audit (hashed)
  // Story 8.4 — present → set content_safety_strictness; absent → untouched
  // (BR-1.7 partial-update merge semantics, mirrors monthly_cost_cap_usd).
  optional string content_safety_strictness = 8;
}

// UpdateApiKeyResponse mirrors ApiKeyEntry's field set (minus key_hash) so
// the Console UI renders the post-update row with the same component as
// ListApiKeys. revoked_at is always null on a successful UPDATE (revoked
// rows are not updatable per the WHERE clause).
message UpdateApiKeyResponse {
  string api_key_id = 1;
  string name = 2;
  string key_prefix = 3;
  string scope = 4;                                   // JSON-encoded scope JSONB
  optional string monthly_cost_cap_usd = 5;           // null when DB NULL
  string current_month_cost_usd = 6;                  // string-decimal; "0" default
  optional google.protobuf.Timestamp last_used_at = 7;
  optional google.protobuf.Timestamp revoked_at = 8;  // always null on UPDATE
  google.protobuf.Timestamp created_at = 9;
  // Story 8.4 — echoes the effective content_safety_strictness post-update.
  string content_safety_strictness = 10;
}

// GetCapNotificationContextRequest — Story 5.4 Q-L Fix-A. Looks up the
// notification context for a single api_key by id (UUID v4).
message GetCapNotificationContextRequest {
  string api_key_id = 1;
}

// GetCapNotificationContextResponse — the single-statement JOIN result
// (users u JOIN api_keys ak ON u.id = ak.user_id WHERE ak.id = $1). Canonical
// field order: user fields then key fields. user_display_name may be empty
// (notification-svc resolveDisplayName falls back to the email local-part).
// key_monthly_cost_cap_usd is the NUMERIC(10,2) cap as a string-decimal
// ("50.00") — the email body's {{.CapUSD}} variable (BR-2.7); auth-svc is the
// canonical api_keys reader, so the cap is sourced here rather than re-derived
// in notification-svc.
message GetCapNotificationContextResponse {
  string user_email = 1;
  string user_locale = 2;
  string user_display_name = 3;
  string key_name = 4;
  string key_monthly_cost_cap_usd = 5;
}

// --- Account Deletion (Story 2.7) ----------------------------------------

// ReauthCredentials — the fresh credential re-verified server-side before the
// destructive active→pending_deletion transition (BR-2.4, OWASP ASVS L2 V8.3).
// Exactly the fields appropriate to the account shape are populated by the
// console (AC1 BR-1.4): password for password-users; confirm_email for
// OAuth-only; totp_code additionally when totp_enabled. All optional at the
// wire level — auth-svc decides which are REQUIRED from the account shape and
// fails closed (403_bad_reauth) on absence/mismatch.
message ReauthCredentials {
  optional string password = 1;       // bcrypt-verified (password-users)
  optional string confirm_email = 2;  // exact NFC match to users.email (OAuth-only)
  optional string totp_code = 3;      // 6-digit RFC 6238 (when totp_enabled)
}

// RequestAccountDeletionRequest. user_id is gateway-populated from JWT sub
// (BR-2.4 IDOR defence) — the client request body MUST NOT carry it.
message RequestAccountDeletionRequest {
  string user_id = 1;
  ReauthCredentials reauth = 2;
  string client_ip = 3;    // audit (hashed; never raw-stored — BR-7.6)
  string user_agent = 4;   // audit (hashed)
}

// RequestAccountDeletionResponse. status is "pending_deletion". On the
// idempotent re-request path the SAME pending_deletion_at is returned (BR-2.6).
// can_cancel_until == pending_deletion_at (the whole grace window is cancelable).
message RequestAccountDeletionResponse {
  string status = 1;
  google.protobuf.Timestamp pending_deletion_at = 2;
  google.protobuf.Timestamp can_cancel_until = 3;
}

// CancelAccountDeletionRequest. user_id gateway-populated (JWT sub). No fresh
// re-auth (OQ-2 ratified asymmetry — BR-3.4).
message CancelAccountDeletionRequest {
  string user_id = 1;
  string client_ip = 2;
  string user_agent = 3;
}

// CancelAccountDeletionResponse. status is "active" on success or the
// idempotent already-active path (BR-3.6).
message CancelAccountDeletionResponse {
  string status = 1;
}

// GetAccountDeletionStateRequest. user_id gateway-populated (JWT sub).
message GetAccountDeletionStateRequest {
  string user_id = 1;
}

// GetAccountDeletionStateResponse — read-only hydration. has_password /
// totp_enabled are server-authoritative and drive AC1 dialog field branching;
// the password hash NEVER leaves auth-svc. pending_deletion_at is present only
// while status='pending_deletion' (AC3 countdown). timezone renders the
// scheduled date in the user's tz (Story 2.5; AC3 BR-3.7).
message GetAccountDeletionStateResponse {
  string status = 1;
  optional google.protobuf.Timestamp pending_deletion_at = 2;
  bool has_password = 3;
  bool totp_enabled = 4;
  string timezone = 5;
}
