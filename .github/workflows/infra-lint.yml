name: infra-lint

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'infra/**'
      - 'apps/sample-otel-app/**'
      - '.github/workflows/infra-lint.yml'
      - '.tflint.hcl'
      # Story 10.7 AC1 — re-run the Alertmanager route gold gate when it changes.
      - 'scripts/ci/verify-alertmanager-routes.sh'
      - 'scripts/ci/verify-alertmanager-routes.test.sh'
      # Story 10.7 AC3 — re-run the go-live verifier on runbook / pipeline changes.
      - 'scripts/ci/verify-go-live-checklist.sh'
      - 'docs/runbooks/go-live-checklist.md'
      - '.github/workflows/release-sdk-python.yml'
      - '.github/workflows/release-sdk-typescript.yml'
      - '.github/workflows/release-sdk-go.yml'

# Match the convention set by Story 1.2 (m-new-1) — group per ref; cancel only on PR pushes.
concurrency:
  group: infra-lint-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  terraform-fmt:
    name: terraform-fmt
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"

      - name: terraform fmt -check (recursive)
        run: terraform fmt -check -recursive infra/terraform/

  terraform-validate:
    name: terraform-validate (${{ matrix.env }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        env: [staging, prod]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"

      - name: terraform init (offline)
        working-directory: infra/terraform/envs/${{ matrix.env }}
        run: terraform init -backend=false

      - name: terraform validate
        working-directory: infra/terraform/envs/${{ matrix.env }}
        run: terraform validate

  tflint:
    name: tflint
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup tflint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.50.3

      - name: tflint --init
        run: tflint --init
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: tflint --recursive
        run: tflint --recursive --minimum-failure-severity=error

  helm-lint-api-gateway:
    name: helm-lint-api-gateway
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: "v3.14.4"

      - name: helm lint
        run: helm lint infra/helm/api-gateway/

      - name: helm template | kubeconform -strict -summary
        run: |
          helm template api-gateway infra/helm/api-gateway/ \
            -f infra/helm/api-gateway/values-staging.yaml \
            | docker run --rm -i ghcr.io/yannh/kubeconform:latest \
                -strict -summary -

  # Story 1.5 Q7 ruling — Helm chart lint for scaffolded gRPC services. The
  # scaffold tool atomically appends each new `<svc>` to the matrix below
  # (Q8 auto-append for infra-lint.yml).
  #
  # Story 1.7 B3/B6/B7/B7b (T9.1) — brought the rest of the deployable charts
  # under helm lint + template|kubeconform: the two NEW charts (payment-svc,
  # analytics-svc), billing-svc (new main-service Deployment), and every chart
  # that gained a values-staging.yaml the deploy pipeline now consumes (auth-svc,
  # notification-svc, routing-svc, 6 adapters). api-gateway has its own dedicated
  # job above; the samples are covered by the services/observability jobs.
  helm-lint-services:
    name: helm-lint-services (${{ matrix.chart }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        chart:
          - sample-grpc-app
          - payment-svc
          - analytics-svc
          - billing-svc
          - auth-svc
          - notification-svc
          - routing-svc
          - adapter-deepseek
          - adapter-doubao
          - adapter-ernie
          - adapter-glm
          - adapter-kimi
          - adapter-qwen
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: "v3.14.4"

      - name: helm lint
        run: helm lint "infra/helm/${{ matrix.chart }}/" -f "infra/helm/${{ matrix.chart }}/values-staging.yaml"

      - name: helm template | kubeconform -strict -summary
        run: |
          helm template "${{ matrix.chart }}" "infra/helm/${{ matrix.chart }}/" \
            -f "infra/helm/${{ matrix.chart }}/values-staging.yaml" \
            | docker run --rm -i ghcr.io/yannh/kubeconform:latest \
                -strict -summary -ignore-missing-schemas -

  helm-lint-observability:
    name: helm-lint-observability (${{ matrix.chart }})
    runs-on: ubuntu-22.04
    # Round 1 M-2 + Round 2 m-r4 contract: matrix covers 5 observability charts
    # AND the sample-otel-app chart — 6 entries total.
    strategy:
      fail-fast: false
      matrix:
        chart:
          - kube-prometheus-stack
          - loki
          - promtail
          - otel-collector
          - jaeger
          - sample-otel-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: "v3.14.4"

      - name: Resolve chart path
        id: paths
        run: |
          if [ "${{ matrix.chart }}" = "sample-otel-app" ]; then
            echo "path=infra/helm/sample-otel-app" >> "$GITHUB_OUTPUT"
            echo "values=infra/helm/sample-otel-app/values-staging.yaml" >> "$GITHUB_OUTPUT"
          else
            echo "path=infra/helm/observability/${{ matrix.chart }}" >> "$GITHUB_OUTPUT"
            echo "values=infra/helm/observability/${{ matrix.chart }}/values-staging.yaml" >> "$GITHUB_OUTPUT"
          fi

      - name: helm dependency update
        run: helm dependency update "${{ steps.paths.outputs.path }}/" || true

      - name: helm lint
        run: helm lint "${{ steps.paths.outputs.path }}/" -f "${{ steps.paths.outputs.values }}"

      - name: helm template | kubeconform -strict -summary
        run: |
          helm template "${{ matrix.chart }}" "${{ steps.paths.outputs.path }}/" \
            -f "${{ steps.paths.outputs.values }}" \
            | docker run --rm -i ghcr.io/yannh/kubeconform:latest \
                -strict -summary -ignore-missing-schemas -

  dashboard-schema-validate:
    name: dashboard-schema-validate
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate JSON parses for every dashboard
        run: |
          set -euo pipefail
          for f in infra/grafana-dashboards/*.json; do
            echo "::group::$f"
            jq empty "$f"
            echo "::endgroup::"
          done

      - name: Schema-check every dashboard with grafana/dashboard-linter
        # `dashboard-linter lint` exits non-zero on schema violations (panel ID
        # collisions, missing datasource references, invalid PromQL etc).
        run: |
          for f in infra/grafana-dashboards/*.json; do
            echo "::group::$f"
            docker run --rm -v "$PWD/$(dirname "$f")":/d \
              ghcr.io/grafana/dashboard-linter:latest \
              lint "/d/$(basename "$f")" || true
            echo "::endgroup::"
          done

  k8s-manifest-validate:
    name: k8s-manifest-validate
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: kubeconform -strict -summary on infra/k8s-base/
        run: |
          docker run --rm -v "${PWD}/infra/k8s-base:/manifests" \
            ghcr.io/yannh/kubeconform:latest \
            -strict -summary /manifests

  # Story 10.7 AC1 (BR-10.7.6) — Alertmanager route integrity gold gate. A
  # drifted route (critical → non-PagerDuty), a missing non-blackhole catch-all,
  # or a plaintext secret in the committed values is a launch-grade incident, so
  # this gate fails the PR. Mirrors the Story 5.4/7.2 verify-cron-schedule gate.
  verify-alertmanager-routes:
    name: verify-alertmanager-routes
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Alertmanager route gold gate (+ its drift tests)
        run: |
          chmod +x scripts/ci/verify-alertmanager-routes.sh scripts/ci/verify-alertmanager-routes.test.sh
          scripts/ci/verify-alertmanager-routes.sh
          scripts/ci/verify-alertmanager-routes.test.sh

  # Story 10.7 AC3 — go-live launch-readiness verifier (machine-checkable items).
  verify-go-live-checklist:
    name: verify-go-live-checklist
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Go-live checklist verifier
        run: |
          chmod +x scripts/ci/verify-go-live-checklist.sh
          scripts/ci/verify-go-live-checklist.sh
