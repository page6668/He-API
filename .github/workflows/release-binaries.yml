  # ── Console（Next.js standalone）──────────────────────────────────────────
  build-console:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Build console standalone
        run: |
          tag="${GITHUB_REF_NAME}"
          # build-console.sh 会读取 deploy/bare-metal/env/console.env 的构建期变量。
          # 如需自定义生产域名，先修改该文件（或 secrets.CONSOLE_ENV_FILE）再构建。
          bash deploy/bare-metal/build-console.sh "$PWD" dist/console-out
          mkdir -p dist/console
          tar -czf "dist/console/he-api-console-${tag}-linux-amd64.tar.gz" -C dist/console-out console
          (cd dist/console && sha256sum "he-api-console-${tag}-linux-amd64.tar.gz" | awk '{print $1}' > "he-api-console-${tag}-linux-amd64.tar.gz.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: he-api-console
          path: dist/console/
          retention-days: 90

  # ── 汇总：下载所有 artifact 并挂到 Release ─────────────────────────────────
  release:
    needs:
      - build-api-gateway
      - build-auth-svc
      - build-billing-svc
      - build-payment-svc
      - build-notification-svc
      - build-routing-svc
      - build-analytics-svc
      - build-adapter-deepseek
      - build-adapter-qwen
      - build-adapter-doubao
      - build-adapter-glm
      - build-adapter-ernie
      - build-adapter-kimi
      - build-sample-grpc-app
      - build-sample-otel-app
      - build-console
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: false

      - name: Stage release assets
        run: |
          mkdir -p release-assets
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.sha256' \) -print0 | \
            xargs -0 -I{} cp {} release-assets/
          echo "=== Release assets ==="
          ls -lh release-assets/

      # ── 方案 A：把 15 个 Go 服务分包合并为一个 he-api-<tag>-linux-amd64.tar.gz ──
      # 这样 install.sh --release 能直接下载这个合并包，无需改 install.sh。
      # Console 单独打包（he-api-console-<tag>-linux-amd64.tar.gz），不解压进 Go 合并包。
      - name: Create combined Go binaries tarball
        run: |
          set -e
          tag="${{ github.ref_name }}"
          combined="combined-bin"
          mkdir -p "$combined"

          # 15 个 Go 服务的 artifact 目录名（与 upload-artifact name: 对应）
          declare -a services=(
            he-api-api-gateway
            he-api-auth-svc
            he-api-billing-svc
            he-api-payment-svc
            he-api-notification-svc
            he-api-routing-svc
            he-api-analytics-svc
            he-api-adapter-deepseek
            he-api-adapter-qwen
            he-api-adapter-doubao
            he-api-adapter-glm
            he-api-adapter-ernie
            he-api-adapter-kimi
            he-api-sample-grpc-app
            he-api-sample-otel-app
          )

          for svc in "${services[@]}"; do
            artifact_dir="artifacts/${svc}"
            if [[ ! -d "$artifact_dir" ]]; then
              echo "::warning::Artifact directory not found: $artifact_dir"
              continue
            fi
            tarball=$(ls "$artifact_dir"/he-api-*-${tag}.tar.gz 2>/dev/null | head -1)
            if [[ -z "$tarball" ]]; then
              echo "::warning::No tarball found for $svc with tag $tag"
              continue
            fi
            echo "Extracting $tarball"
            tar -xzf "$tarball" -C "$combined"
          done

          echo "Combined binary dir contents:"
          ls -lh "$combined"

          # 打包为 install.sh --release 期望的命名
          combined_tar="he-api-${tag}-linux-amd64.tar.gz"
          tar -czf "release-assets/${combined_tar}" -C "$combined" .
          (cd release-assets && sha256sum "${combined_tar}" | awk '{print $1}' > "${combined_tar}.sha256")
          echo "Created: $combined_tar"
          ls -lh release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## He-API ${{ github.ref_name }} — Linux amd64 二进制发布

            静态编译（CGO_ENABLED=0），适用于裸机 / systemd 部署。

            ### 部署方式
            ```bash
            # 在目标服务器上（install.sh 自动下载 Go 合并包 + Console 包）
            curl -fsSL https://raw.githubusercontent.com/page6668/He-API/main/deploy/bare-metal/install.sh \
              | bash -s -- --release ${{ github.ref_name }}
            ```

            ### Release 产物说明
            - **`he-api-${{ github.ref_name }}-linux-amd64.tar.gz`**（Go 合并包）：包含全部 15 个 Go 服务二进制，
              解压到 `/opt/he-api/bin/`，install.sh --release 使用此包。
            - **`he-api-console-${{ github.ref_name }}-linux-amd64.tar.gz`**（Console 包）：Next.js standalone 产物，
              解压到 `/opt/he-api/console/`。

            ### 包含的服务（15 个）
            | 服务 | 端口 |
            |---|---|
            | api-gateway | 8080 |
            | adapter-deepseek | 8091 |
            | adapter-qwen | 8092 |
            | adapter-doubao | 8093 |
            | adapter-glm | 8094 |
            | adapter-ernie | 8095 |
            | adapter-kimi | 8096 |
            | auth-svc | 9001 |
            | billing-svc | 9002 |
            | payment-svc | 9003 |
            | notification-svc | 9004 |
            | routing-svc | 9005 |
            | analytics-svc | 9006 |
            | sample-grpc-app | 9081 |
            | sample-otel-app | 9082 |
            | console (Next.js) | 3000 |

            Console 为 Next.js standalone 产物 `he-api-console-<tag>-linux-amd64.tar.gz`，
            解压到 `/opt/he-api/console` 后由 `he-api-console.service` 拉起。
            **注意**：Console 的 `NEXT_PUBLIC_*` 是构建期变量（含对外域名），
            改域名需重新构建（见 deploy/bare-metal/build-console.sh）。

            每个 tar.gz 附带 .sha256 校验文件。
