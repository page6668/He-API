name: Release Linux amd64 Binaries

# 打 tag（v*）时触发：交叉编译 15 个服务的 Linux amd64 静态二进制，
# 打包为 tar.gz + sha256，并作为附件上传到对应的 GitHub Release。
#
# 配合 deploy/bare-metal/install.sh --release <tag> 使用：
#   install.sh 从 GitHub Release 下载 he-api-<svc>-<tag>.tar.gz 并解压部署。
#
# 前置：仓库需有对应的 GitHub Release（本 workflow 会自动创建 draft release）。

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  GOOS: linux
  GOARCH: amd64
  CGO_ENABLED: 0
  GOPROXY: https://goproxy.cn,direct

jobs:
  # ── 构建矩阵：每个服务独立 job，并行编译 ──────────────────────────────────
  build-api-gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: Build
        run: |
          tag="${GITHUB_REF_NAME}"
          out="dist/api-gateway"
          mkdir -p "$out"
          go build -ldflags="-s -w" -o "$out/he-api-api-gateway-${tag}" ./apps/api-gateway/cmd/server
          tar -czf "$out/he-api-api-gateway-${tag}.tar.gz" -C "$out" "he-api-api-gateway-${tag}"
          (cd "$out" && sha256sum "he-api-api-gateway-${tag}.tar.gz" | awk '{print $1}' > "he-api-api-gateway-${tag}.tar.gz.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: he-api-api-gateway
          path: dist/api-gateway/
          retention-days: 90

  build-auth-svc:
