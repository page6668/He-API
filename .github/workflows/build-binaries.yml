name: Build Linux amd64 Binaries

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  GOOS: linux
  GOARCH: amd64
  CGO_ENABLED: 0
  GOPROXY: https://goproxy.cn,direct

jobs:
  # ── Individual service build jobs ────────────────────────────────────────────
  build-api-gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: Build
        run: |
          sha=$(git rev-parse --short=8 HEAD)
          out="dist/api-gateway"
          mkdir -p "$out"
          go build -ldflags="-s -w" -o "$out/he-api-api-gateway-${sha}" ./apps/api-gateway/cmd/server
          tar -czf "$out/he-api-api-gateway-${sha}.tar.gz" -C "$out" "he-api-api-gateway-${sha}"
          (cd "$out" && sha256sum "he-api-api-gateway-${sha}.tar.gz" | awk '{print $1}' > "he-api-api-gateway-${sha}.tar.gz.sha256")
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: he-api-api-gateway
          path: dist/api-gateway/
          retention-days: 30

  build-auth-svc:
