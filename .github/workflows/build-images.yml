name: build-images

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Story 1.5 Q8 ruling — one-time matrix refactor. The svc list is anchored
# once below (`&svc_list`) and re-used from build-image-main (`*svc_list`) so
# each new service appends in exactly one place (matches Story 1.5
# 1.5-UNIT-216 no-duplicate-entries contract).
#
# Story 1.7 B2 — the anchor was widened from 3 entries to the full deployable
# image set (17 deployable + 2 samples). Each entry is now an OBJECT carrying
# `name` / `context` / `dockerfile` so cron + workspace-root-context images
# (whose Dockerfile is NOT at apps/<svc>/Dockerfile, BR2.3) build correctly.
# `sample: true` marks the 2 sample images excluded from the "17" count (BR2.2).
# The verify-matrix-coverage job asserts the non-sample count == the deployable
# Dockerfile count (BR2.1). db-doctor reuses a base image (no Dockerfile, T6.3)
# so it is intentionally NOT a matrix entry.
jobs:
  build-image-pr:
    name: build-image-pr (${{ matrix.svc.name }})
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        svc: &svc_list
          # --- Long-running services (context = repo root; go.work + replace
          #     directives to ../../packages/* require the full workspace) ---
          - { name: api-gateway,      context: ., dockerfile: apps/api-gateway/Dockerfile }
          - { name: auth-svc,         context: ., dockerfile: apps/auth-svc/Dockerfile }
          - { name: notification-svc, context: ., dockerfile: apps/notification-svc/Dockerfile }
          - { name: analytics-svc,    context: ., dockerfile: apps/analytics-svc/Dockerfile }
          # --- Web frontend (Next.js; context = repo root — pnpm workspace) ---
          - { name: console,          context: ., dockerfile: apps/console/Dockerfile }
          # --- Long-running services (context = repo root, go.work modules) ---
          - { name: billing-svc,      context: ., dockerfile: apps/billing-svc/cmd/server/Dockerfile }
          - { name: payment-svc,      context: ., dockerfile: apps/payment-svc/cmd/server/Dockerfile }
          - { name: routing-svc,      context: ., dockerfile: apps/routing-svc/cmd/server/Dockerfile }
          # --- Vendor adapters (context = repo root) ---
          - { name: adapter-deepseek, context: ., dockerfile: apps/adapters/deepseek/Dockerfile }
          - { name: adapter-doubao,   context: ., dockerfile: apps/adapters/doubao/Dockerfile }
          - { name: adapter-ernie,    context: ., dockerfile: apps/adapters/ernie/Dockerfile }
          - { name: adapter-glm,      context: ., dockerfile: apps/adapters/glm/Dockerfile }
          - { name: adapter-kimi,     context: ., dockerfile: apps/adapters/kimi/Dockerfile }
          - { name: adapter-qwen,     context: ., dockerfile: apps/adapters/qwen/Dockerfile }
          # --- CronJob images (BR2.3 — explicit context/dockerfile override) ---
          - { name: monthly-cost-reset,       context: ., dockerfile: apps/auth-svc/cmd/monthly-cost-reset/Dockerfile }
          - { name: account-deletion-sweeper, context: ., dockerfile: apps/auth-svc/cmd/account-deletion-sweeper/Dockerfile }
          - { name: fx-refresh,               context: ., dockerfile: apps/billing-svc/cmd/fx-refresh/Dockerfile }
          - { name: safety-log-retention,     context: ., dockerfile: apps/api-gateway/cmd/safety-log-retention/Dockerfile }
          # --- Sample images (BR2.2 — retained, NOT counted in the "17") ---
          - { name: sample-otel-app, context: apps/sample-otel-app, dockerfile: apps/sample-otel-app/Dockerfile, sample: true }
          - { name: sample-grpc-app, context: ., dockerfile: apps/sample-grpc-app/Dockerfile, sample: true }
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (no push, validation only)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.svc.context }}
          file: ${{ matrix.svc.dockerfile }}
          push: false
          tags: he-api/${{ matrix.svc.name }}:pr-${{ github.event.pull_request.number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-image-main:
    name: build-image-main (${{ matrix.svc.name }})
    if: github.event_name == 'push'
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        svc: *svc_list
      fail-fast: false
    # OPS NOTE — if repo secret ACR_USERNAME is unset, HAS_ACR=false and the
    # push step is SKIPPED while the job still reports success. deploy-staging
    # then bumps image tags to a SHA whose images were never pushed → pods
    # ImagePullBackOff (NotFound). Keep ACR_USERNAME/ACR_PASSWORD/ACR_REGISTRY
    # configured on the repo for staging pushes to land.
    env:
      HAS_ACR: ${{ secrets.ACR_USERNAME != '' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ACR
        if: env.HAS_ACR == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      # Story 1.5 Q8 matrix tag templating — example resolved tag for the
      # api-gateway entry: he-api/api-gateway:${{ github.sha }} (Story 1.2
      # 1.2-UNIT-013 immutable-tag contract — only :SHA, never a moving tag).
      - name: Build and push (real)
        if: env.HAS_ACR == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.svc.context }}
          file: ${{ matrix.svc.dockerfile }}
          push: true
          tags: ${{ secrets.ACR_REGISTRY }}/he-api/${{ matrix.svc.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Skip push (no ACR secrets)
        if: env.HAS_ACR != 'true'
        run: |
          echo "ACR_USERNAME not configured (Story 1.3 dependency) — skipping push for ${{ matrix.svc.name }}" >> "$GITHUB_STEP_SUMMARY"

      # Preserve Story 1.2 image-sha artifact contract for deploy-staging.yml.
      # Only api-gateway uploads the artifact (single image-sha producer); the
      # deploy-staging bump derives the per-app SHA from this one value (BR2.4).
      - name: Write image SHA artifact
        if: matrix.svc.name == 'api-gateway'
        run: echo "${{ github.sha }}" > image-sha.txt

      - name: Upload image-sha artifact
        if: matrix.svc.name == 'api-gateway'
        uses: actions/upload-artifact@v4
        with:
          name: image-sha
          path: image-sha.txt
          retention-days: 7

  # Story 1.7 B2 (BR2.1 / BLIND-DATA-001) — CI count assertion. The non-sample
  # matrix entry count MUST equal the deployable-Dockerfile count (the "17"
  # headline), and every matrix entry MUST point at an existing Dockerfile (no
  # orphan/unbuildable entry). This is the guard that catches a new service
  # added to apps/ but forgotten in the matrix (or vice-versa).
  verify-matrix-coverage:
    name: verify-matrix-coverage
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Assert matrix covers every deployable Dockerfile (target 17)
        run: |
          set -euo pipefail
          EXPECTED=18
          matrix_count="$(yq '[.jobs.build-image-pr.strategy.matrix.svc[] | select(.sample != true)] | length' .github/workflows/build-images.yml)"
          # Deployable Dockerfiles = all apps/**/Dockerfile minus the 2 samples.
          # db-doctor has NO Dockerfile (reuse base image, T6.3) so it is excluded.
          docker_count="$(find apps -name Dockerfile | grep -vE 'sample-(otel|grpc)-app' | wc -l | tr -d ' ')"
          echo "matrix(non-sample)=${matrix_count} dockerfiles(deployable)=${docker_count} expected=${EXPECTED}"
          if [ "$matrix_count" != "$EXPECTED" ]; then
            echo "::error::non-sample matrix entries ${matrix_count} != expected ${EXPECTED}"; exit 1
          fi
          if [ "$docker_count" != "$EXPECTED" ]; then
            echo "::error::deployable Dockerfiles ${docker_count} != expected ${EXPECTED}"; exit 1
          fi

      - name: Assert every matrix entry resolves to an existing Dockerfile
        run: |
          set -euo pipefail
          rc=0
          while IFS= read -r df; do
            if [ ! -f "$df" ]; then
              echo "::error::matrix dockerfile missing: $df"; rc=1
            fi
          done < <(yq '.jobs.build-image-pr.strategy.matrix.svc[].dockerfile' .github/workflows/build-images.yml)
          exit "$rc"
