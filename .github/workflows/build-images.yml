name: build-images

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-image-pr:
    name: build-image-pr
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (no push, validation only)
        uses: docker/build-push-action@v6
        with:
          context: apps/api-gateway
          push: false
          tags: he-api/api-gateway:pr-${{ github.event.pull_request.number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-image-main:
    name: build-image-main
    if: github.event_name == 'push'
    runs-on: ubuntu-22.04
    env:
      HAS_ACR: ${{ secrets.ACR_USERNAME != '' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ACR
        if: env.HAS_ACR == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push (real)
        if: env.HAS_ACR == 'true'
        uses: docker/build-push-action@v6
        with:
          context: apps/api-gateway
          push: true
          tags: ${{ secrets.ACR_REGISTRY }}/he-api/api-gateway:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Skip push (no ACR secrets)
        if: env.HAS_ACR != 'true'
        run: |
          echo "ACR_USERNAME not configured (Story 1.3 dependency) — skipping push" >> "$GITHUB_STEP_SUMMARY"

      - name: Write image SHA artifact
        run: echo "${{ github.sha }}" > image-sha.txt

      - name: Upload image-sha artifact
        uses: actions/upload-artifact@v4
        with:
          name: image-sha
          path: image-sha.txt
          retention-days: 7
