name: build-images

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Story 1.5 Q8 ruling — one-time matrix refactor. The svc list is anchored
# once below (`&svc_list`) and re-used from build-image-main (`*svc_list`) so
# each new service appends in exactly one place (matches Story 1.5
# 1.5-UNIT-216 no-duplicate-entries contract).
jobs:
  build-image-pr:
    name: build-image-pr (${{ matrix.svc }})
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        svc: &svc_list
          - api-gateway
          - sample-otel-app
          - sample-grpc-app
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (no push, validation only)
        uses: docker/build-push-action@v6
        with:
          context: apps/${{ matrix.svc }}
          push: false
          tags: he-api/${{ matrix.svc }}:pr-${{ github.event.pull_request.number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-image-main:
    name: build-image-main (${{ matrix.svc }})
    if: github.event_name == 'push'
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        svc: *svc_list
      fail-fast: false
    env:
      HAS_ACR: ${{ secrets.ACR_USERNAME != '' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ACR
        if: env.HAS_ACR == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      # Story 1.5 Q8 matrix tag templating — example resolved tag for the
      # api-gateway entry: he-api/api-gateway:${{ github.sha }} (Story 1.2
      # 1.2-UNIT-013 immutable-tag contract — only :SHA, never a moving tag).
      - name: Build and push (real)
        if: env.HAS_ACR == 'true'
        uses: docker/build-push-action@v6
        with:
          context: apps/${{ matrix.svc }}
          push: true
          tags: ${{ secrets.ACR_REGISTRY }}/he-api/${{ matrix.svc }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Skip push (no ACR secrets)
        if: env.HAS_ACR != 'true'
        run: |
          echo "ACR_USERNAME not configured (Story 1.3 dependency) — skipping push for ${{ matrix.svc }}" >> "$GITHUB_STEP_SUMMARY"

      # Preserve Story 1.2 image-sha artifact contract for deploy-staging.yml.
      # Only api-gateway uploads the artifact (single image-sha consumer);
      # multi-image deploy is Story 1.6+.
      - name: Write image SHA artifact
        if: matrix.svc == 'api-gateway'
        run: echo "${{ github.sha }}" > image-sha.txt

      - name: Upload image-sha artifact
        if: matrix.svc == 'api-gateway'
        uses: actions/upload-artifact@v4
        with:
          name: image-sha
          path: image-sha.txt
          retention-days: 7
