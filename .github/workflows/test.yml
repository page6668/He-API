name: test

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  unit-ts:
    name: unit-ts
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # version resolved from packageManager field in root package.json

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Run tests (vitest via turbo)
        run: pnpm test

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-ts
          path: |
            packages/*/coverage/**
            apps/*/coverage/**
          if-no-files-found: ignore
          retention-days: 7

  unit-go:
    name: unit-go
    runs-on: ubuntu-22.04
    env:
      CGO_ENABLED: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Run go test (race + coverage)
        run: |
          go test ./apps/api-gateway/... -count=1 -race -coverprofile=coverage.out

      - name: Run go test (auth-svc + notification-svc — Story 5.4 cross-service)
        run: |
          go test ./apps/auth-svc/... ./apps/notification-svc/... -count=1 -race

      # Story 9.1 — analytics-svc unit lane (ClickHouse row/writer + request-log
      # worker). Not auto-included by the api-gateway path above; the //go:build
      # integration ClickHouse suite (9.1-INT-001/002/003) runs in the dedicated
      # clickhouse-integration job below (needs a live ClickHouse).
      - name: Run go test (analytics-svc — Story 9.1 ingestion unit tests)
        run: |
          go test ./apps/analytics-svc/... -count=1 -race

      # Story 8.1 — safety-lexicon integrity guard (Architect Round-1 High #1).
      # The package's test lane IS the load-bearing security gate (count floors,
      # zero-dupes, in-enum, Bloom no-false-negative + FP≤1%, determinism). It is
      # NOT auto-included by go.work, so it MUST be enumerated here explicitly; -race
      # covers the lock-free concurrent-read invariant (BR-3.5).
      - name: Run go test (safety-lexicon — Story 8.1 content-safety lexicon)
        run: |
          go test ./packages/safety-lexicon/... -count=1 -race

      # Story 10.4 — he-api Go SDK (github.com/he-api/sdk-go), the repo's first
      # go-get-able external module. go.work does NOT auto-enumerate packages/*
      # (same as safety-lexicon above), so the module's hermetic drop-in suite
      # MUST be listed explicitly or it becomes unverified dead code. -race covers
      # the shared-client concurrency invariant (10.4-BLIND-CONCURRENCY-001).
      - name: Run go test (sdk-go — Story 10.4 Go SDK)
        run: |
          go test ./packages/sdk-go/... -count=1 -race

      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage.out ]; then
            go tool cover -func=coverage.out | tail -1 >> "$GITHUB_STEP_SUMMARY"
          else
            echo "no coverage.out produced" >> "$GITHUB_STEP_SUMMARY"
          fi

  # Story 5.4 BR-3.1 — monthly-cost-reset CronJob schedule golden-file gate.
  # A drifted schedule could reset the cost-cap breakers mid-month; this gate
  # asserts the literal "0 0 1 * *" stays the single source of truth.
  verify-cron-schedule:
    name: verify-cron-schedule
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: verify monthly-cost-reset schedule
        run: bash scripts/ci/verify-cron-schedule.sh

  # Story 1.5 Q4 ruling — vendored Go gen drift detection. CI runs
  # `buf generate` and fails if `packages/proto/gen/` differs from committed
  # state, catching any proto edit that did not refresh the generated code.
  buf-generate-drift:
    name: buf-generate-drift
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - uses: bufbuild/buf-setup-action@v1
        with:
          version: 1.34.0

      - name: Install protoc plugins (Go + connect-go)
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.34.2
          go install connectrpc.com/connect/cmd/protoc-gen-connect-go@v1.16.2
          echo "$(go env GOBIN || echo $(go env GOPATH)/bin)" >> "$GITHUB_PATH"

      - name: buf lint
        working-directory: packages/proto
        run: buf lint

      - name: buf generate && git diff --exit-code packages/proto/gen
        working-directory: packages/proto
        run: |
          buf generate
          cd "${GITHUB_WORKSPACE}"
          git diff --exit-code packages/proto/gen/ || {
            echo "::error::vendored generated code is out of date — run 'buf generate' under packages/proto and commit the result" >&2
            exit 1
          }

  # Story 2.1 — Console e2e (Playwright × chromium/firefox/webkit). Root `unit-ts`
  # already covers console Vitest via Turborepo dispatch (M-2 ruling — no per-app
  # unit-tests / lint duplicate jobs).
  console-e2e-tests:
    name: console / e2e-tests
    runs-on: ubuntu-22.04
    needs: [unit-ts]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: apps/console
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Build console
        run: pnpm --filter @he-api/console build

      - name: Run Playwright tests
        working-directory: apps/console
        env:
          CI: '1'
        run: pnpm exec playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/console/playwright-report
          if-no-files-found: ignore
          retention-days: 7

  # Story 2.1 — Architect Q5 ruling: codegen drift + messages completeness + bundle
  # budget run sequentially in one job (4 steps per BR-4.8). Failure of any step
  # blocks the PR.
  console-i18n-keys-completeness:
    name: console / i18n-keys-completeness
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: 1/4 — Build @he-api/i18n-keys (codegen + tsc)
        run: pnpm --filter @he-api/i18n-keys build

      - name: 2/4 — git diff drift detection (packages/i18n-keys/src/)
        run: |
          git diff --exit-code packages/i18n-keys/src/ || {
            echo "::error::packages/i18n-keys/src drift — run 'pnpm --filter @he-api/i18n-keys build' and commit" >&2
            exit 1
          }

      - name: 3/4 — Messages completeness check
        run: pnpm exec tsx scripts/check-i18n-keys.ts

      - name: 4/4 — Bundle size budget (size-limit)
        run: |
          pnpm --filter @he-api/console build
          cd apps/console && pnpm exec size-limit

  integration:
    name: integration
    runs-on: ubuntu-22.04
    needs: [unit-ts, unit-go, buf-generate-drift, console-i18n-keys-completeness]
    steps:
      - uses: actions/checkout@v4

      - name: Integration placeholder
        run: |
          echo "integration tests deferred to Story 1.6"
          exit 0

  # Story 9.1 (AC1) — ClickHouse ingestion + aggregation integration suite + the
  # migration 002 round-trip. Resolves QA 9.1-H-C / 9.1-M-A (the Docker-gated P0
  # ClickHouse suites must run in CI with evidence):
  #   * 9.1-INT-001 — consume → request_logs row + hourly_agg MV auto-populates
  #   * 9.1-INT-002 — sum(success_count)/sum(request_count) over the MV == raw
  #                   countIf(status<400)/count() (DATA-002 aggregation correctness)
  #   * 9.1-INT-003 — migration 002 round-trip (up creates the objects; down drops
  #                   the MV then the table; the 001 he_api database survives)
  # ClickHouse 24+ per tech-stack §2.1. The Go suite (//go:build integration)
  # connects via HE_API_CLICKHOUSE_TEST_DSN; migration 002 is applied first.
  clickhouse-integration:
    name: analytics-svc / clickhouse-integration
    runs-on: ubuntu-22.04
    needs: [unit-go]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Start ClickHouse 24
        run: |
          docker run -d --name clickhouse \
            -p 9000:9000 -p 8123:8123 \
            --ulimit nofile=262144:262144 \
            clickhouse/clickhouse-server:24.3

      - name: Wait for ClickHouse ready
        run: |
          for i in $(seq 1 30); do
            if docker exec clickhouse clickhouse-client --query 'SELECT 1' >/dev/null 2>&1; then
              echo "ClickHouse ready after ${i} attempt(s)"
              docker exec clickhouse clickhouse-client --query 'SELECT version()'
              exit 0
            fi
            sleep 2
          done
          echo "::error::ClickHouse did not become ready in time"
          docker logs clickhouse || true
          exit 1

      # 9.1-INT-003 (forward) — apply migration 002 under the admin/default user
      # (M-1: DDL needs privileges the he_api app user lacks). The 001 baseline
      # creates the he_api database; here we ensure it exists, then apply 002.
      - name: Apply migration 002 (up) + assert objects exist
        run: |
          docker exec clickhouse clickhouse-client --query 'CREATE DATABASE IF NOT EXISTS he_api'
          docker exec -i clickhouse clickhouse-client --multiquery < migrations/clickhouse/002_create_request_logs.up.sql
          test "$(docker exec clickhouse clickhouse-client --query 'EXISTS TABLE he_api.request_logs')" = "1"
          test "$(docker exec clickhouse clickhouse-client --query 'EXISTS TABLE he_api.request_logs_hourly_agg')" = "1"
          echo "migration 002 up: request_logs + hourly_agg MV present"

      - name: Run ClickHouse integration suite (9.1-INT-001/002; 9.2-INT-001..006)
        env:
          HE_API_CLICKHOUSE_TEST_DSN: clickhouse://localhost:9000/he_api
        run: |
          go test -tags=integration -count=1 -v ./apps/analytics-svc/internal/clickhouse/...
          # Story 9.2 — the GET /v1/me/usage/logs read path (IDOR / PII / ordering
          # / filter narrowing) over the SAME request_logs table, against the same
          # live ClickHouse + migration 002.
          go test -tags=integration -count=1 -v ./apps/api-gateway/internal/analyticsquery/...

      # 9.1-INT-003 (reverse) — the down migration drops the MV then the table;
      # the 001 he_api database is untouched (non-destructive round-trip).
      - name: Apply migration 002 (down) + assert objects dropped
        run: |
          docker exec -i clickhouse clickhouse-client --multiquery < migrations/clickhouse/002_create_request_logs.down.sql
          test "$(docker exec clickhouse clickhouse-client --query 'EXISTS TABLE he_api.request_logs')" = "0"
          test "$(docker exec clickhouse clickhouse-client --query 'EXISTS TABLE he_api.request_logs_hourly_agg')" = "0"
          test "$(docker exec clickhouse clickhouse-client --query 'EXISTS DATABASE he_api')" = "1"
          echo "migration 002 round-trip clean: objects dropped, he_api database survives"

      - name: Stop ClickHouse
        if: always()
        run: docker rm -f clickhouse || true

  # Story 3.3 T3.4 — OpenAI Python SDK contract test against a live
  # api-gateway. Boots Postgres + Redis, applies migrations, seeds a
  # he_api.users row + an api_keys row via scripts/issue-test-key.sh,
  # starts the gateway, runs `pytest apps/api-gateway/tests/`.
  #
  # Re-uses Story 3.2's testcontainers wiring (Postgres 15 + Redis 7.2).
  # Skips automatically if HE_API_TEST_GATEWAY_URL is unset (BR-3.1).
  gateway-openai-sdk-contract:
    name: gateway / openai-sdk-contract
    runs-on: ubuntu-22.04
    needs: [unit-go]
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: he_api
          POSTGRES_PASSWORD: he_api
          POSTGRES_DB: he_api
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U he_api"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.2-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      HE_API_DATABASE_URL: postgres://he_api:he_api@localhost:5432/he_api?sslmode=disable
      HE_API_REDIS_URL: redis://localhost:6379/0
      HE_API_AUTH_SVC_URL: http://localhost:9090
      HE_API_JWT_PUBLIC_KEY_PATH: /tmp/he-api/public_key.pem
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python deps
        run: pip install -r apps/api-gateway/tests/requirements.txt

      - name: Generate RSA test keypair
        run: |
          mkdir -p /tmp/he-api
          openssl genrsa -out /tmp/he-api/private_key.pem 2048
          openssl rsa -in /tmp/he-api/private_key.pem -pubout -out /tmp/he-api/public_key.pem

      # Story 4.8 T2 — Self-signed TLS cert for the six adapter-fake upstreams.
      # Adapter binaries connect over HTTPS; SSL_CERT_FILE points them at this
      # bundle so the production-code trust path stays unchanged.
      - name: Generate adapter-fake TLS cert
        run: |
          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout /tmp/he-api/fake-tls.key \
            -out    /tmp/he-api/fake-tls.crt \
            -days 1 -subj "/CN=localhost" \
            -addext "subjectAltName=DNS:localhost,IP:127.0.0.1"

      - name: Apply migrations
        run: ./scripts/db-migrate.sh apply

      - name: Seed test user
        id: seed-user
        env:
          PGPASSWORD: he_api
        run: |
          USER_ID=$(uuidgen | tr '[:upper:]' '[:lower:]')
          psql -h localhost -U he_api -d he_api -c "INSERT INTO he_api.users \
            (id, email, password_hash, email_verified_at, locale, status) VALUES \
            ('$USER_ID', 'sdk-contract@example.com', '\\x00', NOW(), 'en', 'active');"
          echo "user_id=$USER_ID" >> "$GITHUB_OUTPUT"

      - name: Issue test API key
        id: issue-key
        env:
          HE_API_TEST_USER_ID: ${{ steps.seed-user.outputs.user_id }}
        run: |
          KEY=$(./scripts/issue-test-key.sh)
          echo "::add-mask::$KEY"
          echo "api_key=$KEY" >> "$GITHUB_OUTPUT"

      # Story 4.8 T2.1 — Build the six adapter-fake binaries + six adapter
      # binaries side-by-side. Cache is enabled at the setup-go step above so
      # the per-vendor builds reuse module compilation.
      - name: Build adapter binaries + adapter-fake upstreams
        run: |
          mkdir -p bin
          for v in deepseek qwen kimi glm doubao ernie; do
            go build -o "bin/${v}-fake" "./apps/adapters/${v}/cmd/fake-upstream"
            go build -o "bin/${v}-adapter" "./apps/adapters/${v}/cmd/server"
          done

      # Story 4.8 T2.2 — Start the six fake-upstreams on the BR-1.2 port map
      # (19000/19010/19020/19030/19040/19050). Captures PIDs for the cleanup
      # step. The TLS cert generated above is shared across all six.
      - name: Start six adapter-fake processes (background)
        run: |
          set -e
          mkdir -p /tmp/he-api/logs
          for entry in "deepseek 19000" "qwen 19010" "kimi 19020" "glm 19030" "doubao 19040" "ernie 19050"; do
            v="${entry% *}"
            port="${entry#* }"
            "./bin/${v}-fake" -listen ":${port}" \
              -cert /tmp/he-api/fake-tls.crt \
              -key  /tmp/he-api/fake-tls.key \
              > "/tmp/he-api/logs/${v}-fake.log" 2>&1 &
            pid_var="$(echo "${v}" | tr '[:lower:]' '[:upper:]')_FAKE_PID"
            echo "${pid_var}=$!" >> "$GITHUB_ENV"
          done

      # Story 4.8 T2.3 — Start the six adapter Connect-RPC binaries on the
      # paired ports (19001/19011/.../19051). Each adapter's UPSTREAM_BASE_URL
      # points at the matching fake-upstream HTTPS port. SSL_CERT_FILE makes
      # the adapter trust the self-signed cert without modifying production code.
      - name: Start six adapter processes (background)
        env:
          SSL_CERT_FILE: /tmp/he-api/fake-tls.crt
        run: |
          set -e
          # Brief settle before connecting; per-process readiness loop below.
          for entry in \
              "deepseek 19001 19000 DEEPSEEK" \
              "qwen     19011 19010 QWEN" \
              "kimi     19021 19020 KIMI" \
              "glm      19031 19030 GLM" \
              "doubao   19041 19040 DOUBAO" \
              "ernie    19051 19050 ERNIE"; do
            # shellcheck disable=SC2086
            set -- $entry
            vendor="$1"; port="$2"; fake_port="$3"; prefix="$4"
            env \
              PORT="${port}" \
              "${prefix}_UPSTREAM_BASE_URL=https://localhost:${fake_port}" \
              "${prefix}_UPSTREAM_API_KEY=test-stub" \
              DOUBAO_PRO_ENDPOINT_ID=ep-test-doubao-pro \
              DOUBAO_LITE_ENDPOINT_ID=ep-test-doubao-lite \
              "./bin/${vendor}-adapter" \
              > "/tmp/he-api/logs/${vendor}-adapter.log" 2>&1 &
            pid_var="${prefix}_ADAPTER_PID"
            echo "${pid_var}=$!" >> "$GITHUB_ENV"
          done

      # Story 4.8 T2.6 / BR-1.3 — Readiness checks for the twelve adapter-
      # related processes BEFORE starting auth-svc / api-gateway. Total budget
      # ≤ 60s (per-port `nc -z` poll inherited from Story-3.3 pattern).
      - name: Wait for adapter mesh readiness
        run: |
          set -e
          for port in 19000 19010 19020 19030 19040 19050 19001 19011 19021 19031 19041 19051; do
            for i in $(seq 1 60); do
              if nc -z localhost "$port" 2>/dev/null; then
                echo "port $port ready"
                break
              fi
              if [ "$i" = 60 ]; then
                echo "::error::port $port did not ready within 60s"
                for log in /tmp/he-api/logs/*.log; do
                  echo "::group::$log"
                  tail -n 50 "$log" || true
                  echo "::endgroup::"
                done
                exit 1
              fi
              sleep 1
            done
          done

      - name: Start auth-svc (background)
        env:
          HE_API_DB_POSTGRES_URI: ${{ env.HE_API_DATABASE_URL }}
          HE_API_DB_REDIS_URI: ${{ env.HE_API_REDIS_URL }}
          HE_API_JWT_PRIVATE_KEY_PATH: /tmp/he-api/private_key.pem
          HE_API_JWT_PUBLIC_KEY_PATH: /tmp/he-api/public_key.pem
        run: |
          go run ./apps/auth-svc/cmd/server > /tmp/he-api/logs/auth-svc.log 2>&1 &
          echo "AUTH_SVC_PID=$!" >> "$GITHUB_ENV"
          # crude readiness wait
          for i in $(seq 1 30); do
            if nc -z localhost 9090 2>/dev/null; then echo "auth-svc up"; break; fi
            sleep 1
          done

      # Story 4.8 T2.4 — Story-4.1..4.6 *_ADAPTER_ENDPOINT env vars wire the
      # gateway's adapterclient.Registry to the six adapter processes started
      # above; the registry then resolves ALL 10 vendor model-ids.
      - name: Start api-gateway (background)
        env:
          HE_API_DEPLOY_ENV: development
          DEEPSEEK_ADAPTER_ENDPOINT: http://localhost:19001
          QWEN_ADAPTER_ENDPOINT: http://localhost:19011
          KIMI_ADAPTER_ENDPOINT: http://localhost:19021
          GLM_ADAPTER_ENDPOINT: http://localhost:19031
          DOUBAO_ADAPTER_ENDPOINT: http://localhost:19041
          ERNIE_ADAPTER_ENDPOINT: http://localhost:19051
        run: |
          go run ./apps/api-gateway/cmd/server > /tmp/he-api/logs/gateway.log 2>&1 &
          echo "GATEWAY_PID=$!" >> "$GITHUB_ENV"
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/health >/dev/null 2>&1; then echo "gateway up"; break; fi
            sleep 1
          done

      - name: Run OpenAI SDK contract test
        env:
          HE_API_TEST_GATEWAY_URL: http://localhost:8080
          HE_API_TEST_API_KEY: ${{ steps.issue-key.outputs.api_key }}
        run: pytest apps/api-gateway/tests/ -v --junitxml=/tmp/he-api/pytest-report.xml

      # Story 4.8 T2.7 / BR-1.8 — Upload process logs + JUnit XML on failure
      # so operators can correlate contract violations to specific processes.
      - name: Upload contract-test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gateway-openai-sdk-contract-artifacts
          path: |
            /tmp/he-api/logs/*.log
            /tmp/he-api/pytest-report.xml
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop background services
        if: always()
        run: |
          [ -n "${GATEWAY_PID:-}" ]         && kill "$GATEWAY_PID"         || true
          [ -n "${AUTH_SVC_PID:-}" ]        && kill "$AUTH_SVC_PID"        || true
          [ -n "${DEEPSEEK_ADAPTER_PID:-}" ] && kill "$DEEPSEEK_ADAPTER_PID" || true
          [ -n "${QWEN_ADAPTER_PID:-}" ]     && kill "$QWEN_ADAPTER_PID"     || true
          [ -n "${KIMI_ADAPTER_PID:-}" ]     && kill "$KIMI_ADAPTER_PID"     || true
          [ -n "${GLM_ADAPTER_PID:-}" ]      && kill "$GLM_ADAPTER_PID"      || true
          [ -n "${DOUBAO_ADAPTER_PID:-}" ]   && kill "$DOUBAO_ADAPTER_PID"   || true
          [ -n "${ERNIE_ADAPTER_PID:-}" ]    && kill "$ERNIE_ADAPTER_PID"    || true
          [ -n "${DEEPSEEK_FAKE_PID:-}" ]    && kill "$DEEPSEEK_FAKE_PID"    || true
          [ -n "${QWEN_FAKE_PID:-}" ]        && kill "$QWEN_FAKE_PID"        || true
          [ -n "${KIMI_FAKE_PID:-}" ]        && kill "$KIMI_FAKE_PID"        || true
          [ -n "${GLM_FAKE_PID:-}" ]         && kill "$GLM_FAKE_PID"         || true
          [ -n "${DOUBAO_FAKE_PID:-}" ]      && kill "$DOUBAO_FAKE_PID"      || true
          [ -n "${ERNIE_FAKE_PID:-}" ]       && kill "$ERNIE_FAKE_PID"       || true

  # Story 10.2 T4.1 — he-api Python SDK lane (the repo's first PUBLISHABLE Python
  # package). Mirrors the `gateway / openai-sdk-contract` paradigm (setup-python +
  # pip + pytest) but is fully HERMETIC: respx mocks the httpx transport, so NO
  # gateway / Postgres / Redis is needed. The live drop-in arm (10.2-E2E-001)
  # skips automatically because HE_API_TEST_GATEWAY_URL is unset here (R-OQ-5).
  sdk-python:
    name: sdk-python
    runs-on: ubuntu-22.04
    needs: [unit-go]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install he-api SDK + test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e "packages/sdk-python[test]" ruff

      - name: Lint (ruff — scoped to the SDK package only)
        run: ruff check packages/sdk-python/he_api packages/sdk-python/tests

      - name: Build + twine check (artifact-only; real publish deferred to 10.7)
        run: |
          python -m build --no-isolation packages/sdk-python
          twine check packages/sdk-python/dist/*

      - name: Run hermetic test suite
        run: pytest packages/sdk-python/tests -v --junitxml=/tmp/sdk-python-report.xml

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sdk-python-artifacts
          path: /tmp/sdk-python-report.xml
          if-no-files-found: ignore
          retention-days: 7

  # Story 10.5 — docs site (@he-api/docs, Docusaurus 3.x). The CI关口 for a static,
  # presentation-only site is: (1) `build` — Docusaurus `onBrokenLinks/onBrokenAnchors:
  # 'throw'` IS the dead-link gate (AC1, INT-001/002), and it renders all 10 locales;
  # (2) `lint` — the structural-completeness gate (BLOCK on a hard-missing en section /
  # locale-set ≠ 10; WARN on MT-unproofed → 10.7) + the API-Reference↔rest-api-spec §5.1
  # anti-drift gate (AC2/AC1, INT-004/005/006/012/015); (3) Playwright e2e — home/sections
  # reachable, ar RTL + LTR-island, language switch, en fallback (AC1/AC2 E2E). Mirrors the
  # console-e2e paradigm; root `unit-ts` does not cover docs (no vitest).
  docs-build-e2e:
    name: docs / build-e2e
    runs-on: ubuntu-22.04
    needs: [unit-ts]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: apps/docs
        run: pnpm exec playwright install --with-deps chromium

      - name: Build docs (10 locales + dead-link/anchor gate)
        run: pnpm --filter @he-api/docs build

      - name: Lint (completeness gate + API-Reference anti-drift gate)
        run: pnpm --filter @he-api/docs lint

      - name: Run Playwright e2e
        working-directory: apps/docs
        env:
          CI: '1'
        run: pnpm exec playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-playwright-report
          path: apps/docs/playwright-report
          if-no-files-found: ignore
          retention-days: 7
