name: test

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  unit-ts:
    name: unit-ts
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # version resolved from packageManager field in root package.json

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Run tests (vitest via turbo)
        run: pnpm test

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-ts
          path: |
            packages/*/coverage/**
            apps/*/coverage/**
          if-no-files-found: ignore
          retention-days: 7

  unit-go:
    name: unit-go
    runs-on: ubuntu-22.04
    env:
      CGO_ENABLED: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Run go test (race + coverage)
        run: |
          go test ./apps/api-gateway/... -count=1 -race -coverprofile=coverage.out

      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage.out ]; then
            go tool cover -func=coverage.out | tail -1 >> "$GITHUB_STEP_SUMMARY"
          else
            echo "no coverage.out produced" >> "$GITHUB_STEP_SUMMARY"
          fi

  # Story 1.5 Q4 ruling — vendored Go gen drift detection. CI runs
  # `buf generate` and fails if `packages/proto/gen/` differs from committed
  # state, catching any proto edit that did not refresh the generated code.
  buf-generate-drift:
    name: buf-generate-drift
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - uses: bufbuild/buf-setup-action@v1
        with:
          version: 1.34.0

      - name: Install protoc plugins (Go + connect-go)
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.34.2
          go install connectrpc.com/connect/cmd/protoc-gen-connect-go@v1.16.2
          echo "$(go env GOBIN || echo $(go env GOPATH)/bin)" >> "$GITHUB_PATH"

      - name: buf lint
        working-directory: packages/proto
        run: buf lint

      - name: buf generate && git diff --exit-code packages/proto/gen
        working-directory: packages/proto
        run: |
          buf generate
          cd "${GITHUB_WORKSPACE}"
          git diff --exit-code packages/proto/gen/ || {
            echo "::error::vendored generated code is out of date — run 'buf generate' under packages/proto and commit the result" >&2
            exit 1
          }

  # Story 2.1 — Console e2e (Playwright × chromium/firefox/webkit). Root `unit-ts`
  # already covers console Vitest via Turborepo dispatch (M-2 ruling — no per-app
  # unit-tests / lint duplicate jobs).
  console-e2e-tests:
    name: console / e2e-tests
    runs-on: ubuntu-22.04
    needs: [unit-ts]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: apps/console
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Build console
        run: pnpm --filter @he-api/console build

      - name: Run Playwright tests
        working-directory: apps/console
        env:
          CI: '1'
        run: pnpm exec playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/console/playwright-report
          if-no-files-found: ignore
          retention-days: 7

  # Story 2.1 — Architect Q5 ruling: codegen drift + messages completeness + bundle
  # budget run sequentially in one job (4 steps per BR-4.8). Failure of any step
  # blocks the PR.
  console-i18n-keys-completeness:
    name: console / i18n-keys-completeness
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: 1/4 — Build @he-api/i18n-keys (codegen + tsc)
        run: pnpm --filter @he-api/i18n-keys build

      - name: 2/4 — git diff drift detection (packages/i18n-keys/src/)
        run: |
          git diff --exit-code packages/i18n-keys/src/ || {
            echo "::error::packages/i18n-keys/src drift — run 'pnpm --filter @he-api/i18n-keys build' and commit" >&2
            exit 1
          }

      - name: 3/4 — Messages completeness check
        run: pnpm exec tsx scripts/check-i18n-keys.ts

      - name: 4/4 — Bundle size budget (size-limit)
        run: |
          pnpm --filter @he-api/console build
          cd apps/console && pnpm exec size-limit

  integration:
    name: integration
    runs-on: ubuntu-22.04
    needs: [unit-ts, unit-go, buf-generate-drift, console-i18n-keys-completeness]
    steps:
      - uses: actions/checkout@v4

      - name: Integration placeholder
        run: |
          echo "integration tests deferred to Story 1.6"
          exit 0
