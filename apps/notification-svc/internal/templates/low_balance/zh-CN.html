<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>余额不足提醒</title>
</head>
<body style="font-family: -apple-system, Segoe UI, Roboto, sans-serif; max-width: 560px; margin: 24px auto; color: #1f2937;">
  <h1 style="font-size: 20px; margin-bottom: 16px;">您的 He-API 余额不足</h1>
  <p>您好 {{.display_name}}，</p>
  <p>您的账户余额为 <strong>${{.current_balance}}</strong>，已低于您设置的余额预警阈值 <strong>${{.threshold}}</strong>。</p>
  <p>为避免 API 流量因余额耗尽而中断，请在控制台为账户充值或开启自动充值。</p>
  <p style="font-size: 13px; color: #6b7280; margin-top: 32px;">如果这不是您预期的情况，请在控制台查看您的用量。</p>
</body>
</html>
