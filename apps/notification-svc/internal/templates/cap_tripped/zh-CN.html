<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>已达到月度消费上限</title>
</head>
<body style="font-family: -apple-system, Segoe UI, Roboto, sans-serif; max-width: 560px; margin: 24px auto; color: #1f2937;">
  <h1 style="font-size: 20px; margin-bottom: 16px;">您的 API 密钥已暂停</h1>
  <p>您好 {{.display_name}}，</p>
  <p>您的 API 密钥 "<strong>{{.key_name}}</strong>" 已达到月度消费上限 <strong>${{.cap_usd}}</strong>，现已被暂停。</p>
  <p>该密钥将在下一个 UTC 月份开始时自动恢复。如需提前恢复，请在控制台提高上限。</p>
  <p style="font-size: 13px; color: #6b7280; margin-top: 32px;">如果这不是您预期的操作，请在控制台查看该密钥的活动记录。</p>
</body>
</html>
