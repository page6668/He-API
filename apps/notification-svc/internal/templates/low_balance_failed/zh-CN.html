<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>自动充值失败</title>
</head>
<body style="font-family: -apple-system, Segoe UI, Roboto, sans-serif; max-width: 560px; margin: 24px auto; color: #1f2937;">
  <h1 style="font-size: 20px; margin-bottom: 16px;">自动充值失败 — 请更新您的支付方式</h1>
  <p>您好 {{.display_name}}，</p>
  <p>由于您的余额（<strong>${{.current_balance}}</strong>）已低于阈值 <strong>${{.threshold}}</strong>，我们尝试为您的 He-API 账户自动充值，但向您保存的支付方式扣款被拒绝。</p>
  <p>请在控制台更新您的支付方式以保持自动充值正常工作。在此之前，您的余额将不会自动充值。</p>
  <p style="font-size: 13px; color: #6b7280; margin-top: 32px;">如果这不是您预期的情况，请在控制台查看您的账单设置。</p>
</body>
</html>
