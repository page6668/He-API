<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>He-API データエクスポートの準備ができました</title>
</head>
<body style="font-family: -apple-system, Segoe UI, Roboto, sans-serif; max-width: 560px; margin: 24px auto; color: #1f2937;">
  <h1 style="font-size: 20px; margin-bottom: 16px;">データエクスポートの準備ができました</h1>
  <p>{{.display_name}} さん、</p>
  <p>データエクスポートを生成しました。下のボタンからダウンロードしてください。</p>
  <p style="margin: 24px 0;">
    <a href="{{.signed_url}}" style="display: inline-block; padding: 12px 20px; background: #2563eb; color: #ffffff; text-decoration: none; border-radius: 6px;">データをダウンロード</a>
  </p>
  <p style="font-size: 13px; color: #6b7280;">ボタンが動作しない場合は、以下のリンクをブラウザにコピーしてください:</p>
  <p style="font-size: 13px; word-break: break-all;"><a href="{{.signed_url}}">{{.signed_url}}</a></p>
  <p style="font-size: 13px; color: #6b7280; margin-top: 32px;">リンクは {{.expires_at}} に失効します。 このエクスポートをリクエストしていない場合は、すぐにサポートにご連絡ください。</p>
</body>
</html>
