<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>He-API 데이터 내보내기가 준비되었습니다</title>
</head>
<body style="font-family: -apple-system, Segoe UI, Roboto, sans-serif; max-width: 560px; margin: 24px auto; color: #1f2937;">
  <h1 style="font-size: 20px; margin-bottom: 16px;">데이터 내보내기가 준비되었습니다</h1>
  <p>{{.display_name}}님 안녕하세요,</p>
  <p>데이터 내보내기가 생성되었습니다. 아래 버튼을 클릭하여 다운로드하세요.</p>
  <p style="margin: 24px 0;">
    <a href="{{.signed_url}}" style="display: inline-block; padding: 12px 20px; background: #2563eb; color: #ffffff; text-decoration: none; border-radius: 6px;">내 데이터 다운로드</a>
  </p>
  <p style="font-size: 13px; color: #6b7280;">버튼이 작동하지 않으면 아래 링크를 브라우저에 복사하세요:</p>
  <p style="font-size: 13px; word-break: break-all;"><a href="{{.signed_url}}">{{.signed_url}}</a></p>
  <p style="font-size: 13px; color: #6b7280; margin-top: 32px;">링크는 {{.expires_at}}에 만료됩니다. 이 내보내기를 요청하지 않으셨다면 즉시 지원팀에 문의해 주세요.</p>
</body>
</html>
