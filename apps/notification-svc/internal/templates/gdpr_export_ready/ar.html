<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>تصدير بيانات He-API جاهز</title>
</head>
<body style="font-family: -apple-system, Segoe UI, Roboto, sans-serif; max-width: 560px; margin: 24px auto; color: #1f2937;">
  <h1 style="font-size: 20px; margin-bottom: 16px;">تصدير البيانات جاهز</h1>
  <p>مرحبًا {{.display_name}}،</p>
  <p>تم إنشاء تصدير بياناتك. انقر الزر أدناه لتنزيله.</p>
  <p style="margin: 24px 0;">
    <a href="{{.signed_url}}" style="display: inline-block; padding: 12px 20px; background: #2563eb; color: #ffffff; text-decoration: none; border-radius: 6px;">تنزيل بياناتي</a>
  </p>
  <p style="font-size: 13px; color: #6b7280;">إذا لم يعمل الزر، انسخ هذا الرابط إلى متصفحك:</p>
  <p style="font-size: 13px; word-break: break-all;"><a href="{{.signed_url}}">{{.signed_url}}</a></p>
  <p style="font-size: 13px; color: #6b7280; margin-top: 32px;">تنتهي صلاحية الرابط في {{.expires_at}}. إذا لم تطلب هذا التصدير، يُرجى التواصل مع الدعم فورًا.</p>
</body>
</html>
